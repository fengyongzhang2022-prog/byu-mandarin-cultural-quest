<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="面向BYU高级中文学习者的沉浸式文化角色扮演任务">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>寻迹 · 土地有灵</title>
  <style>
    :root{--paper:#f3eddf;--ink:#101511;--red:#b64a32;--gold:#d0b06d;--line:rgba(243,237,223,.2);--serif:"Noto Serif SC","Songti SC",STSong,serif;--sans:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#0c110e;color:var(--paper);font-family:var(--sans);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .world{position:fixed;inset:0;isolation:isolate;background:#0c110e}.world::before{content:"";position:absolute;inset:-2%;z-index:-3;background-image:var(--scene);background-position:center;background-size:cover;transition:opacity .45s,transform 1.2s cubic-bezier(.16,1,.3,1);animation:breathe 16s ease-in-out infinite alternate}.world::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(5,9,7,.58) 0%,rgba(5,9,7,.04) 34%,rgba(5,9,7,.24) 58%,rgba(5,9,7,.96) 100%),linear-gradient(90deg,rgba(5,9,7,.5),transparent 52%)}@keyframes breathe{to{transform:scale(1.045) translate(-.4%,-.3%)}}.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E")}
    .topbar{position:absolute;inset:0 0 auto;z-index:20;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid var(--line);background:linear-gradient(rgba(8,12,10,.52),transparent);font-size:11px;letter-spacing:.12em}.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:14px}.seal{width:29px;height:29px;display:grid;place-items:center;border:1px solid rgba(243,237,223,.72);color:var(--gold)}.mission-nav{display:flex;align-items:center;gap:12px}.clock{font-variant-numeric:tabular-nums;color:rgba(243,237,223,.72)}.research-link,.logout{color:rgba(243,237,223,.58);text-decoration:none;border:0;background:transparent;font-size:10px}.sound{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:rgba(8,12,10,.32);color:var(--paper)}
    .steps{position:absolute;z-index:20;right:clamp(18px,4vw,54px);top:50%;transform:translateY(-50%);display:grid;gap:12px}.dot{width:7px;height:7px;border:1px solid rgba(243,237,223,.48);border-radius:50%;background:transparent;transition:.25s}.dot.active{background:var(--gold);border-color:var(--gold);transform:scale(1.45)}.dot.done{background:rgba(243,237,223,.55)}
    .opening{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;padding:0 clamp(22px,8vw,120px) clamp(48px,10vh,105px);background:linear-gradient(90deg,rgba(5,9,7,.88),rgba(5,9,7,.12) 72%),linear-gradient(0deg,rgba(5,9,7,.78),transparent 62%)}.opening-inner{max-width:720px}.eyebrow{margin:0 0 16px;color:var(--gold);font-size:10px;letter-spacing:.22em;text-transform:uppercase}.opening h1{margin:0;font:500 clamp(54px,9vw,128px)/.94 var(--serif);letter-spacing:-.07em}.opening h1 em{font-style:normal;color:#d66043}.opening p{max-width:560px;margin:22px 0 30px;font:400 clamp(17px,2vw,23px)/1.65 var(--serif);color:rgba(243,237,223,.82)}
    .cta{min-height:52px;padding:0 22px;border:0;background:var(--red);color:#fff8ee;font-weight:700;letter-spacing:.08em}.cta:hover{background:#cf583d;transform:translateY(-1px)}.ghost{min-height:45px;padding:0 16px;border:1px solid var(--line);background:rgba(8,12,10,.34);color:var(--paper);backdrop-filter:blur(10px)}.ghost:hover{border-color:rgba(243,237,223,.55)}.ghost:disabled,.cta:disabled{opacity:.4;cursor:not-allowed}
    .sheet{position:absolute;z-index:10;left:clamp(18px,6vw,92px);right:clamp(18px,9vw,140px);bottom:clamp(18px,5vh,52px);max-width:940px;padding:22px 0 0;border-top:1px solid rgba(243,237,223,.4);animation:rise .5s cubic-bezier(.16,1,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(22px)}}.scene-label{margin:0 0 9px;color:var(--gold);font-size:9px;letter-spacing:.2em;text-transform:uppercase}.sheet h2{max-width:780px;margin:0;font:500 clamp(28px,4.2vw,60px)/1.12 var(--serif);letter-spacing:-.035em;text-wrap:balance}.line{max-width:720px;margin:12px 0 0;color:rgba(243,237,223,.74);font:400 clamp(14px,1.6vw,18px)/1.65 var(--serif)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}.back{position:absolute;left:-46px;bottom:2px;width:34px;height:34px;border:0;background:transparent;color:rgba(243,237,223,.55);font-size:22px}.status{font-size:11px;color:rgba(243,237,223,.58)}
    .passport{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;max-width:620px;margin-top:20px}.field{min-height:50px;border:1px solid var(--line);background:rgba(5,9,7,.58);color:var(--paper);padding:0 15px}.field::placeholder{color:rgba(243,237,223,.42)}.consent{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:rgba(243,237,223,.64)}
    .transcript{min-height:48px;max-height:86px;overflow:auto;margin:12px 0 0;padding:13px 15px;border-left:2px solid var(--gold);background:rgba(5,9,7,.5);color:rgba(243,237,223,.82);font:400 15px/1.55 var(--serif)}.mic{width:52px;height:52px;border:1px solid rgba(243,237,223,.45);border-radius:50%;background:rgba(8,12,10,.48);color:var(--paper);font-size:19px}.mic.live{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(182,74,50,0)}}
    .hotspots{position:absolute;inset:80px 6vw 33vh;z-index:8}.hotspot{position:absolute;width:34px;height:34px;border:1px solid white;border-radius:50%;background:rgba(8,12,10,.42);color:white;box-shadow:0 0 0 9px rgba(255,255,255,.08);animation:pulsePoint 2s infinite}.hotspot.done{background:var(--red);border-color:var(--red)}@keyframes pulsePoint{50%{box-shadow:0 0 0 17px rgba(255,255,255,0)}}.clue{position:absolute;z-index:9;max-width:290px;padding:14px 16px;background:rgba(10,15,12,.9);border:1px solid var(--line);backdrop-filter:blur(16px);font:400 14px/1.6 var(--serif)}
    .dialogue{max-width:760px;max-height:25vh;overflow:auto;margin-top:15px;display:grid;gap:9px}.bubble{width:fit-content;max-width:min(620px,90%);padding:11px 14px;background:rgba(8,12,10,.62);border-left:2px solid var(--gold);font:400 15px/1.55 var(--serif)}.bubble.me{justify-self:end;border-left:0;border-right:2px solid var(--red)}.replay{margin-left:8px;padding:2px 6px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--gold);font-size:10px}.talk-row{display:flex;align-items:center;gap:10px;margin-top:13px}.talk-row .field{flex:1}.voice-note{font-size:10px;color:rgba(243,237,223,.52)}
    .camera-wrap{display:grid;grid-template-columns:minmax(250px,500px) 1fr;gap:18px;align-items:end;margin-top:16px}.camera{position:relative;aspect-ratio:16/9;overflow:hidden;background:#080b09;border:1px solid var(--line)}video{width:100%;height:100%;object-fit:cover}.rec{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:7px;padding:6px 9px;background:rgba(7,9,8,.72);font-size:10px;letter-spacing:.08em}.rec i{width:8px;height:8px;border-radius:50%;background:#d5573c}.cue{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.cue span{padding:6px 9px;border:1px solid var(--line);color:rgba(243,237,223,.65);font-size:10px}.count{font:500 46px/1 var(--serif);font-variant-numeric:tabular-nums}.video-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.post-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.rate{padding:10px 13px;border:1px solid var(--line);background:rgba(8,12,10,.44);color:var(--paper)}.rate.selected{background:var(--red);border-color:var(--red)}
    .evidence-button{min-height:34px;padding:0 11px;border:1px solid var(--line);background:rgba(8,12,10,.32);color:var(--paper);font-size:10px}.evidence-panel{position:fixed;z-index:40;right:18px;top:78px;width:min(360px,calc(100vw - 36px));padding:18px;background:rgba(11,16,13,.94);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.3)}.evidence-panel h3{margin:0 0 12px;font:500 20px var(--serif)}.evidence-item{padding:10px 0;border-top:1px solid var(--line);font:400 13px/1.55 var(--serif)}.evidence-item strong{display:block;color:var(--gold);font-family:var(--sans);font-size:10px;letter-spacing:.08em}.evidence-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.evidence-strip span{padding:6px 9px;background:rgba(5,9,7,.54);border:1px solid var(--line);color:rgba(243,237,223,.72);font-size:10px}.prompt-cues{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.prompt-cues span{padding:7px 10px;border:1px solid var(--line);color:rgba(243,237,223,.7);font-size:11px}
    .toast{position:fixed;z-index:50;left:50%;bottom:22px;transform:translate(-50%,20px);padding:10px 14px;background:var(--paper);color:var(--ink);font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.research-link{display:none}.steps{right:14px}.sheet{right:34px;bottom:20px}.opening{padding-left:22px}.opening h1{font-size:64px}.camera-wrap{grid-template-columns:1fr}.camera{max-height:31vh}.passport{grid-template-columns:1fr}.back{display:none}.sheet h2{font-size:31px}.line{font-size:14px}.hotspots{inset:70px 20px 40vh}}
  </style>
</head>
<body>
  <main class="world" id="world" style="--scene:url('/assets/earth-shrine-hero.png')">
    <div class="grain"></div>
    <header class="topbar"><div class="brand"><span class="seal">迹</span><span>土地有灵</span></div><div class="mission-nav"><button class="evidence-button hidden" id="evidenceButton">证据袋 0/3</button><span class="clock" id="clock">08:00</span><a class="research-link hidden" id="researchLink" href="/teacher.html">研究端</a><button class="logout" id="logout">退出</button><button class="sound" id="sound" title="声音">声</button></div></header>
    <nav class="steps hidden" id="steps" aria-label="任务进度"></nav>
    <section class="opening" id="opening"><div class="opening-inner"><p class="eyebrow">BYU MANDARIN · CULTURAL QUEST 01</p><h1>土地<br><em>有灵</em></h1><p>山门将在八分钟后关闭。Maya把眼前的土地庙叫作“中国的教堂”——你要带她找到更准确的说法。</p><button class="cta" id="enter">进入故事 →</button></div></section>
    <section class="sheet hidden" id="sheet"></section><div class="hotspots hidden" id="hotspots"></div>
  </main><aside class="evidence-panel hidden" id="evidencePanel"></aside><div class="toast" id="toast"></div>
  <script>
    const scenes=[{key:'pre',label:'入境',image:'/assets/earth-shrine-hero.png'},{key:'discover',label:'寻迹',image:'/assets/shrine-clues.png'},{key:'interact',label:'问灵',image:'/assets/earth-god-dialogue.png'},{key:'compare',label:'辨义',image:'/assets/maya-dialogue.png'},{key:'explain',label:'讲述',image:'/assets/open-gate-finale.png'},{key:'post',label:'回望',image:'/assets/open-gate-finale.png'}];
    const state={index:0,participant:'',consent:false,remaining:480,timer:null,found:[],preTranscript:'',histories:{interact:[],compare:[]},videoTranscript:'',videoBlob:null,videoUrl:'',postRating:0,startedAt:'',events:[]};
    const world=document.getElementById('world'),opening=document.getElementById('opening'),sheet=document.getElementById('sheet'),steps=document.getElementById('steps'),hotspots=document.getElementById('hotspots'),clock=document.getElementById('clock'),toast=document.getElementById('toast'),evidenceButton=document.getElementById('evidenceButton'),evidencePanel=document.getElementById('evidencePanel');let activeRecognition=null,mediaRecorder=null,mediaStream=null,recordTimer=null,recordSeconds=60;
    fetch('/api/auth/me').then(r=>r.json()).then(user=>{if(user.role==='teacher')document.getElementById('researchLink').classList.remove('hidden')});document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login.html'};
    function log(type,data={}){state.events.push({at:new Date().toISOString(),type,...data});saveSession()}function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}function escapeHTML(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function startTimer(){if(state.timer)return;state.startedAt=new Date().toISOString();state.timer=setInterval(()=>{state.remaining=Math.max(0,state.remaining-1);clock.textContent=`${String(Math.floor(state.remaining/60)).padStart(2,'0')}:${String(state.remaining%60).padStart(2,'0')}`},1000)}function renderSteps(){steps.innerHTML=scenes.map((s,i)=>`<i class="dot ${i===state.index?'active':i<state.index?'done':''}" title="${s.label}"></i>`).join('')}function go(index){stopRecognition();state.index=Math.max(0,Math.min(scenes.length-1,index));world.style.setProperty('--scene',`url('${scenes[state.index].image}')`);hotspots.classList.add('hidden');evidencePanel.classList.add('hidden');evidenceButton.classList.toggle('hidden',state.index<1);updateEvidence();renderSteps();render();log('stage_view',{stage:scenes[state.index].key})}function nav(){return `<button class="back" data-action="back" aria-label="返回">←</button>`}function bindNav(){const back=sheet.querySelector('[data-action="back"]');if(back)back.onclick=()=>go(state.index-1)}
    function render(){const key=scenes[state.index].key;if(key==='pre')renderPre();if(key==='discover')renderDiscover();if(key==='interact')renderTalk('interact');if(key==='compare')renderTalk('compare');if(key==='explain')renderExplain();if(key==='post')renderPost();bindNav()}document.getElementById('enter').onclick=()=>{opening.classList.add('hidden');sheet.classList.remove('hidden');steps.classList.remove('hidden');startTimer();go(0)};document.getElementById('sound').onclick=()=>{speechSynthesis.cancel();speak('风穿过山门。远处传来钟声。','narrator');showToast('环境声音已开启')};
    function renderPre(){sheet.innerHTML=`${nav()}<p class="scene-label">入境记录 · 前测</p><h2>如果朋友从没见过土地庙，你会怎样介绍它？</h2><p class="line">按你现在的理解说就好，不知道也可以直接说。不查资料，没有标准答案。</p><div class="prompt-cues"><span>它是什么？</span><span>人们可能做什么？</span><span>它为什么有意义？</span></div><div class="passport"><input class="field" id="pid" maxlength="24" placeholder="匿名参与者编号，例如 BYU-021" value="${escapeHTML(state.participant)}"><button class="ghost" id="preMic">● 开口回答</button></div><p class="transcript" id="preText">${escapeHTML(state.preTranscript)||'说20–30秒。你的原始理解会留在这里，旅程结束后再比较。'}</p><label class="consent"><input id="consent" type="checkbox" ${state.consent?'checked':''}> 我同意把匿名回答用于课程研究；可随时退出。</label><div class="actions"><button class="cta" id="preNext">留下记录，进山 →</button><span class="status">约30秒</span></div>`;const pid=document.getElementById('pid'),consent=document.getElementById('consent'),preText=document.getElementById('preText');pid.oninput=()=>state.participant=pid.value.trim();consent.onchange=()=>state.consent=consent.checked;document.getElementById('preMic').onclick=e=>toggleRecognition(e.currentTarget,text=>{state.preTranscript=(state.preTranscript+' '+text).trim();preText.textContent=state.preTranscript},'zh-CN');document.getElementById('preNext').onclick=()=>{if(!state.participant)return showToast('请先填写匿名编号');if(!state.consent)return showToast('请确认研究同意');if(!state.preTranscript)return showToast('请先留下口头前测');log('pretest_complete',{transcript:state.preTranscript});go(1)}}
    const clueData=[{id:'place',x:24,y:49,label:'山路旁的小神龛',note:'位置很小、很近，也与这个地方相连。'},{id:'practice',x:53,y:58,label:'香与供物',note:'有人上香祈求平安，也有人只是路过或记起家乡。'},{id:'game',x:78,y:36,label:'旅行者留下的光',note:'游戏把“停留与守护”改编成休息和传送。'}];
    function renderDiscover(){sheet.innerHTML=`${nav()}<p class="scene-label">发现文化 · 01</p><h2>找到三条证据。等会儿用它们追问土地公、回应Maya。</h2><p class="line" id="clueCount">证据袋：${state.found.length}/3</p><div class="actions"><button class="cta" id="discoverNext" ${state.found.length<3?'disabled':''}>带着证据去问土地公 →</button></div>`;hotspots.classList.remove('hidden');hotspots.innerHTML=clueData.map(c=>`<button class="hotspot ${state.found.includes(c.id)?'done':''}" style="left:${c.x}%;top:${c.y}%" data-id="${c.id}" aria-label="${c.label}">${state.found.includes(c.id)?'✓':'·'}</button>`).join('');hotspots.querySelectorAll('button').forEach(b=>b.onclick=()=>revealClue(b));document.getElementById('discoverNext').onclick=()=>go(2)}function revealClue(button){const c=clueData.find(x=>x.id===button.dataset.id);if(!state.found.includes(c.id))state.found.push(c.id);button.classList.add('done');button.textContent='✓';document.querySelector('.clue')?.remove();const note=document.createElement('div');note.className='clue';note.style.left=`min(${c.x}%, calc(100% - 300px))`;note.style.top=`${Math.max(5,c.y-4)}%`;note.innerHTML=`<strong>${c.label}</strong><br>${c.note}`;hotspots.append(note);document.getElementById('clueCount').textContent=`证据袋：${state.found.length}/3`;document.getElementById('discoverNext').disabled=state.found.length<3;updateEvidence();log('clue_found',{clue:c.id});setTimeout(()=>note.remove(),3600)}
    function updateEvidence(){evidenceButton.textContent=`证据袋 ${state.found.length}/3`;evidencePanel.innerHTML=`<h3>随身证据</h3>${clueData.filter(c=>state.found.includes(c.id)).map(c=>`<div class="evidence-item"><strong>${c.label}</strong>${c.note}</div>`).join('')||'<div class="evidence-item">还没有找到线索。</div>'}`}
    evidenceButton.onclick=()=>evidencePanel.classList.toggle('hidden');
    const talkConfig={interact:{tag:'AI角色互动 · 02',title:'土地公就在火光里。你想问什么？',actor:'土地公',opening:'你看见了三条线索。哪一条最让你意外？',next:'带着他的回答去找Maya →'},compare:{tag:'跨文化协商 · 03',title:'Maya仍然觉得：“这就是Chinese church吧？”',actor:'Maya',opening:'我知道它不完全是教堂，但这个说法不是很方便吗？',next:'准备你的最终讲述 →'}};
    function renderTalk(mode){const c=talkConfig[mode],history=state.histories[mode],userTurns=history.filter(m=>m.role==='user').length;sheet.innerHTML=`${nav()}<p class="scene-label">${c.tag}</p><h2>${c.title}</h2><div class="evidence-strip"><span>山路神龛</span><span>香与供物</span><span>游戏改编</span></div><div class="dialogue" id="dialogue"><div class="bubble">${c.actor}：${c.opening}<button class="replay" data-opening="1" title="重听">声</button></div>${history.map((m,i)=>`<div class="bubble ${m.role==='user'?'me':''}">${m.role==='user'?'你':c.actor}：${escapeHTML(m.content)}${m.role==='assistant'?`<button class="replay" data-replay="${i}" title="重听">声</button>`:''}</div>`).join('')}</div><div class="talk-row"><button class="mic" id="talkMic" title="开口说">●</button><input class="field" id="talkInput" placeholder="点麦克风继续问；你可以问很多次"><button class="ghost" id="sendTalk">送出</button></div><div class="actions"><button class="cta" id="talkNext" ${userTurns<2?'disabled':''}>${userTurns<2?`再问 ${2-userTurns} 次`:'我问清楚了 · '+c.next}</button><span class="voice-note" id="voiceStatus">已说 ${userTurns} 次 · AI会用中文开口回应 · 可不限次数追问</span></div>`;const input=document.getElementById('talkInput'),mic=document.getElementById('talkMic');mic.onclick=()=>toggleRecognition(mic,text=>{input.value=(input.value+' '+text).trim();sendTalk(mode,input.value)},'zh-CN');document.getElementById('sendTalk').onclick=()=>sendTalk(mode,input.value);input.onkeydown=e=>{if(e.key==='Enter')sendTalk(mode,input.value)};document.querySelector('[data-opening]').onclick=()=>speak(c.opening,mode);document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>speak(history[Number(b.dataset.replay)].content,mode));document.getElementById('talkNext').onclick=()=>{if(userTurns>=2)go(state.index+1)};requestAnimationFrame(()=>document.getElementById('dialogue').scrollTop=9999)}
    async function sendTalk(mode,message){message=String(message||'').trim();if(!message)return showToast('先说一句中文');stopRecognition();state.histories[mode].push({role:'user',content:message,at:new Date().toISOString(),channel:'speech_or_text'});log('oral_turn',{stage:mode,role:'user',text:message});renderTalk(mode);const status=document.getElementById('voiceStatus');status.textContent='角色正在回应…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:mode,message,history:state.histories[mode]})});const data=await response.json();const reply=data.reply||'再说具体一点，我在听。';state.histories[mode].push({role:'assistant',content:reply,at:new Date().toISOString(),spoken:true});log('oral_turn',{stage:mode,role:'assistant',text:reply});renderTalk(mode);speak(reply,mode)}catch{const reply=mode==='interact'?'游戏里的功能和现实中的文化，完全一样吗？':'这个类比哪里有帮助，哪里又会误导我？';state.histories[mode].push({role:'assistant',content:reply,at:new Date().toISOString(),spoken:true});renderTalk(mode);speak(reply,mode)}}
    function availableVoices(){return new Promise(resolve=>{const now=speechSynthesis.getVoices();if(now.length)return resolve(now);let done=false;const finish=()=>{if(done)return;done=true;resolve(speechSynthesis.getVoices())};speechSynthesis.addEventListener('voiceschanged',finish,{once:true});setTimeout(finish,700)})}
    async function speak(text,role='narrator'){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const voices=await availableVoices(),zh=voices.filter(v=>/^zh(-|_)/i.test(v.lang)||/(Chinese|中文|普通话)/i.test(v.name));const preferences=role==='compare'?[/Xiaoxiao.*Natural/i,/Xiaoyi.*Natural/i,/HsiaoChen/i,/Xiaoxiao/i,/Huihui/i]:role==='interact'?[/Yunxi.*Natural/i,/Yunyang.*Natural/i,/Kangkang/i,/Yunxi/i,/Yunyang/i]:[/Xiaoxiao.*Natural/i,/Yunyang.*Natural/i,/Xiaoxiao/i];let voice=null;for(const pattern of preferences){voice=zh.find(v=>pattern.test(v.name));if(voice)break}voice=voice||zh.find(v=>/Natural|Online/i.test(v.name))||zh[0]||null;const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.voice=voice;u.rate=role==='interact'?.88:role==='compare'?.96:.9;u.pitch=role==='interact'?.82:role==='compare'?1.06:.96;u.volume=1;u.onstart=()=>log('voice_playback',{role,voice:voice?.name||'browser-default'});speechSynthesis.speak(u)}function toggleRecognition(button,onText,lang){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return showToast('请使用Chrome或Edge进行口语互动');if(activeRecognition){stopRecognition();return}const r=new SR();activeRecognition=r;r.lang=lang;r.interimResults=false;r.continuous=false;button.classList.add('live');r.onresult=e=>onText(e.results[e.results.length-1][0].transcript);r.onerror=()=>showToast('没有听清，请再说一次');r.onend=()=>{button.classList.remove('live');activeRecognition=null};r.start()}function stopRecognition(){if(activeRecognition){try{activeRecognition.stop()}catch{}activeRecognition=null}document.querySelectorAll('.mic.live').forEach(b=>b.classList.remove('live'))}
    function renderExplain(){sheet.innerHTML=`${nav()}<p class="scene-label">讲好中国故事 · 04</p><h2>山门要关了。看着Maya，讲一分钟。</h2><div class="camera-wrap"><div class="camera"><video id="camera" autoplay muted playsinline></video><div class="rec hidden" id="recBadge"><i></i> REC</div></div><div><div class="cue"><span>先回应Maya</span><span>用两条证据</span><span>说明类比局限</span><span>更准确地说</span></div><div class="count" id="count">01:00</div><p class="line">视频、声音和同步转写会一起保留。</p></div></div><p class="transcript" id="videoText">${escapeHTML(state.videoTranscript)||'你的讲述会在这里同步转写。'}</p><div class="video-actions"><button class="cta" id="recordVideo">开启摄像头</button><button class="ghost hidden" id="stopVideo">停止录制</button><button class="ghost hidden" id="playVideo">回看</button><button class="ghost hidden" id="downloadVideo">保存视频</button><button class="ghost" id="toPost" ${state.videoBlob?'':'disabled'}>提交讲述 →</button></div>`;document.getElementById('recordVideo').onclick=startVideo;document.getElementById('stopVideo').onclick=stopVideo;document.getElementById('playVideo').onclick=()=>{const v=document.getElementById('camera');v.muted=false;v.srcObject=null;v.src=state.videoUrl;v.controls=true;v.play()};document.getElementById('downloadVideo').onclick=downloadVideo;document.getElementById('toPost').onclick=()=>go(5);if(state.videoUrl){const v=document.getElementById('camera');v.src=state.videoUrl;v.controls=true;document.getElementById('playVideo').classList.remove('hidden');document.getElementById('downloadVideo').classList.remove('hidden')}}
    async function startVideo(){if(!navigator.mediaDevices?.getUserMedia)return showToast('浏览器不支持视频录制');try{mediaStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:true});const video=document.getElementById('camera');video.srcObject=mediaStream;await video.play();const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';const chunks=[];mediaRecorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{state.videoBlob=new Blob(chunks,{type:mediaRecorder.mimeType||'video/webm'});state.videoUrl=URL.createObjectURL(state.videoBlob);await storeVideo();log('video_complete',{seconds:60-recordSeconds,size:state.videoBlob.size,transcript:state.videoTranscript});renderExplain()};mediaRecorder.start(500);recordSeconds=60;document.getElementById('recordVideo').classList.add('hidden');document.getElementById('stopVideo').classList.remove('hidden');document.getElementById('recBadge').classList.remove('hidden');startVideoTranscript();recordTimer=setInterval(()=>{recordSeconds--;document.getElementById('count').textContent=`00:${String(recordSeconds).padStart(2,'0')}`;if(recordSeconds<=0)stopVideo()},1000);log('video_started')}catch{showToast('需要允许摄像头和麦克风权限')}}
    function startVideoTranscript(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();activeRecognition=r;r.lang='zh-CN';r.continuous=true;r.interimResults=false;r.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;state.videoTranscript=(state.videoTranscript+text).trim();const el=document.getElementById('videoText');if(el)el.textContent=state.videoTranscript};r.onend=()=>{if(mediaRecorder?.state==='recording')try{r.start()}catch{}};try{r.start()}catch{}}function stopVideo(){clearInterval(recordTimer);stopRecognition();if(mediaRecorder?.state==='recording')mediaRecorder.stop();mediaStream?.getTracks().forEach(t=>t.stop())}function downloadVideo(){if(!state.videoBlob)return;const a=document.createElement('a');a.href=state.videoUrl;a.download=`${state.participant||'participant'}-文化讲述.webm`;a.click()}
    function renderPost(){sheet.innerHTML=`${nav()}<p class="scene-label">后测 · 05</p><h2>现在再回答一次：土地庙是什么？</h2><p class="line">先看你刚才的一分钟讲述。你的理解改变了多少？</p><div class="post-grid">${[1,2,3,4,5].map(n=>`<button class="rate ${state.postRating===n?'selected':''}" data-rate="${n}">${n}</button>`).join('')}</div><div class="actions"><button class="cta" id="finish" ${state.postRating?'':'disabled'}>封存本次旅程</button><button class="ghost" id="saveVideo">保存一分钟视频</button><span class="status">1 = 几乎没变 · 5 = 改变很大</span></div>`;sheet.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{state.postRating=Number(b.dataset.rate);renderPost()});document.getElementById('saveVideo').onclick=downloadVideo;document.getElementById('finish').onclick=completeQuest}function completeQuest(){log('posttest_complete',{changeRating:state.postRating,postTranscript:state.videoTranscript});saveSession(true);sheet.innerHTML=`<p class="scene-label">MISSION COMPLETE</p><h2>山门已开。你带走的不是答案，而是一种更准确的讲述方式。</h2><p class="line">研究记录已保存在这台设备；一分钟视频可单独下载。</p><div class="actions"><button class="cta" id="exportData">导出研究记录</button><button class="ghost" id="saveVideo">保存视频</button><button class="ghost" id="again">重新进入</button></div>`;document.getElementById('exportData').onclick=exportData;document.getElementById('saveVideo').onclick=downloadVideo;document.getElementById('again').onclick=()=>location.reload();steps.classList.add('hidden');clearInterval(state.timer)}
    function sessionRecord(){return{participant:state.participant,consent:state.consent,startedAt:state.startedAt,completedAt:new Date().toISOString(),pre:{oralTranscript:state.preTranscript},task:{clues:state.found,dialogues:state.histories,finalVideoTranscript:state.videoTranscript,videoStoredLocally:Boolean(state.videoBlob)},post:{changeRating:state.postRating},events:state.events}}function saveSession(force=false){if(!state.participant)return;const list=JSON.parse(localStorage.getItem('xunji_research_sessions')||'[]');const item=sessionRecord();const i=list.findIndex(x=>x.participant===state.participant&&x.startedAt===state.startedAt);if(i>=0)list[i]=item;else if(force||state.startedAt)list.push(item);localStorage.setItem('xunji_research_sessions',JSON.stringify(list))}function exportData(){const data=JSON.stringify(sessionRecord(),null,2),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.participant}-研究记录.json`;a.click();URL.revokeObjectURL(a.href)}
    async function storeVideo(){if(!state.videoBlob||!state.participant)return;const db=await new Promise((resolve,reject)=>{const req=indexedDB.open('xunji-research',1);req.onupgradeneeded=()=>req.result.createObjectStore('videos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const tx=db.transaction('videos','readwrite');tx.objectStore('videos').put(state.videoBlob,state.participant);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
  </script>
