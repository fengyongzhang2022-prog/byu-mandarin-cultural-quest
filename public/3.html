    <section class="opening" id="opening"><div class="opening-inner"><p class="eyebrow">BYU MANDARIN · CULTURAL QUEST 01</p><h1>进入黑神话<br><em>讲出中国故事</em></h1><p>以“国际文化旅行者”的身份走进《黑神话：悟空》。发现文化线索、向故事角色追问、回应国际玩家，最后用中文讲清一个文化元素。</p><button class="cta" id="enter">开始 3–8 分钟完整体验 →</button><small class="opening-note">游戏化场景是文化探究的入口；任务目标是产生真实沟通、文化协商与跨文化解释</small></div></section>

    function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)}
    function closePanels(){tierPanel.classList.add('hidden');evidencePanel.classList.add('hidden');supportPanel.classList.add('hidden')}
    function startTimer(){if(state.timer)return;state.startedAt=new Date().toISOString();state.timer=setInterval(()=>{state.remaining=Math.max(0,state.remaining-1);clock.textContent=`${String(Math.floor(state.remaining/60)).padStart(2,'0')}:${String(state.remaining%60).padStart(2,'0')}`},1000)}
    function renderSteps(){steps.innerHTML=scenes.map((s,i)=>`<i class="dot ${i===state.index?'active':i<state.index?'done':''}" title="${s.label}"></i>`).join('')}
    function preload(image){const img=new Image();img.onerror=()=>{showToast('场景图没有加载，已启用文字体验');log('scene_image_missing',{image})};img.src=image}
    function go(index){stopRecognition();state.index=Math.max(0,Math.min(scenes.length-1,index));const scene=scenes[state.index];world.style.setProperty('--scene',`url('${scene.image}')`);preload(scene.image);closePanels();tierButton.classList.toggle('hidden',state.index<1||state.index>6);evidenceButton.classList.toggle('hidden',state.index<2||state.index>6);supportButton.classList.toggle('hidden',state.index<3||state.index>6);renderSteps();renderPanels();render();log('stage_view',{stage:scene.key,tier:state.tier})}
    function nav(){return `<button class="back" data-back aria-label="返回上一步">←</button>`}
    function bindBack(){const b=sheet.querySelector('[data-back]');if(b)b.onclick=()=>go(state.index-1)}
    function render(){const key=scenes[state.index].key;if(key==='pre')renderPre();if(key==='enter')renderEnter();if(key==='discover')renderDiscover();if(key==='interact')renderTalk('interact');if(key==='compare')renderTalk('compare');if(key==='explain')renderExplain();if(key==='story')renderStory();if(key==='post')renderPost();bindBack()}

    function quizHTML(scope,answers){return `<div class="quiz">${quizQuestions.map((q,i)=>`<div class="quiz-card"><strong>${i+1}. ${q.q}</strong>${q.choices.map((c,j)=>`<label><input type="radio" name="${scope}-${q.id}" data-quiz="${scope}" data-q="${q.id}" value="${j}" ${answers[q.id]===j?'checked':''}>${c}</label>`).join('')}</div>`).join('')}</div>`}
    function bindQuiz(scope,answers,change){sheet.querySelectorAll(`[data-quiz="${scope}"]`).forEach(x=>x.onchange=()=>{answers[x.dataset.q]=Number(x.value);change?.()})}
    function quizComplete(a){return quizQuestions.every(q=>Number.isInteger(a[q.id]))}
    function quizScore(a){return quizQuestions.filter(q=>a[q.id]===q.answer).length}

    function renderPre(){sheet.innerHTML=`${nav()}<p class="scene-label">RESEARCH PRE · 任务前测</p><h2>进入故事前，先留下你现在的文化解释。</h2><p class="line">不查资料。请用中文回答：土地庙是什么？人们可能做什么？它为什么有意义？建议至少录制1分钟；如需展开，可录至3分钟。系统会同时保存录音与文字转写。</p><div class="passport"><input class="field" id="pid" maxlength="24" placeholder="匿名编号，例如 BYU-021" value="${escapeHTML(state.participant)}"><select class="select" id="familiarity"><option value="">游戏熟悉度</option>${['1 · 没玩过','2 · 了解一点','3 · 玩过部分','4 · 比较熟悉','5 · 非常熟悉'].map((x,i)=>`<option value="${i+1}" ${state.gameFamiliarity==i+1?'selected':''}>${x}</option>`).join('')}</select><button class="ghost" id="preMic">● 转写补充</button></div><div class="actions"><button class="cta" id="recordPreAudio">录制前测音频</button><button class="ghost hidden" id="stopPreAudio">停止录制</button><button class="ghost hidden" id="playPreAudio">回听</button><button class="ghost hidden" id="downloadPreAudio">保存录音</button><span class="status" id="preAudioStatus">建议至少1分钟，最长3分钟</span></div><textarea class="textarea" id="preText" placeholder="录音的语音转写会出现在这里；设备无法录音或识别语音时也可直接输入。">${escapeHTML(state.preTranscript)}</textarea>${quizHTML('pre',state.preQuiz)}<label class="consent"><input id="consent" type="checkbox" ${state.consent?'checked':''}> 我同意把匿名录音、测验、文化解释、AI互动记录和反思用于课程研究；我可以随时退出。</label><div class="actions"><button class="cta" id="preNext">保存前测，进入故事 →</button><span class="status">pre-audio＋pre-quiz＋pre cultural explanation</span></div>`;
      const pid=document.getElementById('pid'),preText=document.getElementById('preText');pid.oninput=()=>state.participant=pid.value.trim();preText.oninput=()=>state.preTranscript=preText.value.trim();document.getElementById('familiarity').onchange=e=>state.gameFamiliarity=e.target.value;document.getElementById('consent').onchange=e=>state.consent=e.target.checked;bindQuiz('pre',state.preQuiz);document.getElementById('preMic').onclick=e=>toggleRecognition(e.currentTarget,text=>{state.preTranscript=(state.preTranscript+' '+text).trim();preText.value=state.preTranscript});document.getElementById('recordPreAudio').onclick=startPreAudio;document.getElementById('stopPreAudio').onclick=stopPreAudio;document.getElementById('playPreAudio').onclick=playPreAudio;document.getElementById('downloadPreAudio').onclick=downloadPreAudio;if(state.preAudioUrl){document.getElementById('playPreAudio').classList.remove('hidden');document.getElementById('downloadPreAudio').classList.remove('hidden');document.getElementById('preAudioStatus').textContent=`已录制 ${state.preAudioSeconds} 秒`};document.getElementById('preNext').onclick=()=>{if(!state.participant)return showToast('请填写匿名编号');if(!state.gameFamiliarity)return showToast('请选择游戏熟悉度');if(!state.preAudioBlob)return showToast('请先录制前测音频');if(!state.preTranscript)return showToast('请确认录音已转写；可直接补充文字');if(!quizComplete(state.preQuiz))return showToast('请完成三道前测题');if(!state.consent)return showToast('请确认研究同意');log('pretest_complete',{quizScore:quizScore(state.preQuiz),transcript:state.preTranscript,audioSeconds:state.preAudioSeconds});go(1)}
    }

    async function startPreAudio(){if(!state.participant)return showToast('请先填写匿名编号，再录制前测音频');if(!navigator.mediaDevices?.getUserMedia)return showToast('浏览器不支持录音，请使用Chrome或Edge');state.preTranscript='';state.preAudioBlob=null;state.preAudioUrl='';const previousText=document.getElementById('preText');if(previousText)previousText.value='';try{preAudioStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x))||'';const chunks=[];preAudioRecorder=new MediaRecorder(preAudioStream,mime?{mimeType:mime}:undefined);preAudioRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};preAudioRecorder.onstop=async()=>{state.preAudioBlob=new Blob(chunks,{type:preAudioRecorder.mimeType||'audio/webm'});state.preAudioUrl=URL.createObjectURL(state.preAudioBlob);state.preAudioSeconds=preAudioSeconds;await storeVideo(state.preAudioBlob,`${state.participant}-pre-audio`);log('pre_audio_complete',{seconds:state.preAudioSeconds,size:state.preAudioBlob.size});renderPre()};preAudioRecorder.start(500);preAudioSeconds=0;document.getElementById('recordPreAudio').classList.add('hidden');document.getElementById('stopPreAudio').classList.remove('hidden');document.getElementById('preAudioStatus').textContent='正在录制…建议至少1分钟，最长3分钟';startPreAudioTranscript();preAudioTimer=setInterval(()=>{preAudioSeconds++;const status=document.getElementById('preAudioStatus');if(status)status.textContent=`正在录制 ${preAudioSeconds} 秒${preAudioSeconds>=60?' · 已达到建议时长':''}`;if(preAudioSeconds>=180)stopPreAudio()},1000);log('pre_audio_started')}catch{showToast('未获得麦克风权限；请允许麦克风后重试')}}
    function startPreAudioTranscript(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();activeRecognition=r;r.lang='zh-CN';r.continuous=true;r.interimResults=false;r.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;state.preTranscript=(state.preTranscript+' '+text).trim();const el=document.getElementById('preText');if(el)el.value=state.preTranscript};r.onend=()=>{if(preAudioRecorder?.state==='recording')try{r.start()}catch{}};try{r.start()}catch{}}
    function stopPreAudio(){clearInterval(preAudioTimer);stopRecognition();if(preAudioRecorder?.state==='recording')preAudioRecorder.stop();preAudioStream?.getTracks().forEach(t=>t.stop())}
    function playPreAudio(){if(!state.preAudioUrl)return;const audio=new Audio(state.preAudioUrl);audio.play().catch(()=>showToast('无法播放录音，请先下载'))}
    function downloadPreAudio(){if(!state.preAudioBlob)return;const a=document.createElement('a');a.href=state.preAudioUrl;a.download=`${state.participant||'participant'}-前测录音.webm`;a.click()}
    const renderPreStage=renderPre;
    renderPre=()=>{renderPreStage();if(state.preAudioBlob){const b=document.getElementById('recordPreAudio');if(b)b.textContent='重新录制并覆盖'}}

    function tierCards(){return `<div class="tier-grid">${Object.entries(tiers).map(([key,t])=>`<button class="tier-card ${state.tier===key?'selected':''}" data-tier="${key}"><small>${t.tag}</small><strong>${t.name}</strong><span>${t.description}</span></button>`).join('')}</div><p class="tier-note">这是可随时切换的学习支持方式，不是能力等级，也不会给学习者贴“高／中／低”标签。</p>`}

    function renderEnter(){sheet.innerHTML=`${nav()}<p class="scene-label">ENTER · 进入故事／角色扮演</p><h2>你的身份：国际文化旅行者。选择今天需要的支持方式。</h2>${tierCards()}<div class="role-grid"><div class="role-card"><small>YOUR ROLE</small><strong>国际文化旅行者</strong><p>你熟悉游戏，但这次不来打怪。你要调查场景背后的文化意义，并向国际同伴解释。</p></div><div class="mission-card"><small>YOUR MISSION</small><p><strong>Maya：</strong>“土地庙不就是 Chinese church 和 save point 吗？”</p><p>发现材料、向“西游行者”追问、与Maya协商，最后讲出有证据、有边界、听众能理解的中国故事。</p></div></div><div class="actions"><button class="cta" id="accept">接受角色，进入黑风山 →</button><span class="status">Immersion → Role-taking → Cultural mission</span></div>`;bindTierCards();document.getElementById('accept').onclick=()=>{log('role_accepted',{role:'国际文化旅行者',supportMode:state.tier,world:'黑神话：悟空'});go(2)}}

    function requiredMaterials(){return tier().materials}
    function renderDiscover(){const required=requiredMaterials();sheet.innerHTML=`${nav()}<p class="scene-label">DISCOVER · 发现文化／文化探究</p><h2>查看不同性质的材料，再说出你的理解和疑问。</h2><p class="line">建筑、人物神话、宗教实践和游戏改编需要互相对照。当前支持方式建议整合札记约 ${tier().noteTarget} 字。</p><div class="material-bar">${required.map(id=>`<button class="material-button ${state.opened.includes(id)?'done':''}" data-material="${id}">${state.opened.includes(id)?'✓ ':''}${materials[id].title}</button>`).join('')}</div><div id="materialArea">${state.activeMaterial&&required.includes(state.activeMaterial)?materialHTML(state.activeMaterial):''}</div><div class="note-row"><button class="mic" id="noteMic">●</button><input class="field" id="notes" value="${escapeHTML(state.notes)}" placeholder="我注意到……；材料之间……；我想知道……"></div>${state.tier==='guide'?'<div class="chips"><button class="chip" data-note-frame>插入句架：材料A显示……；材料B补充……；材料C提醒我们……</button></div>':''}<div class="actions"><button class="cta" id="discoverNext">带着证据去见西游行者 →</button><span class="status" id="discoverStatus">已查看 ${required.filter(x=>state.opened.includes(x)).length}/${required.length} · 札记 ${state.notes.length}/${tier().noteTarget} 字</span></div>`;
      sheet.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{const id=b.dataset.material;if(!state.opened.includes(id)){state.opened.push(id);log('material_opened',{material:id,source:materials[id].source})}state.activeMaterial=id;renderDiscover()});const notes=document.getElementById('notes');notes.oninput=()=>{state.notes=notes.value.trim();updateDiscoverStatus()};document.getElementById('noteMic').onclick=e=>toggleRecognition(e.currentTarget,text=>{state.notes=(state.notes+' '+text).trim();notes.value=state.notes;updateDiscoverStatus()});sheet.querySelector('[data-note-frame]')?.addEventListener('click',()=>{notes.value='材料A显示……；材料B进一步说明……；材料C提醒我们……';state.notes=notes.value;notes.focus();log('support_used',{kind:'discover_frame'})});document.getElementById('discoverNext').onclick=()=>{const missing=required.filter(x=>!state.opened.includes(x));if(missing.length)return showToast(`请先查看全部${required.length}类材料`);if(state.notes.length<8)return showToast('请先说出或写下一个理解和疑问');log('discovery_output',{opened:required,notes:state.notes,meetsTarget:state.notes.length>=tier().noteTarget});go(3)};updateDiscoverStatus()
    }
    function materialHTML(id){const m=materials[id];return `<article class="material-card"><small>${m.source} · 目的：${m.purpose}</small><h3>${m.title}</h3><p>${m.text}</p></article>`}
    function updateDiscoverStatus(){const el=document.getElementById('discoverStatus');if(el){const required=requiredMaterials();el.textContent=`已查看 ${required.filter(x=>state.opened.includes(x)).length}/${required.length} · 札记 ${state.notes.length}/${tier().noteTarget} 字${state.notes.length>=tier().noteTarget?' · 已达建议':''}`}}

    const talkConfig={
      interact:{tag:'INTERACT · AI角色互动',title:'西游行者在土地庙前等你。用中文追问，不要只问定义。',actor:'西游行者',opening:'你看过几类材料了。哪一点让你最想追问？',next:'带着他的回应去找国际玩家 →'},
      compare:{tag:'COMPARE · 跨文化协商',title:'国际玩家 Maya 仍在使用“Chinese church / save point”类比。',actor:'Maya',opening:'我知道它不完全一样，但这样说不是更方便吗？',next:'面对Maya，讲出你的中国故事 →'}
    };
    function renderTalk(mode){const c=talkConfig[mode],history=state.histories[mode],turns=history.filter(x=>x.role==='user').length,needed=tier().turns;sheet.innerHTML=`${nav()}<p class="scene-label">${c.tag}</p><h2>${c.title}</h2><div class="chips"><span class="chip">${mode==='interact'?'Story Guide · Virtual Character · Language Partner':'Intercultural Partner · 真实误解与协商'}</span><span class="chip">${tier().name}</span></div><div class="dialogue" id="dialogue"><div class="bubble">${c.actor}：${c.opening}<button class="replay" data-opening>声</button></div>${history.map((m,i)=>`<div class="bubble ${m.role==='user'?'me':''}">${m.role==='user'?'你':c.actor}：${escapeHTML(m.content)}${m.role==='assistant'?`<button class="replay" data-replay="${i}">声</button>`:''}</div>`).join('')}</div><div class="talk-row"><button class="mic" id="talkMic">●</button><input class="field" id="talkInput" placeholder="说或输入中文；AI会回应并推进情境"><button class="ghost" id="sendTalk">送出</button></div><div class="actions"><button class="cta" id="talkNext" ${turns<needed?'disabled':''}>${turns<needed?`至少再表达 ${needed-turns} 次`:`我协商清楚了 · ${c.next}`}</button><span class="status" id="voiceStatus">已表达 ${turns}/${needed} 次 · 可不限次数继续</span></div>`;
      const input=document.getElementById('talkInput'),mic=document.getElementById('talkMic');mic.onclick=()=>toggleRecognition(mic,text=>{input.value=text;sendTalk(mode,text)});document.getElementById('sendTalk').onclick=()=>sendTalk(mode,input.value);input.onkeydown=e=>{if(e.key==='Enter')sendTalk(mode,input.value)};sheet.querySelector('[data-opening]').onclick=()=>speak(c.opening,mode);sheet.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>speak(history[Number(b.dataset.replay)].content,mode));document.getElementById('talkNext').onclick=()=>{if(turns>=needed)go(state.index+1)};requestAnimationFrame(()=>document.getElementById('dialogue').scrollTop=9999)
    }
    async function sendTalk(mode,message){message=String(message||'').trim();if(!message)return showToast('先说一句中文');if(talkBusy)return showToast('AI角色正在回应');talkBusy=true;stopRecognition();const history=state.histories[mode];history.push({role:'user',content:message,at:new Date().toISOString(),channel:'speech_or_text'});log('oral_turn',{stage:mode,role:'user',text:message,tier:state.tier});renderTalk(mode);const status=document.getElementById('voiceStatus');if(status)status.textContent='AI角色正在回应并推进情境…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:mode,tier:tier().api,message,history:history.slice(0,-1),notes:state.notes})});const data=await response.json();const reply=data.reply||'请再举一个例子。';history.push({role:'assistant',content:reply,at:new Date().toISOString(),demo:Boolean(data.demo)});log('oral_turn',{stage:mode,role:'assistant',text:reply,demo:Boolean(data.demo),tier:state.tier});renderTalk(mode);speak(reply,mode)}catch{const reply=mode==='interact'?'游戏里的功能和现实中的文化意义，完全一样吗？':'这个类比哪里有帮助，哪里又会误导我？';history.push({role:'assistant',content:reply,at:new Date().toISOString(),demo:true});renderTalk(mode);speak(reply,mode)}finally{talkBusy=false}}

    function renderPanels(){tierButton.textContent=`支持 · ${tier().name}`;tierPanel.innerHTML=`<h3>切换学习支持</h3><div class="side-item">支持方式不是能力标签；可以根据当前任务随时切换。</div>${Object.entries(tiers).map(([key,t])=>`<button class="tool-chip" data-panel-tier="${key}"><strong>${t.name}</strong>${t.description}</button>`).join('')}`;tierPanel.querySelectorAll('[data-panel-tier]').forEach(b=>b.onclick=()=>setTier(b.dataset.panelTier,'topbar'));const required=requiredMaterials();evidenceButton.textContent=`证据袋 ${required.filter(x=>state.opened.includes(x)).length}/${required.length}`;evidencePanel.innerHTML=`<h3>随身证据</h3>${required.map(id=>`<div class="side-item"><strong>${materials[id].title}</strong>${state.opened.includes(id)?materials[id].text:'尚未查看'}</div>`).join('')}<div class="side-item"><strong>我的整合札记</strong>${escapeHTML(state.notes)||'尚未记录'}</div>`;supportPanel.innerHTML=toolHTML();supportPanel.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>insertTool(b.dataset.insert))}
    function toolHTML(){const common=['我理解你为什么这样比较，因为……','这个类比有帮助，但是它的局限是……','在游戏里……；在现实实践中则……','更准确地说，土地庙可以理解为……'];if(state.tier==='guide')return `<h3>表达工具 · 句架支持</h3>${common.map(x=>`<button class="tool-chip" data-insert="${x}">${x}</button>`).join('')}<div class="side-item"><strong>关键词</strong>地方性 · 守护 · 文化记忆 · 仪式空间 · 游戏改编</div>`;if(state.tier==='inquiry')return `<h3>表达工具 · 证据审视</h3>${['这条材料是谁写的？目的是什么？','这个说法代表谁，又没有代表谁？','哪条证据支持它？是否存在过度概括？','如果换一个听众，我需要怎样调整？'].map(x=>`<button class="tool-chip" data-insert="${x}">${x}</button>`).join('')}`;return `<h3>表达工具 · 交际功能</h3><div class="side-item"><strong>协商四步</strong>承认一点相似 → 引用具体材料 → 指出类比局限 → 为听众重构理解</div>${common.slice(1).map(x=>`<button class="tool-chip" data-insert="${x}">${x}</button>`).join('')}`}
    function insertTool(text){const target=document.getElementById('talkInput')||document.getElementById('videoText')||document.getElementById('revisionInput')||document.getElementById('diary');if(!target)return showToast('请在表达阶段使用工具');target.value=(target.value+' '+text).trim();target.dispatchEvent(new Event('input'));target.focus();supportPanel.classList.add('hidden');log('support_used',{stage:scenes[state.index].key,text,tier:state.tier})}
    tierButton.onclick=()=>{evidencePanel.classList.add('hidden');supportPanel.classList.add('hidden');tierPanel.classList.toggle('hidden')};evidenceButton.onclick=()=>{tierPanel.classList.add('hidden');supportPanel.classList.add('hidden');evidencePanel.classList.toggle('hidden')};supportButton.onclick=()=>{tierPanel.classList.add('hidden');evidencePanel.classList.add('hidden');supportPanel.classList.toggle('hidden')};

    async function availableVoices(){let v=speechSynthesis.getVoices();if(v.length)return v;await new Promise(resolve=>{const done=()=>{speechSynthesis.removeEventListener('voiceschanged',done);resolve()};speechSynthesis.addEventListener('voiceschanged',done);setTimeout(done,700)});return speechSynthesis.getVoices()}
    async function speak(text,role='narrator'){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const voices=await availableVoices(),zh=voices.filter(v=>/^zh(-|_)/i.test(v.lang)||/(Chinese|中文|普通话)/i.test(v.name));const male=[/Yunxi/i,/Yunjian/i,/Yunyang/i,/Kangkang/i,/Li-Mu/i],female=[/Xiaoxiao/i,/Xiaoyi/i,/Tingting/i,/Huihui/i];const prefs=role==='interact'?male:role==='compare'?female:female;let voice=null;for(const p of prefs){voice=zh.find(v=>p.test(v.name));if(voice)break}voice=voice||zh[0]||null;const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.voice=voice;u.rate=(role==='interact'?.86:role==='compare'?.98:.9)*(state.tier==='guide'?.92:1);u.pitch=role==='interact'?.7:role==='compare'?1.1:.96;u.onstart=()=>{world.classList.add('talking');log('voice_playback',{role,voice:voice?.name||'browser-default'})};u.onend=()=>world.classList.remove('talking');speechSynthesis.speak(u)}
    function toggleRecognition(button,onText){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return showToast('当前浏览器不支持语音识别，请直接输入中文');if(activeRecognition){stopRecognition();return}const r=new SR();activeRecognition=r;r.lang='zh-CN';r.interimResults=false;r.continuous=false;button.classList.add('live');r.onresult=e=>onText(e.results[e.results.length-1][0].transcript);r.onerror=()=>showToast('没有听清，请再说一次或直接输入');r.onend=()=>{button.classList.remove('live');activeRecognition=null};r.start()}
    function stopRecognition(){if(activeRecognition){try{activeRecognition.stop()}catch{}activeRecognition=null}document.querySelectorAll('.mic.live').forEach(b=>b.classList.remove('live'))}

    function renderExplain(){const seconds=tier().explain;sheet.innerHTML=`${nav()}<p class="scene-label">EXPLAIN · 讲好中国故事／初次产出</p><h2>面对国际玩家，用 ${seconds} 秒解释土地庙。</h2><div class="camera-wrap"><div class="camera"><video id="camera" autoplay muted playsinline></video><span class="rec hidden" id="recBadge">● REC</span></div><div><div class="cue"><span>回应Maya</span><span>两类材料</span><span>游戏与现实</span><span>限定表达</span></div><div class="count" id="count">${formatTime(seconds)}</div><p class="line">录完可先回看；需要调整时，重新录制会覆盖这一次讲述。设备无法授权时，可直接留下文字稿。</p></div></div><textarea class="textarea" id="videoText" placeholder="同步转写会出现在这里；也可以直接输入文化解释。">${escapeHTML(state.videoTranscript)}</textarea><div class="actions"><button class="cta" id="recordVideo">${state.videoBlob?'重新录制并覆盖':'开启摄像头并录制'}</button><button class="ghost hidden" id="stopVideo">停止</button><button class="ghost hidden" id="playVideo">回看</button><button class="ghost hidden" id="downloadVideo">保存视频</button><button class="ghost" id="toStory">确认这版，交给GAI反馈 →</button></div>`;
      const text=document.getElementById('videoText');text.oninput=()=>{state.videoTranscript=text.value.trim();document.getElementById('toStory').disabled=state.videoTranscript.length<10};document.getElementById('recordVideo').onclick=startVideo;document.getElementById('stopVideo').onclick=stopVideo;document.getElementById('playVideo').onclick=()=>{const v=document.getElementById('camera');v.muted=false;v.srcObject=null;v.src=state.videoUrl;v.controls=true;v.play()};document.getElementById('downloadVideo').onclick=()=>downloadVideo('initial');document.getElementById('toStory').onclick=()=>{if(state.videoTranscript.length<10)return showToast('请先完成讲述或留下文字稿');log('explain_1_complete',{transcript:state.videoTranscript,seconds:state.videoSeconds,video:Boolean(state.videoBlob)});state.feedback='';state.aiStory='';go(6)};document.getElementById('toStory').disabled=state.videoTranscript.length<10;if(state.videoUrl){const v=document.getElementById('camera');v.src=state.videoUrl;v.controls=true;document.getElementById('playVideo').classList.remove('hidden');document.getElementById('downloadVideo').classList.remove('hidden')}
    }
    function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
    async function startVideo(){if(!navigator.mediaDevices?.getUserMedia)return showToast('浏览器不支持视频录制，请使用文字稿模式');try{mediaStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:true});const video=document.getElementById('camera');video.srcObject=mediaStream;await video.play();const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';const chunks=[];mediaRecorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{state.videoBlob=new Blob(chunks,{type:mediaRecorder.mimeType||'video/webm'});state.videoUrl=URL.createObjectURL(state.videoBlob);await storeVideo(state.videoBlob,state.participant);log('video_complete',{kind:'initial',seconds:state.videoSeconds,size:state.videoBlob.size});renderExplain()};mediaRecorder.start(500);recordSeconds=tier().explain;state.videoSeconds=0;document.getElementById('recordVideo').classList.add('hidden');document.getElementById('stopVideo').classList.remove('hidden');document.getElementById('recBadge').classList.remove('hidden');startContinuousTranscript('videoText','videoTranscript');recordTimer=setInterval(()=>{recordSeconds--;state.videoSeconds++;const count=document.getElementById('count');if(count)count.textContent=formatTime(recordSeconds);if(recordSeconds<=0)stopVideo()},1000);log('video_started',{kind:'initial'})}catch{showToast('未获得摄像头或麦克风权限，可直接输入文字稿')}}
    function startContinuousTranscript(elementId,stateKey){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();activeRecognition=r;r.lang='zh-CN';r.continuous=true;r.interimResults=false;r.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;state[stateKey]=(state[stateKey]+' '+text).trim();const el=document.getElementById(elementId);if(el)el.value=state[stateKey]};r.onend=()=>{if(mediaRecorder?.state==='recording')try{r.start()}catch{}};try{r.start()}catch{}}
    function stopVideo(){clearInterval(recordTimer);stopRecognition();if(mediaRecorder?.state==='recording')mediaRecorder.stop();mediaStream?.getTracks().forEach(t=>t.stop())}
    const startInitialRecording=startVideo;
    startVideo=async()=>{if(state.videoBlob){state.videoTranscript='';state.videoBlob=null;state.videoUrl='';state.videoSeconds=0}return startInitialRecording()}
    function downloadVideo(){if(!state.videoBlob)return showToast('这次还没有录制视频');const a=document.createElement('a');a.href=state.videoUrl;a.download=`${state.participant||'participant'}-文化讲述.webm`;a.click()}

    function feedbackFocus(text){if(/材料证据/.test(text))return'材料证据';if(/类比局限/.test(text))return'类比局限';if(/限定表达/.test(text))return'限定表达';if(/段落连接/.test(text))return'段落连接';return'结论句'}
    function heuristicFeedback(text){if(text.length<12)return'先完整表达：说出主张、材料证据和一句限定。';const hits=markerCounts(text);if(hits.evidence<2)return'材料证据：点名“材料B里……”，让解释站得住。';if(!hits.limit)return'类比局限：补一句“这个说法会让人误以为……”。';if(!hits.hedge)return'限定表达：加一句“在一些地区……对有些人来说……”。';if(hits.connect<2)return'段落连接：用“一方面……另一方面……”把两点连起来。';return'结论句：用“更准确地说，土地庙是……”收尾。'}
    function fallbackStory(){return `【你的核心解释】${state.videoTranscript}\n【可保留的证据】${state.notes||'补充一条具体材料证据'}\n【面向国际玩家的收束】游戏机制借用了文化联想，但不能替代现实文化的多样面貌。`}
    async function loadCoach(){const message=`【发现札记】${state.notes}\n【初次文化解释】${state.videoTranscript}`;try{const [f,s]=await Promise.all([fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:'feedback',tier:tier().api,message:state.videoTranscript})}).then(r=>r.json()),fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:'story',tier:tier().api,message})}).then(r=>r.json())]);state.feedback=f.reply||heuristicFeedback(state.videoTranscript);state.feedbackSource=f.demo?'heuristic':'ai';state.aiStory=s.reply||fallbackStory();state.feedbackFocus=feedbackFocus(state.feedback)}catch{state.feedback=heuristicFeedback(state.videoTranscript);state.feedbackSource='heuristic';state.feedbackFocus=feedbackFocus(state.feedback);state.aiStory=fallbackStory()}log('gai_story_ready',{feedback:state.feedback,feedbackSource:state.feedbackSource,story:state.aiStory});renderStory()}
    function renderStory(){sheet.innerHTML=`${nav()}<p class="scene-label">GAI STORY STUDIO · 一条反馈／故事整理／修订产出</p><h2>GAI整理证据，但最终仍由你来讲。</h2><div class="story-grid"><div class="story-card"><small>一条最重要的反馈</small><p id="feedbackText">${escapeHTML(state.feedback)||'正在分析初次讲述……'}</p></div><div class="story-card"><small>GAI整理的“中国故事卡”</small><p id="storyText">${escapeHTML(state.aiStory)||'正在综合发现札记与讲述内容……'}</p></div></div><div class="focus-row"><span class="status">也可自选本次修订焦点：</span>${['材料证据','类比局限','限定表达','段落连接','结论句'].map(x=>`<button class="focus ${state.feedbackFocus===x?'selected':''}" data-focus="${x}">${x}</button>`).join('')}</div><p class="line">现在用自己的话再讲 ${tier().revise} 秒。不要照抄故事卡，只落实一条修改。</p><div class="talk-row"><button class="mic" id="revisionMic">●</button><input class="field" id="revisionInput" value="${escapeHTML(state.revisionTranscript)}" placeholder="更准确地说……"><button class="ghost" id="skipRevision">无法录音，标记跳过</button></div><div class="actions"><button class="cta" id="toPost">保存修订，进入后测 →</button><button class="ghost" id="reloadCoach">重新整理</button><span class="status">Explain 1 → GAI feedback/story → Explain 2</span></div>`;
      const input=document.getElementById('revisionInput');input.oninput=()=>{state.revisionTranscript=input.value.trim();state.revisionSkipped=false;updateStoryNext()};document.getElementById('revisionMic').onclick=e=>toggleRecognition(e.currentTarget,text=>{state.revisionTranscript=(state.revisionTranscript+' '+text).trim();input.value=state.revisionTranscript;state.revisionSkipped=false;updateStoryNext()});sheet.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{state.feedbackFocus=b.dataset.focus;state.feedbackSource='self-selected';renderStory()});document.getElementById('skipRevision').onclick=()=>{state.revisionSkipped=true;updateStoryNext();showToast('已标记跳过修订；研究数据会保留这个状态')};document.getElementById('reloadCoach').onclick=()=>{state.feedback='';state.aiStory='';loadCoach()};document.getElementById('toPost').onclick=()=>{if(!state.feedback||!state.aiStory)return showToast('请等待GAI完成整理');if(!state.revisionSkipped&&state.revisionTranscript.length<6)return showToast('请完成修订讲述，或明确标记跳过');log('explain_2_complete',{transcript:state.revisionTranscript,skipped:state.revisionSkipped,focus:state.feedbackFocus});go(7)};updateStoryNext();if(!state.feedback||!state.aiStory)loadCoach()
    }
    function updateStoryNext(){const b=document.getElementById('toPost');if(b)b.disabled=!state.feedback||!state.aiStory||(!state.revisionSkipped&&state.revisionTranscript.length<6)}
    function markerCounts(text){return Object.fromEntries(Object.entries(markerSets).map(([k,words])=>[k,words.filter(w=>String(text).includes(w)).length]))}

    function renderPost(){sheet.innerHTML=`${nav()}<p class="scene-label">POST · 后测／学习日记／访谈线索</p><h2>走出故事以后，你能怎样更准确地解释文化？</h2>${quizHTML('post',state.postQuiz)}<p class="line">和进入故事前相比，你的理解改变了多少？</p><div class="rate-row">${[1,2,3,4,5].map(n=>`<button class="rate ${state.postRating===n?'selected':''}" data-rate="${n}">${n}</button>`).join('')}<span class="status">1 = 几乎没变 · 5 = 改变很大</span></div><textarea class="textarea" id="diary" placeholder="学习日记：哪条材料改变了你的理解？游戏化场景和AI角色怎样影响了你的中文表达？">${escapeHTML(state.diary)}</textarea><textarea class="textarea" id="interviewSeed" placeholder="访谈线索：AI什么时候促使你继续说？什么时候限制了你？游戏与现实最需要区分什么？">${escapeHTML(state.interviewSeed)}</textarea><div class="actions"><button class="cta" id="finish">封存本次文化旅程</button><button class="ghost" id="saveVideo">保存一分钟视频</button><span class="status">post-quiz＋日记＋访谈</span></div>`;
      bindQuiz('post',state.postQuiz,updatePostNext);sheet.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{state.postRating=Number(b.dataset.rate);sheet.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('selected',x===b));updatePostNext()});const diary=document.getElementById('diary'),interview=document.getElementById('interviewSeed');diary.oninput=()=>{state.diary=diary.value.trim();updatePostNext()};interview.oninput=()=>{state.interviewSeed=interview.value.trim();updatePostNext()};document.getElementById('saveVideo').onclick=downloadVideo;document.getElementById('finish').onclick=()=>{if(!quizComplete(state.postQuiz))return showToast('请完成三道后测题');if(!state.postRating)return showToast('请选择理解变化程度');if(state.diary.length<8)return showToast('请留下简短学习日记');if(state.interviewSeed.length<8)return showToast('请留下一个访谈线索');completeQuest()};updatePostNext()
    }
    function updatePostNext(){const b=document.getElementById('finish');if(b)b.disabled=!quizComplete(state.postQuiz)||!state.postRating||state.diary.length<8||state.interviewSeed.length<8}
    function completeQuest(){log('posttest_complete',{quizScore:quizScore(state.postQuiz),changeRating:state.postRating});saveSession(true);sheet.innerHTML=`<p class="scene-label">MISSION COMPLETE</p><h2>你带走的不是标准答案，而是一种更准确、更愿意协商的讲述方式。</h2><p class="line">前后测验、发现札记、双角色互动、两次文化解释、GAI故事卡、日记与访谈线索都已保存。</p><div class="story-card" style="max-width:850px;margin-top:14px"><small>你的中国故事卡</small><p>${escapeHTML(state.aiStory)}</p></div><div class="actions"><button class="cta" id="exportData">导出完整研究记录</button><button class="ghost" id="saveVideo">保存视频</button><button class="ghost" id="again">重新进入</button></div>`;document.getElementById('exportData').onclick=exportData;document.getElementById('saveVideo').onclick=downloadVideo;document.getElementById('again').onclick=()=>location.reload();steps.classList.add('hidden');tierButton.classList.add('hidden');evidenceButton.classList.add('hidden');supportButton.classList.add('hidden');clearInterval(state.timer)}

    function sessionRecord(){return{version:'4.1-full',participant:state.participant,consent:state.consent,startedAt:state.startedAt,completedAt:new Date().toISOString(),profile:{role:'国际文化旅行者',gameFamiliarity:Number(state.gameFamiliarity),supportMode:state.tier,supportModeName:tier().name,tierSwitches:state.tierSwitches},pre:{oralTranscript:state.preTranscript,audioSeconds:state.preAudioSeconds,audioStoredLocally:Boolean(state.preAudioBlob),quizAnswers:state.preQuiz,quizScore:quizScore(state.preQuiz)},task:{world:'黑神话：悟空',materialsOpened:state.opened,discoveryNotes:state.notes,notesTarget:tier().noteTarget,notesMeetsTarget:state.notes.length>=tier().noteTarget,dialogues:state.histories,finalVideoTranscript:state.videoTranscript,videoSeconds:state.videoSeconds,videoStoredLocally:Boolean(state.videoBlob),feedback:{content:state.feedback,source:state.feedbackSource,focus:state.feedbackFocus},aiStoryCard:state.aiStory,revisionTranscript:state.revisionTranscript,revisionSkipped:state.revisionSkipped,markers:{initial:markerCounts(state.videoTranscript),revision:markerCounts(state.revisionTranscript)}},post:{quizAnswers:state.postQuiz,quizScore:quizScore(state.postQuiz),changeRating:state.postRating,diary:state.diary,interviewSeed:state.interviewSeed},events:state.events}}
    function saveSession(force=false){if(!state.participant)return;let list=[];try{list=JSON.parse(localStorage.getItem('xunji_research_sessions')||'[]')}catch{}const item=sessionRecord(),i=list.findIndex(x=>x.participant===state.participant&&x.startedAt===state.startedAt);if(i>=0)list[i]=item;else if(force||state.startedAt)list.push(item);localStorage.setItem('xunji_research_sessions',JSON.stringify(list))}
    function exportData(){const blob=new Blob([JSON.stringify(sessionRecord(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.participant}-完整研究记录.json`;a.click();URL.revokeObjectURL(a.href)}
    async function storeVideo(blob,key){if(!blob||!key)return;try{const db=await new Promise((resolve,reject)=>{const req=indexedDB.open('xunji-research',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('videos'))req.result.createObjectStore('videos')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const tx=db.transaction('videos','readwrite');tx.objectStore('videos').put(blob,key);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch{showToast('视频保存在当前页面，请手动下载')}}
  </script>
</body>
</html>
