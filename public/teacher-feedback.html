<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教师试用反馈 | 5000美元，5万棵树</title>
  <style>
    :root{--bg:#f7f6f1;--ink:#273027;--muted:#667169;--line:#d4d8d1;--green:#315f3c;--wash:#e9eee6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px max(24px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:rgba(247,246,241,.94);position:sticky;top:0}.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:10px;letter-spacing:.1em}a,button{font:inherit}a{color:var(--green)}button{cursor:pointer}.quiet{padding:9px 13px;border:1px solid #aeb5af;border-radius:5px;background:transparent;color:var(--ink)}main{width:min(1040px,calc(100% - 48px));margin:52px auto 96px}h1,h2{font-family:"Noto Serif SC","Songti SC",serif;line-height:1.2}h1{font-size:clamp(34px,5vw,54px);margin:0 0 12px}.lead{max-width:60ch;color:#566058}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:34px 0}.metric{padding:18px 0;border-top:2px solid var(--green)}.metric b{display:block;font-size:28px}.metric span{font-size:12px;color:var(--muted)}.section{margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}.ratings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}.rating{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.rating span{max-width:28ch}.rating b{color:var(--green);white-space:nowrap}.record{padding:24px 0;border-top:1px solid var(--line)}.record-meta{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.comments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 34px;margin-top:18px}.comments article{padding-top:12px;border-top:1px solid var(--line)}.comments small{color:var(--green);font-weight:700}.comments p{white-space:pre-wrap;margin:8px 0 0}.empty{padding:36px 0;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:700px){main{width:min(100% - 32px,1040px);margin-top:34px}.summary,.ratings,.comments{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.record-meta{display:block}.top{padding:15px 16px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><b>教师试用反馈</b><small>5000美元，5万棵树 · RESEARCH CONSOLE</small></div><a href="/forest.html">返回教学单元</a></header>
  <main><p style="color:var(--green);font-size:11px;letter-spacing:.1em;font-weight:700">TEACHER PILOT</p><h1>目标对齐与课堂可用性</h1><p class="lead">仅显示已提交的匿名教师反馈。量表为 1–5 分；开放反馈不包含姓名、邮箱或学习者数据。</p><div id="app"><p class="empty">正在读取反馈…</p></div></main>
  <script>
    const labels={gaiValue:'GAI 提供实际教学价值',storyUnderstanding:'理解中国治沙故事',safeExpression:'更安心地尝试中文表达',storytelling:'更灵活、生动地讲好中国故事',adoption:'使用或迁移意愿'};
    const commentLabels={value:'最有价值的地方',revision:'最需修改或完善'};
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=value=>new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));
    function render(records){const app=document.getElementById('app');if(!records.length){app.innerHTML='<p class="empty">还没有已提交的教师反馈。</p>';return}const keys=Object.keys(labels),average=key=>(records.reduce((sum,row)=>sum+Number(row.ratings?.[key]||0),0)/records.length).toFixed(1);app.innerHTML=`<div class="summary"><div class="metric"><b>${records.length}</b><span>已提交反馈</span></div><div class="metric"><b>${average('gaiValue')}</b><span>GAI 教学价值</span></div><div class="metric"><b>${average('storyUnderstanding')}</b><span>理解治沙故事</span></div><div class="metric"><b>${average('safeExpression')}</b><span>安心表达</span></div><div class="metric"><b>${average('adoption')}</b><span>使用意愿</span></div></div><section class="section"><h2>量表均值</h2><div class="ratings">${keys.map(key=>`<div class="rating"><span>${labels[key]}</span><b>${average(key)} / 5</b></div>`).join('')}</div></section><section class="section"><h2>逐份匿名反馈</h2>${records.map(row=>`<article class="record"><div class="record-meta"><span>${esc(row.teachingYears)} 教龄</span><span>${date(row.submittedAt)}</span></div>${row.hasVoice?`<div style="margin-top:16px"><small style="color:var(--green);font-weight:700">教师语音反馈 · ${Math.floor(row.voiceSeconds/60)}:${String(row.voiceSeconds%60).padStart(2,'0')}</small><audio controls preload="metadata" style="display:block;width:100%;margin-top:7px" src="/api/teacher-feedback?audio=${encodeURIComponent(row.id)}"></audio></div>`:''}<div class="comments">${Object.entries(commentLabels).map(([key,label])=>`<article><small>${label}</small><p>${esc(row.comments?.[key]||'—')}</p></article>`).join('')}</div></article>`).join('')}</section>`}
    fetch('/api/teacher-feedback').then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'无法读取反馈');render(data.records||[])}).catch(error=>{document.getElementById('app').innerHTML=`<p class="empty">${esc(error.message)}</p>`});
  </script>
</body>
</html>
