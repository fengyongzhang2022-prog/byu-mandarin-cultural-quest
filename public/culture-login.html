<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11120f"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>登录｜一座古寺，一件袈裟</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;align-items:flex-end;padding:clamp(24px,6vw,80px);background:#11120f url('/assets/kasaya-hero-v1.png') center/cover;color:#f4f0e6;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(10,11,9,.96),rgba(10,11,9,.68) 52%,rgba(10,11,9,.12)),linear-gradient(0deg,rgba(10,11,9,.84),transparent 62%)}main{position:relative;width:min(520px,100%);padding:0 0 2vh}.seal{width:40px;height:40px;border:1px solid #c5a36d;border-radius:50%;display:grid;place-items:center;color:#c5a36d;font-family:"Noto Serif SC","Songti SC",serif}h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(48px,6.4vw,78px);line-height:1.02;letter-spacing:-.055em;margin:24px 0 17px}p{color:#c7c5bc;line-height:1.75;font-size:13px;max-width:48ch}.fields{margin-top:26px;border-top:1px solid rgba(255,255,255,.22)}label{display:block;border-bottom:1px solid rgba(255,255,255,.22)}input{width:100%;height:58px;border:0;background:transparent;color:#f4f0e6;outline:none;padding:0 2px;font:inherit}input::placeholder{color:#86877f}button{width:100%;height:52px;margin-top:18px;border:1px solid #c5a36d;background:#c5a36d;color:#1d1811;font-weight:800;cursor:pointer}button:hover{background:#dec08f;border-color:#dec08f}button:disabled{opacity:.55}.error{min-height:20px;color:#e48a72}.note{font-size:11px;color:#94968d}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  </style>
</head>
<body><main><span class="seal">寻</span><h1>一座古寺<br>一件袈裟</h1><p>从《黑神话：悟空》的画面进入两条文化线索。观察、追问、比较，再用中文讲清楚文化物件、人物与当代生活之间的关系。</p><form id="form"><div class="fields"><label><span class="sr">账号</span><input id="username" autocomplete="username" placeholder="课程账号" required></label><label><span class="sr">密码</span><input id="password" type="password" autocomplete="current-password" placeholder="密码" required></label></div><button id="submit">进入寻迹合辑</button><p class="error" id="error"></p></form><p class="note">使用教师发放的匿名课程账号。学习记录默认保存在本设备。</p></main><script>const form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='正在验证…';error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');const requested=new URLSearchParams(location.search).get('next');location.href=requested==='/culture.html'?requested:'/culture.html'}catch(e){error.textContent=e.message;submit.disabled=false;submit.textContent='进入寻迹合辑'}}</script></body>
</html>
