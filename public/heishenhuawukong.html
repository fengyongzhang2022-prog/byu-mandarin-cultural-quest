<body>
<div id="world">
  <div class="embers"><i class="ember"></i><i class="ember"></i><i class="ember"></i><i class="ember"></i></div>
  <header>
    <div class="brand"><span class="seal">衣</span><div><strong>一件不该被抢的衣服</strong><small>BLACK MYTH · KASAYA QUEST</small></div></div>
    <nav class="trail" id="trail" aria-label="任务阶段"></nav>
    <div class="actions"><button class="icon-btn" id="soundToggle" title="环境声">声 <span>环境</span></button><button class="icon-btn" id="hintToggle" title="给我一点提示">示 <span>Hint</span></button><button class="icon-btn" id="logout" title="退出">退</button></div>
  </header>
  <main><section class="panel" id="panel"></section><aside class="stage-aside" id="aside"></aside></main>
  <div class="scrim" id="scrim"></div><aside class="hint-drawer" id="hintDrawer"></aside><div class="toast" id="toast"></div>
</div>
<script>
  const STAGES=[
    {id:'enter',n:'序',name:'进入故事',scene:'/assets/kasaya-hero-v1.png'},
    {id:'pre',n:'前',name:'任务前录音',scene:'/assets/kasaya-hero-v1.png'},
    {id:'discover',n:'寻',name:'发现袈裟',scene:'/assets/kasaya-hero-v1.png'},
    {id:'interact',n:'问',name:'问金池长老',scene:'/assets/black-myth-elder-jinchi.jpg'},
    {id:'compare',n:'辩',name:'与黑熊精协商',scene:'/assets/black-myth-black-bear-guai.jpg'},
    {id:'explain',n:'讲',name:'讲清这件衣服',scene:'/assets/kasaya-hero-v1.png'},
    {id:'extend',n:'读',name:'山外见闻',scene:'/assets/kasaya-hero-v1.png'}
  ];
  const EVIDENCE=[
    {id:'surface',k:'衣面',title:'拼接的外观',short:'弃布、清洗、缝成',text:'早期佛教传统中的粪扫衣可由弃布清洗后缝成。拼接外观可以提醒朴素与节制。',source:'博物馆藏品说明与教师改写'},
    {id:'jewel',k:'宝光',title:'特殊的锦襕袈裟',short:'珍宝让衣服被看见',text:'《西游记》把唐僧的锦襕袈裟写成缀有珍宝的特殊宝衣。衣服的外观、来历和观看者共同产生价值。',source:'《西游记》第十六回'},
    {id:'collection',k:'藏单',title:'已经有很多件',short:'收藏没有结束欲望',text:'金池长老已经收藏许多袈裟，看见锦襕袈裟后仍想占有。他想守住衣服，也想守住别人眼中的身份。',source:'文学叙事与游戏人物线索'},
    {id:'aftermath',k:'火后',title:'占有推动行动',short:'借看、藏留、纵火、取走',text:'喜欢逐步进入占有。藏留、纵火和趁火取衣让一件衣服与伤害连在一起。',source:'文学情节概括'}
  ];
  const HINTS={
    enter:['你将作为火后禅院的记事人，追查同一件袈裟在两个人眼中的意义。','先说你看见的衣服，再问它为什么会变成宝物。'],
    pre:['先说这件衣服本来有什么作用。','再说谁想得到它，以及你对这件事的初步判断。'],
    discover:['看看衣服原来的功能、后来获得的价值、想得到它的人和行动后果。','可以问：谁让它变得珍贵？得到以后发生了什么？'],
    interact:['问金池长老：你已经有很多件，为什么还想要这一件？','继续问：你喜欢的是衣服，还是别人看你的方式？'],
    compare:['想一个本来实用、后来代表身份或价格的物件。','可以选择牛仔裤、限量运动鞋、棒球帽或你文化中的物件。','比较：原来功能｜后来意义｜谁赋予价值｜行动后果。'],
    explain:['按“本来—后来—我认为”组织。','比较时说：它们都……；可是……。','最后说明这个比较能帮助理解什么，边界在哪里。'],
    extend:['选择最吸引你的一条材料，每次读一条即可。','读后录60–90秒：我读到……这让我重新理解……。']
  };
  const KEY='kasaya_quest_state_v5',SESSIONS='bmw_research_sessions_v4';
  const fresh=()=>({version:'5.0-kasaya',participant:'',index:0,maxIndex:0,startedAt:new Date().toISOString(),events:[],sound:false,hints:{},pre:{transcript:'',seconds:0,audioKey:'',retakes:0,quiz:{}},opened:[],selectedEvidence:'',histories:{interact:[],compare:[]},camera:false,explain:{transcript:'',seconds:0,mediaKey:'',retakes:0,feedback:'',story:'',revision:'',postQuiz:{}},extension:[]});
  let state=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'));state.pre=Object.assign(fresh().pre,state.pre||{});state.histories=Object.assign(fresh().histories,state.histories||{});state.explain=Object.assign(fresh().explain,state.explain||{});
  const panel=document.getElementById('panel'),aside=document.getElementById('aside'),trail=document.getElementById('trail'),toastEl=document.getElementById('toast');
  let recorder=null,stream=null,chunks=[],recognition=null,transcript='',interim='',started=0,ticker=null,maxTimer=null,recordKind='',recordMode='',cameraStream=null,cameraOpen=false,talkBusy=false;
  let audioCtx=null,ambientMaster=null,ambientNodes=[];
  const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const format=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function event(type,data={}){state.events.push({type,at:new Date().toISOString(),stage:STAGES[state.index].id,...data});save()}
  function toast(text){toastEl.textContent=text;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2600)}
  function stage(){return STAGES[state.index]}
  function setScene(){document.documentElement.style.setProperty('--scene',`url('${stage().scene}')`)}
  function nav(){trail.innerHTML=STAGES.map((s,i)=>`<button aria-label="${s.name}" class="${i===state.index?'active':i<state.maxIndex?'done':''}" ${i>state.maxIndex?'disabled':''} data-go="${i}">${s.n}</button>`).join('');trail.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
  function side(){aside.style.setProperty('--progress',`${(state.index/(STAGES.length-1))*100}%`);aside.innerHTML=`<b>${String(state.index+1).padStart(2,'0')} / ${String(STAGES.length).padStart(2,'0')} · ${stage().name}</b><p>${sideCopy[stage().id]}</p><div class="progress"><i></i></div>`}
  const sideCopy={enter:'一件衣服留在火后。你负责记录它怎样进入人的目光与欲望。',pre:'先留下你的初步解释。录音最长三分钟，可以回听和重说。',discover:'从衣面、宝光、藏单和火后行动中拾取证据；随时去问人物。',interact:'金池长老会回应你的话。听不懂就继续问，角色每句可以重听。',compare:'黑熊精相信宝物可以归强者。用证据和跨文化物件让他重新想。',explain:'用四十五至六十秒讲清这件衣服。你可以回听、重录，也可以开启摄像头。',extend:'核心任务已经完成。材料持续开放，你以后可以随时回来。'};
  function go(i){if(i>state.maxIndex)return;stopOpenMedia();state.index=i;save();render();event('stage_open',{index:i})}
  function advance(){state.maxIndex=Math.max(state.maxIndex,state.index+1);state.index=Math.min(state.index+1,STAGES.length-1);save();render()}
  function render(){setScene();nav();side();({enter:renderEnter,pre:renderPre,discover:renderDiscover,interact:()=>renderTalk('interact'),compare:()=>renderTalk('compare'),explain:renderExplain,extend:renderExtend})[stage().id]();reattachCamera()}
  function renderEnter(){panel.innerHTML=`<p class="eyebrow">BLACK MYTH: WUKONG · KASAYA QUEST</p><h1>一件衣服<br><em>两种欲望</em></h1><p class="lead">火熄以后，一件袈裟留在焦木案台上。金池长老想占有它，黑熊精又在火中把它取走。你作为记事人，用中文问清这件衣服怎样改变了人。</p><div class="meta"><span class="chip">Intermediate High–Advanced Low</span><span class="chip">核心体验 3–8分钟</span><span class="chip">语音角色互动</span></div><div class="form-row"><input class="field" id="participant" value="${esc(state.participant)}" placeholder="匿名参与者编号" maxlength="24"><button class="primary" id="enterBtn">进入故事</button></div><p class="small">进入后先检查麦克风。摄像头与环境声由你选择开启；Hint全程可用。</p>`;document.getElementById('enterBtn').onclick=()=>{const value=document.getElementById('participant').value.trim();if(!value)return toast('请输入匿名参与者编号');state.participant=value;event('quest_started');advance()}}

  function downloadRecord(){const blob=new Blob([JSON.stringify(sessionRecord(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.participant||'participant'}-kasaya-session.json`;a.click();URL.revokeObjectURL(a.href)}
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('kasayaQuestMedia',1);req.onupgradeneeded=()=>req.result.createObjectStore('media');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function storeBlob(key,blob){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
  async function loadBlob(key){if(!key)return null;const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('media');const req=tx.objectStore('media').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
  if(state.sound)state.sound=false;cameraOpen=false;render();
</script>
</body>
</html>
