    function quizHTML(scope,answers){return `<div class="quiz">${quizQuestions.map((q,i)=>`<div class="quiz-card"><strong>${i+1}. ${q.q}</strong>${q.choices.map((c,j)=>`<label><input type="radio" name="${scope}-${q.id}" data-quiz="${scope}" data-q="${q.id}" value="${j}" ${answers[q.id]===j?'checked':''}>${c}</label>`).join('')}</div>`).join('')}</div>`}

    function renderPre(){sheet.innerHTML=`${nav()}<p class="scene-label">RESEARCH PRE · 任务前测</p><h2>进入故事前，先留下你现在的文化解释。</h2><p class="line">不查资料。请用中文回答：土地庙是什么？人们可能做什么？它为什么有意义？建议至少录制1分钟；如需展开，可录至3分钟。系统会同时保存录音与文字转写。</p><div class="passport"><input class="field" id="pid" maxlength="24" placeholder="匿名编号，例如 BYU-021" value="${escapeHTML(state.participant)}"><select class="select" id="familiarity"><option value="">游戏熟悉度</option>${['1 · 没玩过','2 · 了解一点','3 · 玩过部分','4 · 比较熟悉','5 · 非常熟悉'].map((x,i)=>`<option value="${i+1}" ${state.gameFamiliarity==i+1?'selected':''}>${x}</option>`).join('')}</select><button class="ghost" id="preMic">● 转写补充</button></div><div class="actions"><button class="cta" id="recordPreAudio">录制前测音频</button><button class="ghost hidden" id="stopPreAudio">停止录制</button><button class="ghost hidden" id="playPreAudio">回听</button><button class="ghost hidden" id="downloadPreAudio">保存录音</button><span class="status" id="preAudioStatus">建议至少1分钟，最长3分钟</span></div><textarea class="textarea" id="preText" placeholder="录音的语音转写会出现在这里；设备无法录音或识别语音时也可直接输入。">${escapeHTML(state.preTranscript)}</textarea>${quizHTML('pre',state.preQuiz)}<label class="consent"><input id="consent" type="checkbox" ${state.consent?'checked':''}> 我同意把匿名录音、测验、文化解释、AI互动记录和反思用于课程研究；我可以随时退出。</label><div class="actions"><button class="cta" id="preNext">保存前测，进入故事 →</button><span class="status">pre-audio＋pre-quiz＋pre cultural explanation</span></div>`;
      const pid=document.getElementById('pid'),preText=document.getElementById('preText');pid.oninput=()=>state.participant=pid.value.trim();preText.oninput=()=>state.preTranscript=preText.value.trim();document.getElementById('familiarity').onchange=e=>state.gameFamiliarity=e.target.value;document.getElementById('consent').onchange=e=>state.consent=e.target.checked;bindQuiz('pre',state.preQuiz);document.getElementById('preMic').onclick=e=>toggleRecognition(e.currentTarget,text=>{state.preTranscript=(state.preTranscript+' '+text).trim();preText.value=state.preTranscript});document.getElementById('recordPreAudio').onclick=startPreAudio;document.getElementById('stopPreAudio').onclick=stopPreAudio;document.getElementById('playPreAudio').onclick=playPreAudio;document.getElementById('downloadPreAudio').onclick=downloadPreAudio;if(state.preAudioUrl){document.getElementById('playPreAudio').classList.remove('hidden');document.getElementById('downloadPreAudio').classList.remove('hidden');document.getElementById('preAudioStatus').textContent=`已录制 ${state.preAudioSeconds} 秒`};document.getElementById('preNext').onclick=()=>{if(!state.participant)return showToast('请填写匿名编号');if(!state.gameFamiliarity)return showToast('请选择游戏熟悉度');if(!state.preAudioBlob)return showToast('请先录制前测音频');if(!state.preTranscript)return showToast('请确认录音已转写；可直接补充文字');if(!quizComplete(state.preQuiz))return showToast('请完成三道前测题');if(!state.consent)return showToast('请确认研究同意');log('pretest_complete',{quizScore:quizScore(state.preQuiz),transcript:state.preTranscript,audioSeconds:state.preAudioSeconds});go(1)}
    }

    async function startPreAudio(){if(!state.participant)return showToast('请先填写匿名编号，再录制前测音频');if(!navigator.mediaDevices?.getUserMedia)return showToast('浏览器不支持录音，请使用Chrome或Edge');state.preTranscript='';state.preAudioBlob=null;state.preAudioUrl='';const previousText=document.getElementById('preText');if(previousText)previousText.value='';try{preAudioStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x))||'';const chunks=[];preAudioRecorder=new MediaRecorder(preAudioStream,mime?{mimeType:mime}:undefined);preAudioRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};preAudioRecorder.onstop=async()=>{state.preAudioBlob=new Blob(chunks,{type:preAudioRecorder.mimeType||'audio/webm'});state.preAudioUrl=URL.createObjectURL(state.preAudioBlob);state.preAudioSeconds=preAudioSeconds;await storeVideo(state.preAudioBlob,`${state.participant}-pre-audio`);log('pre_audio_complete',{seconds:state.preAudioSeconds,size:state.preAudioBlob.size});renderPre()};preAudioRecorder.start(500);preAudioSeconds=0;document.getElementById('recordPreAudio').classList.add('hidden');document.getElementById('stopPreAudio').classList.remove('hidden');document.getElementById('preAudioStatus').textContent='正在录制…建议至少1分钟，最长3分钟';startPreAudioTranscript();preAudioTimer=setInterval(()=>{preAudioSeconds++;const status=document.getElementById('preAudioStatus');if(status)status.textContent=`正在录制 ${preAudioSeconds} 秒${preAudioSeconds>=60?' · 已达到建议时长':''}`;if(preAudioSeconds>=180)stopPreAudio()},1000);log('pre_audio_started')}catch{showToast('未获得麦克风权限；请允许麦克风后重试')}}
    function startPreAudioTranscript(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();activeRecognition=r;r.lang='zh-CN';r.continuous=true;r.interimResults=false;r.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;state.preTranscript=(state.preTranscript+' '+text).trim();const el=document.getElementById('preText');if(el)el.value=state.preTranscript};r.onend=()=>{if(preAudioRecorder?.state==='recording')try{r.start()}catch{}};try{r.start()}catch{}}

    function renderEnter(){sheet.innerHTML=`${nav()}<p class="scene-label">ENTER · 进入故事／角色扮演</p><h2>你的身份：天命人。选择今天需要的表达支持。</h2>${tierCards()}<div class="role-grid"><div class="role-card"><small>YOUR ROLE</small><strong>天命人</strong><p>你熟悉游戏，但这次不只看战斗。你要追踪三口钟、古观音禅院和黑风山的火，用中文解释画面如何制造文化意义。</p></div><div class="mission-card"><small>YOUR MISSION</small><p><strong>禅院回声：</strong>三口钟把你带进古观音禅院，金池长老与黑熊精分别守着两种执念。</p><p>你可以自由探看、随时返回；再用有证据、有边界的中文讲清：游戏怎样改写寺院空间、人物与火焰。</p></div></div><div class="actions"><button class="cta" id="accept">赴观音禅院 →</button><span class="status">Immersion → Role-taking → Cultural mission</span></div>`;bindTierCards();document.getElementById('accept').onclick=()=>{log('role_accepted',{role:'天命人',supportMode:state.tier,world:'黑神话：悟空·黑风山·古观音禅院'});go(2)}}

    function renderDiscover(){const required=requiredMaterials();sheet.innerHTML=`${nav()}<p class="scene-label">DISCOVER · 发现文化／文化探究</p><h2>查看不同性质的材料，再说出你的理解和疑问。</h2><p class="line">建筑、人物神话、宗教实践和游戏改编需要互相对照。当前支持方式建议整合札记约 ${tier().noteTarget} 字。</p><div class="material-bar">${required.map(id=>`<button class="material-button ${state.opened.includes(id)?'done':''}" data-material="${id}">${state.opened.includes(id)?'✓ ':''}${materials[id].title}</button>`).join('')}</div><div id="materialArea">${state.activeMaterial&&required.includes(state.activeMaterial)?materialHTML(state.activeMaterial):''}</div><div class="note-row"><button class="mic" id="noteMic">●</button><input class="field" id="notes" value="${escapeHTML(state.notes)}" placeholder="我注意到……；材料之间……；我想知道……"></div>${state.tier==='guide'?'<div class="chips"><button class="chip" data-note-frame>插入句架：材料A显示……；材料B补充……；材料C提醒我们……</button></div>':''}<div class="actions"><button class="cta" id="discoverNext">带着证据去见西游行者 →</button><span class="status" id="discoverStatus">已查看 ${required.filter(x=>state.opened.includes(x)).length}/${required.length} · 札记 ${state.notes.length}/${tier().noteTarget} 字</span></div>`;

    const talkConfig={
      interact:{tag:'INTERACT · AI角色互动',title:'金池长老在古观音禅院中等你。用中文追问，不要只问定义。',actor:'金池长老',opening:'三钟响过，旧寺重现。你觉得我守着的是一座寺，还是一场执念？',next:'带着他的回应去见黑熊精 →'},

    async function sendTalk(mode,message){message=String(message||'').trim();if(!message)return showToast('先说一句中文');if(talkBusy)return showToast('AI角色正在回应');talkBusy=true;stopRecognition();const history=state.histories[mode];history.push({role:'user',content:message,at:new Date().toISOString(),channel:'speech_or_text'});log('oral_turn',{stage:mode,role:'user',text:message,tier:state.tier});renderTalk(mode);const status=document.getElementById('voiceStatus');if(status)status.textContent='AI角色正在回应并推进情境…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:mode,tier:tier().api,message,history:history.slice(0,-1),notes:state.notes})});const data=await response.json();const reply=data.reply||'请再举一个例子。';history.push({role:'assistant',content:reply,at:new Date().toISOString(),demo:Boolean(data.demo)});log('oral_turn',{stage:mode,role:'assistant',text:reply,demo:Boolean(data.demo),tier:state.tier});renderTalk(mode);speak(reply,mode)}catch{const reply=mode==='interact'?'游戏里的功能和现实中的文化意义，完全一样吗？':'这个类比哪里有帮助，哪里又会误导我？';history.push({role:'assistant',content:reply,at:new Date().toISOString(),demo:true});renderTalk(mode);speak(reply,mode)}finally{talkBusy=false}}

    async function startTalkVoice(mode){if(talkBusy)return showToast('AI角色正在回应');if(!navigator.mediaDevices?.getUserMedia)return showToast('浏览器不支持录音；可使用文字补充');try{turnDraft='';turnChunks=[];turnStream=await navigator.mediaDevices.getUserMedia({audio:true});turnRecorder=new MediaRecorder(turnStream);turnRecorder.ondataavailable=e=>{if(e.data.size)turnChunks.push(e.data)};turnRecorder.onstop=()=>{turnStream?.getTracks().forEach(t=>t.stop());setTimeout(()=>finishTalkVoice(mode),180)};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){turnRecognition=new SR();turnRecognition.lang='zh-CN';turnRecognition.continuous=true;turnRecognition.interimResults=false;turnRecognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)turnDraft+=e.results[i][0].transcript;const s=document.getElementById('voiceStatus');if(s)s.textContent=`正在记录：${turnDraft}`};turnRecognition.start()}turnStartedAt=Date.now();turnRecorder.start(300);document.getElementById('voiceTurn').classList.add('live');document.getElementById('stopVoiceTurn').classList.remove('hidden');document.getElementById('voiceStatus').textContent='正在聆听…说完后点击“结束并发送”';log('voice_turn_started',{stage:mode})}catch{showToast('未获得麦克风权限；也可使用文字补充')}}

    async function speak(text,role='narrator'){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const voices=await availableVoices(),zh=voices.filter(v=>/^zh(-|_)/i.test(v.lang)||/(Chinese|中文|普通话)/i.test(v.name));const male=[/Yunxi/i,/Yunjian/i,/Yunyang/i,/Kangkang/i,/Li-Mu/i],female=[/Xiaoxiao/i,/Xiaoyi/i,/Tingting/i,/Huihui/i];const prefs=role==='interact'?male:role==='compare'?female:female;let voice=null;for(const p of prefs){voice=zh.find(v=>p.test(v.name));if(voice)break}voice=voice||zh[0]||null;const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.voice=voice;u.rate=(role==='interact'?.86:role==='compare'?.98:.9)*(state.tier==='guide'?.92:1);u.pitch=role==='interact'?.7:role==='compare'?1.1:.96;u.onstart=()=>{world.classList.add('talking');log('voice_playback',{role,voice:voice?.name||'browser-default'})};u.onend=()=>world.classList.remove('talking');speechSynthesis.speak(u)}

    const detailPanel=document.getElementById('detail');if(detailPanel)new MutationObserver(enhanceTeacherVoiceLogs).observe(detailPanel,{subtree:true,childList:true});
    const studentConversationOnly=renderTalk;renderTalk=mode=>{studentConversationOnly(mode);sheet.querySelectorAll('.dialogue .replay').forEach(button=>button.remove())};
    renderTalk=mode=>{const c=blackWindTalk[mode],history=state.histories[mode];sheet.innerHTML=`${nav()}<p class="scene-label">${c.tag}</p><h2>${c.title}</h2><p class="line">点击圆点，直接和${c.actor}说中文；再次点击结束这一轮并发送。${c.actor}回应后，你可以继续点击、继续追问。这里不需要输入文字。</p><div class="chips"><span class="chip">${mode==='interact'?'金池长老 · 苍老男声':'黑熊精 · 低沉男声'}</span><span class="chip">语音对话会自动保留在研究记录</span></div><div class="dialogue" id="dialogue"><div class="bubble">${c.actor}：${c.opening}</div>${history.map(m=>`<div class="bubble ${m.role==='user'?'me':''}">${m.role==='user'?'你（语音）':c.actor}：${m.role==='user'?'我听见了你的话':escapeHTML(m.content)}</div>`).join('')}</div><div class="talk-row"><button class="mic" id="voiceTurn" aria-label="点击开始或结束说话" title="点击开始或结束说话">●</button><span class="status" id="voiceStatus">点击圆点开始说话</span></div><div class="actions"><button class="cta" id="talkNext">${c.next}</button><span class="status">已留下 ${history.filter(x=>x.role==='user').length} 次表达 · 可以继续追问</span></div>`;const voice=document.getElementById('voiceTurn');voice.onclick=()=>{if(turnRecorder?.state==='recording'){stopTalkVoice()}else{startTalkVoice(mode)}};document.getElementById('talkNext').onclick=()=>go(state.index+1);requestAnimationFrame(()=>document.getElementById('dialogue').scrollTop=9999)};
    startTalkVoice=async mode=>{if(talkBusy)return showToast('AI角色正在回应');const button=document.getElementById('voiceTurn'),status=document.getElementById('voiceStatus');if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){if(status)status.textContent='当前浏览器没有可用的麦克风录音';return showToast('请使用支持麦克风的Chrome或Edge')};if(status)status.textContent='正在请求麦克风…';try{talkStopRequested=false;talkInterim='';turnDraft='';turnChunks=[];turnStream=await navigator.mediaDevices.getUserMedia({audio:true});turnRecorder=new MediaRecorder(turnStream);turnRecorder.ondataavailable=e=>{if(e.data.size)turnChunks.push(e.data)};turnRecorder.onstop=()=>{turnStream?.getTracks().forEach(t=>t.stop());if(talkRestartTimer)clearTimeout(talkRestartTimer);setTimeout(()=>finishTalkVoice(mode),120)};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const restart=()=>{if(talkStopRequested||turnRecorder?.state!=='recording')return;try{turnRecognition.start()}catch{talkRestartTimer=setTimeout(restart,300)}};turnRecognition=new SR();turnRecognition.lang='zh-CN';turnRecognition.continuous=true;turnRecognition.interimResults=true;turnRecognition.maxAlternatives=1;turnRecognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const phrase=e.results[i][0].transcript;if(e.results[i].isFinal)turnDraft+=phrase;else interim+=phrase}talkInterim=interim;const s=document.getElementById('voiceStatus');if(s)s.textContent=turnDraft||talkInterim?`正在听：${turnDraft}${talkInterim}`:'正在聆听…'};turnRecognition.onerror=e=>{if(e.error!=='aborted'){const s=document.getElementById('voiceStatus');if(s)s.textContent='正在继续聆听…';restart()}};turnRecognition.onend=restart}else if(status)status.textContent='正在录音…当前浏览器没有语音转写';turnStartedAt=Date.now();turnRecorder.start(200);if(SR)try{turnRecognition.start()}catch{setTimeout(()=>{try{turnRecognition.start()}catch{}},250)}button?.classList.add('live');if(button)button.setAttribute('aria-pressed','true');document.getElementById('voiceStatus').textContent='正在聆听…再次点击圆点结束并发送';log('voice_turn_started',{stage:mode,recognition:Boolean(SR)})}catch{turnStream?.getTracks().forEach(t=>t.stop());button?.classList.remove('live');if(button)button.setAttribute('aria-pressed','false');if(status)status.textContent='麦克风没有启动';showToast('麦克风没有启动，请检查浏览器权限后重试')}};
    stopTalkVoice=()=>{talkStopRequested=true;if(talkRestartTimer)clearTimeout(talkRestartTimer);if(turnRecognition)try{turnRecognition.stop()}catch{}if(turnRecorder?.state==='recording')turnRecorder.stop()};
    finishTalkVoice=async mode=>{const blob=new Blob(turnChunks,{type:turnRecorder?.mimeType||'audio/webm'}),seconds=Math.max(1,Math.round((Date.now()-turnStartedAt)/1000)),transcript=(turnDraft+' '+talkInterim).trim();if(!transcript){renderTalk(mode);showToast('录音已保存，但没有识别到中文；请再点击圆点并说完整一句');return}await sendTurnToAI(mode,transcript,{blob,seconds,channel:'voice'})};
    const voiceRenderWithReplay=renderTalk;renderTalk=mode=>{voiceRenderWithReplay(mode);const c=blackWindTalk[mode],history=state.histories[mode],bubbles=[...sheet.querySelectorAll('#dialogue .bubble')];if(bubbles[0]){const first=document.createElement('button');first.className='replay';first.textContent='听';first.onclick=()=>speak(c.opening,mode);bubbles[0].appendChild(first)}let index=1;history.forEach(m=>{const bubble=bubbles[index++];if(m.role==='assistant'&&bubble){const replay=document.createElement('button');replay.className='replay';replay.textContent='听';replay.onclick=()=>speak(m.content,mode);bubble.appendChild(replay)}})};
    let roleCameraStream=null,roleCameraOpen=false;
    async function toggleRoleCamera(){const button=document.getElementById('roleCameraToggle'),video=document.getElementById('roleCameraVideo'),status=document.getElementById('roleCameraStatus');if(roleCameraOpen){roleCameraStream?.getTracks().forEach(t=>t.stop());roleCameraStream=null;roleCameraOpen=false;if(video){video.srcObject=null;video.classList.add('hidden')}if(button)button.textContent='打开摄像头';if(status)status.textContent='摄像头未开启';return}if(!navigator.mediaDevices?.getUserMedia){if(status)status.textContent='当前浏览器不支持摄像头';return showToast('当前浏览器不支持摄像头')};if(status)status.textContent='正在请求摄像头…';try{roleCameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});roleCameraOpen=true;if(video){video.srcObject=roleCameraStream;video.classList.remove('hidden');await video.play()}if(button)button.textContent='关闭摄像头';if(status)status.textContent='摄像头已开启；语音对话仍由圆点控制'}catch{if(status)status.textContent='摄像头未开启';showToast('没有获得摄像头权限，可继续只用语音对话')}}
    const cameraTalkRender=renderTalk;renderTalk=mode=>{cameraTalkRender(mode);const talk=sheet.querySelector('#dialogue');if(!talk)return;const panel=document.createElement('div');panel.className='role-camera';panel.style.cssText='display:flex;align-items:center;gap:10px;max-width:360px;margin:10px 0 4px';panel.innerHTML='<video id="roleCameraVideo" class="hidden" autoplay muted playsinline style="width:118px;height:76px;object-fit:cover;border:1px solid var(--line);background:#080c0a"></video><div><button class="ghost" id="roleCameraToggle">打开摄像头</button><div class="status" id="roleCameraStatus">摄像头未开启（可选）</div></div>';talk.before(panel);const button=document.getElementById('roleCameraToggle');button.onclick=toggleRoleCamera;if(roleCameraOpen&&roleCameraStream){button.textContent='关闭摄像头';const video=document.getElementById('roleCameraVideo');video.classList.remove('hidden');video.srcObject=roleCameraStream;video.play().catch(()=>{})}};
    const baseGoWithCamera=go;go=index=>{if(scenes[index]?.key!=='interact'&&scenes[index]?.key!=='compare'&&roleCameraStream){roleCameraStream.getTracks().forEach(t=>t.stop());roleCameraStream=null;roleCameraOpen=false}return baseGoWithCamera(index)};
    const baseSpeakWithResume=speak;speak=async(text,role='narrator')=>{if('speechSynthesis'in window)speechSynthesis.resume();return baseSpeakWithResume(text,role)};
  </script>
