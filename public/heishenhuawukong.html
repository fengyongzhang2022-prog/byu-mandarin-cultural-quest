<body>
<div id="world">
  <header>
    <div class="brand"><span class="seal">隰</span><div><strong>小西天<span class="brand-long"> · 第二次生命</span></strong><small>BLACK MYTH · CULTURAL QUEST</small></div></div>
    <nav class="trail" id="trail" aria-label="任务阶段"></nav>
    <div class="actions">
      <button class="icon" id="soundToggle" title="环境声">声 <span class="label">环境</span></button>
      <button class="icon" id="readingToggle" title="扩展材料">读 <span class="label">材料</span></button>
      <button class="icon" id="hintToggle" title="提示">示 <span class="label">Hint</span></button>
      <button class="icon" id="logout" title="退出">退</button>
    </div>
  </header>
  <main><section class="panel" id="panel"></section><aside class="stage-aside" id="aside"></aside></main>
  <div class="scrim" id="scrim"></div><aside class="drawer" id="drawer"></aside><div class="toast" id="toast"></div>
  <section class="viewer" id="viewer" aria-hidden="true" aria-label="多角度图片观察">
    <div class="viewer-head"><div><strong id="viewerTitle">多角度观察</strong><p id="viewerCaption">拖动图片；滚轮、双指或按钮缩放。</p></div><button class="quiet" id="viewerClose">关闭</button></div>
    <div class="viewer-stage" id="viewerStage"><img id="viewerImage" alt="可缩放观察图片" draggable="false"></div>
    <div class="viewer-foot"><div class="viewer-film" id="viewerFilm"></div><div class="viewer-tools"><button id="zoomOut" aria-label="缩小">−</button><output id="zoomReadout">100%</output><button id="zoomIn" aria-label="放大">＋</button><button id="viewerReset">复位</button><button id="viewerFull">全屏</button></div></div>
  </section>
</div>
<script>
  const STAGES=[
    {id:'enter',n:'入',name:'进入小西天',scene:'/assets/xiaoxitian-game.jpg',x:'64%'},
    {id:'pre',n:'前',name:'任务前录音',scene:'/assets/xiaoxitian-mist.jpg',x:'55%'},
    {id:'discover',n:'证',name:'寻找证据',scene:'/assets/xiaoxitian-sculpture.jpg',x:'58%'},

  function renderDiscover(){const selected=FACTS.find(x=>x.id===state.selectedFact),count=Object.keys(state.observations).length;panel.innerHTML=`<p class="eyebrow">DISCOVER · 看图寻找文化证据</p><h2>古寺、游戏与游客变化<br>连成一条线</h2><p class="lead">打开图片，切换观察角度并放大细节。每看一组图，选择一项你真正看到的发现；这些发现会进入 Alex 的追问。</p><div class="evidence-list">${FACTS.map(x=>`<button class="evidence ${state.opened.includes(x.id)?'opened':''}" data-fact="${x.id}"><img class="evidence-thumb" src="${x.thumb}" alt="${x.title}" loading="lazy"><span class="evidence-copy"><small>${x.k}</small><strong>${x.title}</strong><span>${x.short}</span></span></button>`).join('')}</div><div>${selected?factDetail(selected):'<div class="evidence-detail">选择一组图片，从画面里找证据。你可以随时切换，不必按顺序。</div>'}</div><div class="form-row" style="margin-top:14px"><button class="primary" id="discoverNext">带着观察去见 Alex →</button><span class="small">已完成 ${count}/3 项观察；至少完成两项</span></div>`;panel.querySelectorAll('.evidence[data-fact]').forEach(b=>b.onclick=()=>{state.selectedFact=b.dataset.fact;if(!state.opened.includes(b.dataset.fact))state.opened.push(b.dataset.fact);event('fact_open',{id:b.dataset.fact});renderDiscover()});panel.querySelectorAll('[data-viewset]').forEach(b=>b.onclick=()=>openViewer(b.dataset.viewset));panel.querySelectorAll('[data-observe]').forEach(b=>b.onclick=()=>{state.observations[b.dataset.observeFact]=b.dataset.observe;event('visual_observation',{fact:b.dataset.observeFact,choice:b.dataset.observe});renderDiscover()});document.getElementById('discoverNext').onclick=()=>{if(Object.keys(state.observations).length<2)return toast('请至少完成两项看图观察，再带着发现去对话');advance()}}

  function renderInteract(){const notes=Object.values(state.observations);renderTalk('alex',`<p class="eyebrow">INTERACT · 进入角色对话</p><h2>把看见的细节<br>讲给 Alex</h2><p class="lead">开始后直接说中文。Alex会从你的看图发现继续追问；听不懂可以请他重复、放慢或换一种说法。短暂停顿会自动结束这一轮，点击“结束对话”可以随时停下。</p>${notes.length?`<div class="meta">${notes.map(x=>`<span class="chip">我看到：${esc(x)}</span>`).join('')}</div>`:''}`,`带着玩家的问题去设计方案 →`)}

  function renderTalk(mode,intro,nextLabel){const role=roleFor(mode),hist=historyFor(mode),busyText=talkStatus==='speak'?`${role.actor} 正在开口…`:`${role.actor} 正在组织回应，最长约四秒…`;panel.innerHTML=`${intro}<div class="meta"><span class="chip">${role.actor}</span><span class="chip">${role.tag}</span>${mode==='alex'?'<span class="chip voice-proof">固定成年男声 · 云健</span>':''}<span class="chip">角色话语可重听</span></div>${talkEvidenceHtml(mode)}<div class="dialogue" id="dialogue"><div class="bubble"><b>${role.actor}</b><br>${role.opening}<button class="replay" data-opening>听</button></div>${hist.map((m,i)=>`<div class="bubble ${m.role==='user'?'me':''}"><b>${m.role==='user'?'你 · 语音':role.actor}</b><br>${m.role==='user'?`语音 ${fmt(m.seconds||0)}`:esc(m.content)}${m.role==='assistant'?`<button class="replay" data-replay="${i}">听</button>`:''}</div>`).join('')}</div><div class="record-box"><div class="talk-bar"><button class="primary session-btn ${conversationActive?'live':''}" id="conversationBtn">${conversationActive?'结束对话':'开始对话'}</button><button class="orb ${talkBusy?'busy':''}" id="talkOrb" aria-label="当前轮开始或结束"></button><div class="record-status" id="recordStatus">${talkBusy?`<span class="thinking">${busyText}</span>`:conversationActive?'正在等你说中文；停顿后会自动发送':'点击“开始对话”进入连续语音'}<span class="timer" id="timer">00:00</span></div></div><div class="meter"><i id="meter"></i></div></div><div class="camera-box"><video id="camera" autoplay muted playsinline class="${cameraOpen?'':'hidden'}"></video><div><button class="quiet" id="cameraToggle">${cameraOpen?'关闭摄像头':'打开摄像头'}</button><p class="small">打开摄像头可以增加面对面的沉浸感。</p></div></div><button class="primary" id="talkNext">${nextLabel}</button>`;document.querySelector('[data-opening]').onclick=()=>speak(role.opening,mode);panel.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>speak(hist[Number(b.dataset.replay)].content,mode));panel.querySelectorAll('[data-talk-view]').forEach(b=>b.onclick=()=>openViewer(b.dataset.talkView));document.getElementById('conversationBtn').onclick=()=>{if(conversationActive){endConversation();renderConversationMode(mode)}else beginConversation(mode)};document.getElementById('talkOrb').onclick=()=>recorder?.state==='recording'?stopRecording():beginConversation(mode);document.getElementById('cameraToggle').onclick=toggleCamera;document.getElementById('talkNext').onclick=()=>{if(!hist.some(x=>x.role==='user'))return toast('请先和角色完成至少一轮语音对话');advance()};if(mode==='alex')prefetchRoleAudio(role.opening,mode);requestAnimationFrame(()=>{const d=document.getElementById('dialogue');d.scrollTop=d.scrollHeight})}
  function renderDecide(){const role=ROLE[state.stakeholder],hist=state.histories.stakeholder;panel.innerHTML=`<p class="eyebrow">DECIDE · 设计交互式文化项目</p><h2>六项措施<br>选出三项</h2><p class="lead">你的方案需要同时回应文物安全、游客体验与县城发展。选择三项措施，再请一位利益相关者检验方案。</p><div class="plan-grid">${PLANS.map(x=>`<button class="plan ${state.plans.includes(x.id)?'selected':''}" data-plan="${x.id}"><small>方案 ${x.k}</small><strong>${x.title}</strong><span>${x.text}</span></button>`).join('')}</div><p class="small">已选择 ${state.plans.length}/3：${state.plans.map(id=>PLANS.find(x=>x.id===id)?.title).filter(Boolean).join('、')||'等待选择'}</p><div class="role-tabs"><button class="quiet ${state.stakeholder==='guard'?'active':''}" data-role="guard">请文保人员质询</button><button class="quiet ${state.stakeholder==='volunteer'?'active':''}" data-role="volunteer">请青年志愿者质询</button></div><div class="dialogue" id="dialogue"><div class="bubble"><b>${role.actor}</b><br>${role.opening}<button class="replay" data-opening>听</button></div>${hist.map((m,i)=>`<div class="bubble ${m.role==='user'?'me':''}"><b>${m.role==='user'?'你 · 语音':role.actor}</b><br>${m.role==='user'?`语音 ${fmt(m.seconds||0)}`:esc(m.content)}${m.role==='assistant'?`<button class="replay" data-replay="${i}">听</button>`:''}</div>`).join('')}</div><div class="record-box"><div class="talk-bar"><button class="primary session-btn ${conversationActive?'live':''}" id="conversationBtn">${conversationActive?'结束对话':'开始质询'}</button><button class="orb ${talkBusy?'busy':''}" id="talkOrb"></button><div class="record-status" id="recordStatus">${talkBusy?'<span class="thinking">角色正在回应…</span>':conversationActive?'说明方案；停顿后自动发送':'选好三项措施，再开始语音质询'}<span class="timer" id="timer">00:00</span></div></div><div class="meter"><i id="meter"></i></div></div><button class="primary" id="decideNext">把方案带到美国案例中比较 →</button>`;panel.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const id=b.dataset.plan,i=state.plans.indexOf(id);if(i>=0)state.plans.splice(i,1);else if(state.plans.length<3)state.plans.push(id);else return toast('已经选择三项；先取消一项再更换');event('plan_toggle',{id,selected:state.plans.includes(id)});renderDecide()});panel.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{endConversation();state.stakeholder=b.dataset.role;state.histories.stakeholder=[];event('stakeholder_choose',{role:state.stakeholder});renderDecide()});document.querySelector('[data-opening]').onclick=()=>speak(role.opening,'stakeholder');panel.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>speak(hist[Number(b.dataset.replay)].content,'stakeholder'));document.getElementById('conversationBtn').onclick=()=>{if(state.plans.length!==3)return toast('先选择三项措施');conversationActive?endConversation():beginConversation('stakeholder')};document.getElementById('talkOrb').onclick=()=>{if(state.plans.length!==3)return toast('先选择三项措施');recorder?.state==='recording'?stopRecording():beginConversation('stakeholder')};document.getElementById('decideNext').onclick=()=>{if(state.plans.length!==3)return toast('请选择三项措施');if(!hist.some(x=>x.role==='user'))return toast('请先回应一位利益相关者');advance()};requestAnimationFrame(()=>{const d=document.getElementById('dialogue');d.scrollTop=d.scrollHeight})}
  function renderCompare(){const role=ROLE.compare,hist=state.histories.compare,axes=[['crowd','游客拥挤与交通'],['protect','资源保护'],['access','公平进入与体验']];panel.innerHTML=`<p class="eyebrow">COMPARE · 把文化差异变成学习资源</p><h2>小西天 × Yosemite</h2><p class="lead">先打开两地图片，选择一个比较角度；再用一个相似点、一个差异点和一句“比较边界”与 Mia 协商。</p><div class="compare-board"><div class="site-card"><div class="site-image"><img src="/assets/xiaoxitian-guide.jpg" alt="小西天殿内游客"><button class="quiet" data-viewset="xiaoxitianCompare">放大 · 换角度</button></div><small>山西 · 小西天</small><h3>紧凑的悬塑空间</h3><ul><li>核心空间约169.6平方米</li><li>游客从日均三四百人增至一万以上</li><li>保护文物，也回应县城发展机会</li></ul></div><div class="site-card"><div class="site-image"><img src="/assets/yosemite-traffic.webp" alt="Yosemite道路拥堵"><button class="quiet" data-viewset="yosemiteCompare">放大 · 换角度</button></div><small>美国 · Yosemite</small><h3>国家公园的进入管理</h3><ul><li>减少道路拥堵与入口等待</li><li>保护自然与文化资源</li><li>兼顾公平进入和游客体验</li></ul></div></div><p class="small">选择你要先谈的比较角度：</p><div class="axis-row">${axes.map(([id,label])=>`<button class="quiet ${state.comparison.axis===id?'selected':''}" data-axis="${id}">${label}</button>`).join('')}</div><div class="frame"><span><b>相似</b>从图片看，两地都……</span><span><b>不同</b>小西天……；Yosemite……</span><span><b>边界</b>这个比较能解释……，但两地的……不同。</span></div><div class="dialogue" id="dialogue"><div class="bubble"><b>${role.actor}</b><br>${role.opening}<button class="replay" data-opening>听</button></div>${hist.map((m,i)=>`<div class="bubble ${m.role==='user'?'me':''}"><b>${m.role==='user'?'你 · 语音':role.actor}</b><br>${m.role==='user'?`语音 ${fmt(m.seconds||0)}`:esc(m.content)}${m.role==='assistant'?`<button class="replay" data-replay="${i}">听</button>`:''}</div>`).join('')}</div><div class="record-box"><div class="talk-bar"><button class="primary session-btn ${conversationActive?'live':''}" id="conversationBtn">${conversationActive?'结束比较':'开始比较'}</button><button class="orb ${talkBusy?'busy':''}" id="talkOrb"></button><div class="record-status" id="recordStatus">${talkBusy?'<span class="thinking">比较伙伴正在回应…</span>':conversationActive?'说出相似、不同与边界':'看图并选一个角度，再开始中文比较'}<span class="timer" id="timer">00:00</span></div></div><div class="meter"><i id="meter"></i></div></div><p class="source">比较材料与图片：<a href="https://www.nps.gov/yose/getinvolved/visitoraccessmanagement.htm" target="_blank" rel="noopener">U.S. National Park Service · Yosemite Visitor Access Management Plan</a></p><button class="primary" id="compareNext">准备讲述小西天的第二次生命 →</button>`;panel.querySelectorAll('[data-viewset]').forEach(b=>b.onclick=()=>openViewer(b.dataset.viewset));panel.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>{state.comparison.axis=b.dataset.axis;event('comparison_axis',{axis:b.dataset.axis});renderCompare()});document.querySelector('[data-opening]').onclick=()=>speak(role.opening,'compare');panel.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>speak(hist[Number(b.dataset.replay)].content,'compare'));document.getElementById('conversationBtn').onclick=()=>{if(!state.comparison.axis)return toast('请先选择一个比较角度');conversationActive?endConversation():beginConversation('compare')};document.getElementById('talkOrb').onclick=()=>{if(!state.comparison.axis)return toast('请先选择一个比较角度');recorder?.state==='recording'?stopRecording():beginConversation('compare')};document.getElementById('compareNext').onclick=()=>{if(!hist.some(x=>x.role==='user'))return toast('请先完成一次跨文化语音比较');advance()};requestAnimationFrame(()=>{const d=document.getElementById('dialogue');d.scrollTop=d.scrollHeight})}
  function renderExplain(){const post=state.explain.postQuiz;panel.innerHTML=`<p class="eyebrow">EXPLAIN · 讲好中国故事</p><h2>让古寺被看见<br>也被好好保护</h2><p class="lead">面向一位不了解中国的国际玩家，讲60至90秒。使用至少两个事实，说明你的三项方案，再加入一句有边界的跨文化比较。</p><div class="record-box"><div class="record-row"><button class="orb" id="explainBtn"></button><div class="record-status" id="recordStatus">点击圆点开始${cameraOpen?'视频':'语音'}讲述<span class="timer" id="timer">00:00 / 01:30</span></div></div><div class="meter"><i id="meter"></i></div><div class="camera-box"><video id="camera" autoplay muted playsinline class="${cameraOpen?'':'hidden'}"></video><button class="quiet" id="cameraToggle">${cameraOpen?'关闭摄像头':'打开摄像头'}</button></div><div class="playback" id="explainPlayback"></div></div>${state.explain.feedback?`<p class="eyebrow" style="margin-top:22px">AI 口语教练 · 一条可立即使用的建议</p><div class="evidence-detail">${esc(state.explain.feedback)}</div><p class="lead" style="font-size:15px">根据这条建议补说20至30秒。</p><div class="record-box"><div class="record-row"><button class="orb" id="revisionBtn"></button><div class="record-status">点击圆点开始补说<span class="timer" id="revisionTimer">00:00 / 00:30</span></div></div><div class="playback" id="revisionPlayback"></div></div>`:''}${state.explain.story?`<p class="eyebrow" style="margin-top:22px">你的中国故事</p><div class="story">${esc(state.explain.story)}</div>`:''}<div class="form-row" style="margin-top:12px"><button class="quiet" id="feedbackBtn">请AI给一条建议</button><button class="quiet" id="storyBtn">整理我的故事</button></div><p class="eyebrow" style="margin-top:24px">POST · 任务后</p>${quizHtml('post',post)}<button class="primary" id="finishBtn">揭晓小西天的真实回应 →</button>`;document.getElementById('explainBtn').onclick=()=>toggleRecording('explain');document.getElementById('cameraToggle').onclick=toggleCamera;renderPlayback('explain');bindQuiz('post',post);if(document.getElementById('revisionBtn')){document.getElementById('revisionBtn').onclick=()=>toggleRecording('revision');renderPlayback('revision')}document.getElementById('feedbackBtn').onclick=async()=>{if(!state.explain.mediaKey)return toast('请先完成一次讲述');state.explain.feedback=await askAI('feedback',state.explain.transcript||planSummary(),[]);event('ai_feedback');renderExplain()};document.getElementById('storyBtn').onclick=async()=>{if(!state.explain.mediaKey)return toast('请先完成一次讲述');state.explain.story=await askAI('story',state.explain.transcript||planSummary(),[]);event('story_generate');renderExplain()};document.getElementById('finishBtn').onclick=()=>{if(!state.explain.mediaKey)return toast('请先完成60至90秒讲述');if(state.explain.feedback&&!state.explain.revisionKey)return toast('请根据AI建议完成一次补说');state.completedAt=new Date().toISOString();event('core_complete');advance()}}
  function renderReveal(){panel.innerHTML=`<p class="eyebrow">REVEAL · 当地的真实回应</p><h2>流量来了<br>古寺这样回应</h2><p class="lead">你的方案与真实行动现在可以放在一起比较。这里讲述的是一座古寺在数字时代如何继续开放、被保护，并连接一座县城的生活。</p><div class="reveal-line"><b>2024 · 现场</b><p>当地成立工作专班，组织志愿者服务游客；政府机关停车场等空间参与分流和保障。</p></div><div class="reveal-line"><b>2024 · 进入</b><p>景区实行线上预约、分时售票和每日接待上限，并通过单向游线、停车与接驳改善参观秩序。</p></div><div class="reveal-line"><b>2026 · 监测</b><p>核心区域使用微环境监测系统，持续关注温湿度、人群密度和二氧化碳浓度，用数据帮助文物保护。</p></div><div class="meta"><span class="chip">你的方案：${esc(state.plans.map(id=>PLANS.find(x=>x.id===id)?.title).filter(Boolean).join('、'))}</span><span class="chip">AI角色对话已记录</span><span class="chip">文化解释已完成</span></div>${state.explain.story?`<p class="eyebrow" style="margin-top:24px">本次文化故事</p><div class="story">${esc(state.explain.story)}</div>`:''}<p class="eyebrow" style="margin-top:26px">EXTEND · 继续探索</p><div class="reading-list">${READINGS.map(x=>readingCard(x)).join('')}</div><div class="form-row"><button class="quiet" id="download">导出本次学习记录</button><button class="quiet" id="restart">开始新任务</button></div><p class="source">事实来源：<a href="https://www.ctnews.com.cn/dongtai/content/2024-10/03/content_165621.html" target="_blank" rel="noopener">中国旅游报 2024-10-03</a>；<a href="https://www.zyshgzb.gov.cn/n1/2024/1017/c459563-40341254.html" target="_blank" rel="noopener">中央社会工作部 2024-10-17</a>；<a href="https://wjw.shanxi.gov.cn/xwzx/szyw/202606/t20260615_10146174.shtml" target="_blank" rel="noopener">山西省政府转载 2026-06-15</a></p>`;bindReadings();document.getElementById('download').onclick=downloadRecord;document.getElementById('restart').onclick=()=>{if(confirm('开始新任务会清空当前页面状态；已完成的研究记录仍会保留。')){state=fresh();persist();render()}}}

  function showDrawer(kind){const drawer=document.getElementById('drawer');if(kind==='reading'){drawer.innerHTML=`<div class="drawer-head"><h3>任务后的资料架</h3><button class="quiet" id="closeDrawer">关闭</button></div><p class="small">核心体验结束后，可以随时选择一条路径继续阅读。</p><div class="reading-list">${READINGS.map(x=>readingCard(x)).join('')}</div>`;drawer.querySelectorAll('[data-reading]').forEach(a=>a.onclick=()=>event('extension_open',{id:a.dataset.reading}))}else{const id=stage().id,items=HINTS[id],level=Math.min(state.hints[id]||1,items.length);drawer.innerHTML=`<div class="drawer-head"><h3>给我一点提示</h3><button class="quiet" id="closeDrawer">关闭</button></div>${items.slice(0,level).map((x,i)=>`<div class="hint-step"><small>第 ${i+1} 层</small><p>${x}</p></div>`).join('')}${level<items.length?'<button class="hint-more" id="hintMore">再给一点</button>':''}`;if(level<items.length)document.getElementById('hintMore').onclick=()=>{state.hints[id]=level+1;event('hint_open',{level:level+1});showDrawer('hint')};event('hint_view',{level})}drawer.classList.add('open');document.getElementById('scrim').classList.add('open');document.getElementById('closeDrawer').onclick=closeDrawer}
