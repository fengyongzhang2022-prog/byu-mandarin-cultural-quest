<body>

  function renderCompare(){const role=ROLE.compare,hist=state.histories.compare;panel.innerHTML=`<p class="eyebrow">COMPARE · 把文化差异变成学习资源</p><h2>小西天 × Yosemite</h2><p class="lead">两地都在管理游客进入、资源保护与参观体验。使用一个相似点、一个差异点，并说明这个类比能解释到哪里。</p><div class="compare-board"><div class="site-card"><small>山西 · 小西天</small><h3>古寺中的悬塑空间</h3><ul><li>核心空间紧凑，文物对环境变化敏感</li><li>游戏带来急速增长的游客</li><li>县城公共服务与社区发展同步变化</li></ul></div><div class="site-card"><small>美国 · Yosemite</small><h3>国家公园的游客进入管理</h3><ul><li>减少拥挤与交通压力</li><li>保护自然与文化资源</li><li>兼顾公平进入和游客体验</li></ul></div></div><div class="frame"><span><b>相似</b>两地都……</span><span><b>不同</b>小西天……；Yosemite……</span><span><b>边界</b>这个比较能帮助……，但……不能等同。</span></div><div class="dialogue" id="dialogue"><div class="bubble"><b>${role.actor}</b><br>${role.opening}<button class="replay" data-opening>听</button></div>${hist.map((m,i)=>`<div class="bubble ${m.role==='user'?'me':''}"><b>${m.role==='user'?'你 · 语音':role.actor}</b><br>${m.role==='user'?`语音 ${fmt(m.seconds||0)}`:esc(m.content)}${m.role==='assistant'?`<button class="replay" data-replay="${i}">听</button>`:''}</div>`).join('')}</div><div class="record-box"><div class="talk-bar"><button class="primary session-btn ${conversationActive?'live':''}" id="conversationBtn">${conversationActive?'结束比较':'开始比较'}</button><button class="orb ${talkBusy?'busy':''}" id="talkOrb"></button><div class="record-status" id="recordStatus">${talkBusy?'<span class="thinking">比较伙伴正在回应…</span>':conversationActive?'说出相似、不同与边界':'点击开始，用中文和比较伙伴协商'}<span class="timer" id="timer">00:00</span></div></div><div class="meter"><i id="meter"></i></div></div><p class="source">比较材料：<a href="https://www.nps.gov/yose/getinvolved/visitoraccessmanagement.htm" target="_blank" rel="noopener">U.S. National Park Service · Yosemite Visitor Access Management Plan</a></p><button class="primary" id="compareNext">准备讲述小西天的第二次生命 →</button>`;document.querySelector('[data-opening]').onclick=()=>speak(role.opening,'compare');panel.querySelectorAll('[data-replay]')   function renderExplain(){const post=state.explain.postQuiz;panel.innerHTML=`<p class="eyebrow">EXPLAIN · 讲好中国故事</p><h2>让古寺被看见<br>也被好好保护</h2><p class="lead">面向一位不了解中国的国际玩家，讲60至90秒。使用至少两个事实，说明你的三项方案，再加入一句有边界的跨文化比较。</p><div class="record-box"><div class="record-row"><button class="orb" id="explainBtn"></button><div class="record-status" id="recordStatus">点击圆点开始${cameraOpen?'视频':'语音'}讲述<span class="timer" id="timer">00:00 / 01:30</span></div></div><div class="meter"><i id="meter"></i></div><div class="camera-box"><video id="camera" autoplay muted playsinline class="${cameraOpen?'':'hidden'}"></video><button class="quiet" id="cameraToggle">${cameraOpen?'关闭摄像头':'打开摄像头'}</button></div><div class="playback" id="explainPlayback"></div></div>${state.explain.feedback?`<p class="eyebrow" style="margin-top:22px">AI 口语教练 · 一条可立即使用的建议</p><div class="evidence-detail">${esc(state.explain.feedback)}</div><p class="lead" style="font-size:15px">根据这条建议补说20至30秒。</p><div class="record-box"><div class="record-row"><button class="orb" id="revisionBtn"></button><div class="record-status">点击圆点开始补说<span class="timer" id="revisionTimer">00:00 / 00:30</span></div></div><div class="playback" id="revisionPlayback"></div></div>`:''}${state.explain.story?`<p class="eyebrow" style="margin-top:22px">你的中国故事</p><div class="story">${esc(state.explain.story)}</div>`:''}<div class="form-row" style="margin-top:12px"><button class="quiet" id="feedbackBtn">请AI给一条建议</button><button class="quiet" id="storyBtn">整理我的故事</button></div><p class="eyebrow" style="margin-top:24px">POST · 任务后</p>${quizHtml('post',post)}<button class="primary" id="finishBtn">揭晓小西天的真实回应 →</button>`;document.getElementById('explainBtn').onclick=()=>toggleRecording('explain');document.getElementById('cameraToggle').onclick=toggleCamera;renderPlayback('explain');bindQuiz('post',post);if(document.getElementById('revisionBtn')){document.getElementById('revisionBtn').onclick=()=>toggleRecording('revision');renderPlayback('revision')}document.getElementById('feedbackBtn').onclick=async()=>{if(!state.explain.mediaKey)return toast('请先完成一次讲述');state.explain.feedback=await askAI('feedback',state.explain.transcript||planSummary(),[]);event('ai_feedback');renderExplain()};document.getElementById('storyBtn').onclick=async()=>{if(!state.explain.mediaKey)return toast('请先完成一次讲述');state.explain.story=await askAI('story',state.explain.transcript||planSummary(),[]);event('story_generate');renderExplain()};document.getElementById('finishBtn').onclick=()=>{if(!state.explain.mediaKey)return toast('请先完成60至90秒讲述');if(state.explain.feedback&&!state.explain.revisionKey)return toast('请根据AI建议完成一次补说');state.completedAt=new Date().toISOString();event('core_complete');advance()}}
  function renderReveal(){panel.innerHTML=`<p class="eyebrow">REVEAL · 当地的真实回应</p><h2>流量来了<br>古寺这样回应</h2><p class="lead">你的方案与真实行动现在可以放在一起比较。这里讲述的是一座古寺在数字时代如何继续开放、被保护，并连接一座县城的生活。</p><div class="reveal-line"><b>2024 · 现场</b><p>当地成立工作专班，组织志愿者服务游客；政府机关停车场等空间参与分流和保障。</p></div><div class="reveal-line"><b>2024 · 进入</b><p>景区实行线上预约、分时售票和每日接待上限，并通过单向游线、停车与接驳改善参观秩序。</p></div><div class="reveal-line"><b>2026 · 监测</b><p>核心区域使用微环境监测系统，持续关注温湿度、人群密度和二氧化碳浓度，用数据帮助文物保护。</p></div><div class="meta"><span class="chip">你的方案：${esc(state.plans.map(id=>PLANS.find(x=>x.id===id)?.title).filter(Boolean).join('、'))}</span><span class="chip">AI角色对话已记录</span><span class="chip">文化解释已完成</span></div>${state.explain.story?`<p class="eyebrow" style="margin-top:24px">本次文化故事</p><div class="story">${esc(state.explain.story)}</div>`:''}<p class="eyebrow" style="margin-top:26px">EXTEND · 继续探索</p><div class="reading-list">${READINGS.map(x=>readingCard(x)).join('')}</div><div class="form-row"><button class="quiet" id="download">导出本次学习记录</button><button class="quiet" id="restart">开始新任务</button></div><p class="source">事实来源：<a href="https://www.ctnews.com.cn/dongtai/content/2024-10/03/content_165621.html" target="_blank" rel="noopener">中国旅游报 2024-10-03</a>；<a href="https://www.zyshgzb.gov.cn/n1/2024/1017/c459563-40341254.html" target="_blank" rel="noopener">中央社会工作部 2024-10-17</a>；<a href="https://wjw.shanxi.gov.cn/xwzx/szyw/202606/t20260615_10146174.shtml" target="_blank" rel="noopener">山西省政府转载 2026-06-15</a></p>`;bindReadings();document.getElementById('download').onclick=downloadRecord;document.getElementById('restart').onclick=()=>{if(confirm('开始新任务会清空当前页面状态；已完成的研究记录仍会保留。')){state=fresh();persist();render()}}}
  function readingCard(x){return `<a class="reading" href="${x.url}" target="_blank" rel="noopener" data-reading="${x.id}"><small>${x.k}</small><strong>${x.title}</strong><span>${x.text}</span></a>`}
  function bindReadings(){panel.querySelectorAll('[data-reading]').forEach(a=>a.onclick=()=>{if(!state.extension.includes(a.dataset.reading))state.extension.push(a.dataset.reading);event('extension_open',{id:a.dataset.reading})})}
  function showDrawer(kind){const drawer=document.getElementById('drawer');if(kind==='reading'){drawer.innerHTML=`<div class="drawer-head"><h3>任务后的资料架</h3><button class="quiet" id="closeDrawer">关闭</button></div><p class="small">核心体验结束后，可以随时选择一条路径继续阅读。</p><div class="reading-list">${READINGS.map(x=>readingCard(x)).join('')}</div>`;drawer.querySelectorAll('[data-reading]').forEach(a=>a.onclick=()=>event('extension_open',{id:a.dataset.reading}))}else{const id=stage().id,items=HINTS[id],level=Math.min(state.hints[id]||1,items.length);drawer.innerHTML=`<div class="drawer-head"><h3>给我一点提示</h3><button class="quiet" id="closeDrawer">关闭</button></div>${items.slice(0,level).map((x,i)=>`<div class="hint-step"><small>第 ${i+1} 层</small><p>${x}</p></div>`).join('')}${level<items.length?'<button class="hint-more" id="hintMore">再给一点</button>':''}`;if(level<items.length)document.getElementById('hintMore').onclick=()=>{state.hints[id]=level+1;event('hint_open',{level:level+1});showDrawer('hint')};event('hint_view',{level})}drawer.classList.add('open');document.getElementById('scrim').classList.add('open');document.getElementById('closeDrawer').onclick=closeDrawer}
  function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open')}
  document.getElementById('hintToggle').onclick=()=>{if(!state.hints[stage().id])state.hints[stage().id]=1;showDrawer('hint')};document.getElementById('readingToggle').onclick=()=>showDrawer('reading');document.getElementById('scrim').onclick=closeDrawer;
  async function beginConversation(mode){if(talkBusy)return toast('角色正在回应');conversationActive=true;recordMode=mode;await startRecording('talk',mode)}
  function endConversation(){conversationActive=false;if(recorder?.state==='recording')stopRecording();speechSynthesis?.cancel();talkBusy=false}
  async function toggleRecording(kind,mode=''){if(recorder?.state==='recording')return stopRecording();await startRecording(kind,mode)}
  function currentOrb(kind=recordKind){return document.getElementById(kind==='talk'?'talkOrb':kind==='pre'?'recordBtn':kind==='revision'?'revisionBtn':'explainBtn')}
  function mimeFor(video){const choices=video?['video/webm;codecs=vp8,opus','video/webm']:['audio/webm;codecs=opus','audio/webm','audio/mp4'];return choices.find(x=>MediaRecorder.isTypeSupported?.(x))||''}
  async function startRecording(kind,mode=''){if(!window.isSecureContext)return toast('录音需要安全连接，请使用网站的 https 地址');if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')return toast('当前浏览器不支持录音，请使用最新版 Chrome、Edge 或 Safari');recordKind=kind;recordMode=mode;chunks=[];transcript='';interim='';started=Date.now();try{const audio=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});let tracks=[...audio.getAudioTracks()],video=false;if((kind==='explain'||kind==='revision')&&cameraOpen&&cameraStream){tracks.push(...cameraStream.getVideoTracks());video=true}recordStream=new MediaStream(tracks);const mime=mimeFor(video);recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=finishRecording;recorder.start(250);startRecognition();startMeter(audio,kind==='talk');duck(true);currentOrb(kind)?.classList.add('live');const status=document.getElementById('recordStatus');if(status&&kind!=='revision')status.childNodes[0].textContent=kind==='talk'?'正在听你说中文；停顿后自动发送':'正在录音；再次点击圆点结束';let seconds=0;ticker=setInterval(()=>{seconds++;const timer=document.getElementById(kind==='revision'?'revisionTimer':'timer');if(timer)timer.textContent=`${fmt(seconds)}${kind==='pre'?' / 03:00':kind==='explain'?' / 01:30':kind==='revision'?' / 00:30':''}`},1000);const max={pre:180,explain:90,revision:30,talk:90}[kind]||90;maxTimer=setTimeout(stopRecording,max*1000);event('record_start',{kind,mode,video})}catch(e){conversationActive=false;duck(false);toast(e?.name==='NotAllowedError'?'麦克风权限没有开启，请在地址栏允许麦克风':'麦克风没有启动，请刷新后重试');event('record_error',{kind,error:String(e?.name||'permission')})}}
  function startMeter(audio,autoStop){try{micContext=new (window.AudioContext||window.webkitAudioContext)();const source=micContext.createMediaStreamSource(audio),analyser=micContext.createAnalyser();analyser.fftSize=512;source.connect(analyser);const data=new Uint8Array(analyser.fftSize);let heard=false,lastVoice=Date.now();const tick=()=>{if(!recorder||recorder.state!=='recording')return;analyser.getByteTimeDomainData(data);let sum=0;for(const x of data){const v=(x-128)/128;sum+=v*v}const rms=Math.sqrt(sum/data.length),level=Math.min(100,Math.max(4,rms*850));const meter=document.getElementById('meter');if(meter)meter.style.width=`${level}%`;if(rms>.025){heard=true;lastVoice=Date.now()}if(autoStop&&heard&&Date.now()-lastVoice>1600&&Date.now()-started>1800)return stopRecording();if(autoStop&&!heard&&Date.now()-started>12000)return stopRecording();silenceFrame=requestAnimationFrame(tick)};tick()}catch{}}
  function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.lang='zh-CN';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const phrase=e.results[i][0].transcript;if(e.results[i].isFinal)transcript+=phrase;else interim+=phrase}};recognition.onend=()=>{if(recorder?.state==='recording')try{recognition.start()}catch{}};try{recognition.start()}catch{}}
  function stopRecording(){if(recorder?.state==='recording'){clearInterval(ticker);clearTimeout(maxTimer);cancelAnimationFrame(silenceFrame);try{recognition?.stop()}catch{}recorder.stop();currentOrb()?.classList.remove('live')}}
  async function finishRecording(){const seconds=Math.max(1,Math.round((Date.now()-started)/1000)),text=(transcript+' '+interim).trim(),type=recorder?.mimeType||'audio/webm',blob=new Blob(chunks,{type}),key=`${state.participant||'anon'}-${recordKind}-${recordMode||'main'}-${Date.now()}`;recordStream?.getAudioTracks().forEach(t=>t.stop());try{await micContext?.close()}catch{}await storeBlob(key,blob);duck(false);event('record_saved',{kind:recordKind,mode:recordMode,seconds,transcript:Boolean(text),mediaKey:key});if(recordKind==='pre'){state.pre.audioKey=key;state.pre.seconds=seconds;state.pre.transcript=text;state.pre.retakes++;persist();renderPre();return}if(recordKind==='explain'){state.explain.mediaKey=key;state.explain.seconds=seconds;state.explain.transcript=text;state.explain.retakes++;persist();renderExplain();return}if(recordKind==='revision'){state.explain.revisionKey=key;state.explain.revisionSeconds=seconds;state.explain.revision=text;persist();renderExplain();return}if(recordKind==='talk')await sendTalk(recordMode,text,key,seconds)}
  async function sendTalk(mode,text,audioKey,seconds){talkBusy=true;const hist=historyFor(mode);hist.push({role:'user',content:text||'（语音未能转写）',audioKey,seconds,at:new Date().toISOString()});persist();if(mode==='stakeholder')renderDecide();else if(mode==='alex')renderInteract();else renderCompare();let reply;if(!text){reply='刚才这一句没有听清。请放慢一点，用一个完整句子再说一次。'}else{reply=await askAI(mode,text,hist)}hist.push({role:'assistant',content:reply,at:new Date().toISOString()});if(mode==='compare')state.comparison.transcript=text;talkBusy=false;persist();if(mode==='stakeholder')renderDecide();else if(mode==='alex')renderInteract();else renderCompare();await speak(reply,mode);if(conversationActive&&recordMode===mode)setTimeout(()=>startRecording('talk',mode),350)}
  function planSummary(){return `证据：小西天有1978尊悬塑；游戏36处国内取景地中27处在山西；游客从每天300到400人增至一万人以上。我的方案：${state.plans.map(id=>PLANS.find(x=>x.id===id)?.title).filter(Boolean).join('、')}。`}
  async function askAI(stageName,message,history){try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:stageName,message,history,role:stageName==='stakeholder'?state.stakeholder:'',plans:state.plans})});if(!response.ok)throw new Error('AI unavailable');const data=await response.json();return data.reply||'我听见了。请再用一个事实说明你的判断。'}catch{if(stageName==='feedback')return'补充“因此”后的因果：说明你选择的一项措施怎样同时保护文物并改善游客体验。';if(stageName==='story')return`小西天保存着1978尊明代悬塑。游戏让它被更多人看见，也让日均游客从三四百人增加到一万人以上。我们选择${state.plans.map(id=>PLANS.find(x=>x.id===id)?.title).filter(Boolean).join('、')}，让文化遗产、游客体验和县城生活彼此支持。`;if(stageName==='alex')return'我知道这里有真实的悬塑了。你会用哪个事实说服一个只想打卡的玩家？';if(stageName==='compare')return'这个相似点很清楚。两地的空间和文化意义有什么不能直接等同？';return state.stakeholder==='guard'?'三项措施里，哪一项最直接降低核心空间的人流风险？':'你的方案会怎样让当地青年和居民参与进来？'}}
  function voices(){return new Promise(resolve=>{const list=speechSynthesis.getVoices();if(list.length)return resolve(list);const done=()=>resolve(speechSynthesis.getVoices());speechSynthesis.onvoiceschanged=done;setTimeout(done,900)})}
  async function speak(text,mode){if(!('speechSynthesis'in window)){toast('当前浏览器没有角色语音');return}speechSynthesis.cancel();duck(true);const list=await voices(),zh=list.filter(v=>/^zh/i.test(v.lang)||/(Chinese|中文|普通话)/i.test(v.name)),male=zh.find(v=>/(Yunxi|Yunjian|Yunyang|Kangkang|Male)/i.test(v.name))||zh.find(v=>!/(Xiaoxiao|Xiaoyi|Tingting)/i.test(v.name))||zh[0],u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.voice=mode==='alex'||mode==='compare'?(zh[0]||male||null):(male||null);u.rate=mode==='stakeholder'?.78:.86;u.pitch=mode==='stakeholder'?.72:.92;return new Promise(resolve=>{u.onend=()=>{duck(false);resolve()};u.onerror=()=>{duck(false);resolve()};speechSynthesis.speak(u);event('role_voice',{mode,voice:u.voice?.name||'device-default'})})}
  async function toggleCamera(){if(cameraOpen){cameraStream?.getTracks().forEach(t=>t.stop());cameraStream=null;cameraOpen=false;state.camera=false;persist();render();return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false});cameraOpen=true;state.camera=true;persist();render()}catch{toast('摄像头没有开启；语音任务可以继续')}}
  function reattachCamera(){if(!cameraOpen||!cameraStream)return;const video=document.getElementById('camera');if(video){video.srcObject=cameraStream;video.classList.remove('hidden');video.play().catch(()=>{})}}
  async function renderPlayback(kind){const data=kind==='pre'?state.pre:state.explain,key=kind==='pre'?data.audioKey:kind==='explain'?data.mediaKey:data.revisionKey,target=document.getElementById(kind==='pre'?'prePlayback':kind==='explain'?'explainPlayback':'revisionPlayback');if(!key||!target)return;const blob=await loadBlob(key);if(!blob)return;const url=URL.createObjectURL(blob),isVideo=blob.type.startsWith('video/');target.innerHTML=`<${isVideo?'video':'audio'} controls ${isVideo?'playsinline':''} src="${url}"></${isVideo?'video':'audio'}><button class="quiet" data-retake="${kind}">重说一次</button>`;target.querySelector('[data-retake]').onclick=()=>startRecording(kind)}
  async function enableAmbient(){if(!ambientContext){ambientContext=new (window.AudioContext||window.webkitAudioContext)();ambientMaster=ambientContext.createGain();ambientMaster.gain.value=.42;ambientMaster.connect(ambientContext.destination);const len=ambientContext.sampleRate*3,buf=ambientContext.createBuffer(1,len,ambientContext.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(.3+.12*Math.sin(i/4200));const wind=ambientContext.createBufferSource(),filter=ambientContext.createBiquadFilter(),gain=ambientContext.createGain();wind.buffer=buf;wind.loop=true;filter.type='lowpass';filter.frequency.value=330;gain.gain.value=.08;wind.connect(filter).connect(gain).connect(ambientMaster);wind.start()}await ambientContext.resume();state.sound=true;persist();document.getElementById('soundToggle').classList.add('active');event('ambient_on')}
  function disableAmbient(){state.sound=false;persist();ambientContext?.suspend();document.getElementById('soundToggle').classList.remove('active');event('ambient_off')}
  function duck(on){if(!ambientContext||!state.sound)return;ambientMaster.gain.cancelScheduledValues(ambientContext.currentTime);ambientMaster.gain.linearRampToValueAtTime(on?0:.42,ambientContext.currentTime+(on?.08:.6))}
  document.getElementById('soundToggle').onclick=()=>state.sound?disableAmbient():enableAmbient();document.getElementById('logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/login.html'}};
  function sessionRecord(){return{version:state.version,participant:state.participant,startedAt:state.startedAt,completedAt:state.completedAt,pre:state.pre,task:{world:'《黑神话：悟空》小西天',focus:'一座古寺的第二次生命',factsOpened:state.opened,dialogues:state.histories,stakeholder:state.stakeholder,plans:state.plans,comparison:state.comparison,hints:state.hints,finalTranscript:state.explain.transcript,finalSeconds:state.explain.seconds,finalMediaKey:state.explain.mediaKey,feedback:state.explain.feedback,revisionTranscript:state.explain.revision,revisionSeconds:state.explain.revisionSeconds,revisionMediaKey:state.explain.revisionKey,aiStoryCard:state.explain.story,extension:state.extension},post:{quizAnswers:state.explain.postQuiz},events:state.events}}
  function upsertSession(force){try{const record=sessionRecord(),all=JSON.parse(localStorage.getItem(SESSIONS)||'[]'),i=all.findIndex(x=>x.participant===record.participant&&x.startedAt===record.startedAt);if(i>=0)all[i]=record;else if(force||record.participant)all.push(record);localStorage.setItem(SESSIONS,JSON.stringify(all))}catch{}}
  function downloadRecord(){upsertSession(true);const blob=new Blob([JSON.stringify(sessionRecord(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.participant||'participant'}-xiaoxitian-session.json`;a.click();URL.revokeObjectURL(a.href)}
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('xiaoxitianQuestMedia',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('media'))req.result.createObjectStore('media')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function storeBlob(key,blob){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
  async function loadBlob(key){if(!key)return null;const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('media');const req=tx.objectStore('media').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
  if(state.sound)state.sound=false;cameraOpen=false;state.camera=false;persist();render();
