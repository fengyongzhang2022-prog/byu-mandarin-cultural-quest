    const KEY='heritage_dual_quest_v1';
    const blank=id=>({id,step:0,prediction:'',observations:{},opened:[],relation:'',history:[],plans:[],chain:[],object:'',comparison:{same:'',different:'',boundary:'',axis:''},explain:{transcript:'',outline:'',seconds:0,feedback:'',revision:''},completed:false,events:[]});
    let store;try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{store={}}store.temple=Object.assign(blank('temple'),store.temple||{});store.kasaya=Object.assign(blank('kasaya'),store.kasaya||{});
    let active=null,recording=null,recordTimer=null,recordSeconds=0,recordChunks=[],recordStream=null,recognition=null,audioUrl='';
    const app=document.getElementById('app'),topbar=document.getElementById('top'),progress=document.getElementById('progress'),progressCopy=document.getElementById('progressCopy'),progressBar=document.getElementById('progressBar'),drawer=document.getElementById('drawer'),drawerBody=document.getElementById('drawerBody');
    function save(){localStorage.setItem(KEY,JSON.stringify(store))}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function event(type,data={}){if(!active)return;store[active].events.push({type,at:new Date().toISOString(),...data});save()}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
    function speak(text){if(!('speechSynthesis'in window))return toast('当前浏览器不支持朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.86;speechSynthesis.speak(u)}
    function stepNav(story,state){return `<aside class="aside"><p class="eyebrow">学习路径</p><ol>${story.steps.map((x,i)=>`<li class="${i<state.step?'done':i===state.step?'current':''}">${String(i+1).padStart(2,'0')}　${x}</li>`).join('')}</ol><div class="aside-note">同一条逻辑：先观察，再用证据解释人物、关系与行动。提示只提供语言支架，不替你作判断。</div></aside>`}
    function shell(story,state,body){app.innerHTML=`<div class="view quest-shell"><div class="quest-wrap"><header class="quest-head"><div><p class="eyebrow">${story.short}文化任务 · ${story.stage[state.step]}</p><h2>${story.steps[state.step]}</h2></div><div class="step-count">${String(state.step+1).padStart(2,'0')}<small> / 08</small></div></header><div class="content-grid"><section class="stage">${body}</section>${stepNav(story,state)}</div></div></div>`;wireCommon();window.scrollTo({top:0,behavior:'smooth'})}
    function nextButton(label='继续 →'){return `<div class="next-row"><button class="text-btn" data-back>← 上一步</button><button class="primary" data-next>${label}</button></div>`}
    function wireCommon(){document.querySelector('[data-back]')?.addEventListener('click',()=>{const s=store[active];s.step=Math.max(0,s.step-1);save();render()});document.querySelector('[data-next]')?.addEventListener('click',advance)}
    function updateHeader(){if(!active){progress.hidden=true;document.getElementById('brandSeal').textContent='寻';return}const story=STORIES[active],s=store[active];progress.hidden=false;progressCopy.textContent=`${story.short} · ${s.step+1}/${story.steps.length}`;progressBar.style.width=`${(s.step+1)/story.steps.length*100}%`;document.getElementById('brandSeal').textContent=story.seal}
    function showHub(){active=null;updateHeader();app.innerHTML=`<div class="view"><section class="hub-hero"><div class="hero-media"><img src="/assets/kasaya-hero-v1.png" alt="火后禅院中的金红袈裟"></div><div class="hero-copy"><p class="eyebrow">《黑神话：悟空》文化任务合辑</p><h1><span>一座古寺</span><span class="accent">一件袈裟</span></h1><p class="lead">从游戏画面出发，进入真实文化。你要观察、追问、比较，再用中文讲清楚：文化怎样在当下被重新看见，也被重新理解。</p><div class="row"><button class="primary" data-scroll="#logic">先看学习路径</button><button class="secondary" data-start="temple">进入古寺</button><button class="secondary" data-start="kasaya">进入袈裟</button></div><div class="hero-note"><i></i><span>两个章节，同一套证据型文化解释逻辑</span></div></div></section><section class="manifesto" id="logic"><div><p class="eyebrow">ONE METHOD · TWO STORIES</p><h2>先看见，再解释。</h2><p class="muted">不是背诵文化知识，而是把可见细节、可靠事实、人物立场与行动后果连接起来。</p></div><div class="logic">${[['01','观察','从画面提出真正的问题'],['02','证据','区分游戏图像与文化事实'],['03','人物','在追问中解释立场和欲望'],['04','关系','把物、传播、人物与行动连起来'],['05','比较','说出相似、差异和类比边界'],['06','讲述','形成有证据的中文解释']].map(x=>`<div class="logic-row"><b>${x[0]}</b><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div></section>${chapterBlock('temple','01','/assets/xiaoxitian-aerial.jpg','数字传播让古寺获得新的关注，也带来保护、开放与地方发展的新问题。',['真实悬塑','游客变化','公共治理'])}${chapterBlock('kasaya','02','/assets/kasaya-hero-v1.png','一件衣服从修行之物变成争夺对象；物件的价值怎样进入人的眼光、欲望与行动？',['服饰文化','人物欲望','行动后果'])}<footer class="hub-footer"><span>寻迹 · 面向 Intermediate High–Advanced Low 中文学习者</span><span>学习记录默认保存在本设备</span></footer></div>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startStory(b.dataset.start));app.querySelector('[data-scroll]').onclick=()=>document.querySelector('#logic').scrollIntoView({behavior:'smooth'});window.scrollTo({top:0,behavior:'smooth'})}
    function chapterBlock(id,index,img,description,tags){const s=store[id],story=STORIES[id];return `<section class="chapter"><img src="${img}" alt="${story.name}"><span class="chapter-index">${index}</span><div class="chapter-copy"><p class="eyebrow">CHAPTER ${index}</p><h2>${story.name}</h2><p class="lead">${description}</p><div class="chapter-summary">${tags.map(x=>`<span>${x}</span>`).join('')}</div><button class="primary" data-start="${id}">${s.completed?'再次进入':s.step?'继续上次进度':'开始这一章'} →</button></div></section>`}
    function startStory(id){active=id;event('quest_open');render()}
    function render(){updateHeader();if(!active)return showHub();const story=STORIES[active],s=store[active];({enter:renderEnter,observe:renderObserve,evidence:renderEvidence,role:renderRole,decide:renderDecide,relationship:renderRelationship,compare:renderCompare,explain:renderExplain,reflect:renderReflect}[story.stage[s.step]])(story,s)}
    function renderEnter(story,s){const body=`<div class="opening"><img src="${story.hero}" alt="${story.name}"><div class="opening-copy"><p class="eyebrow">先判断 · 不必马上正确</p><h1>${story.name}</h1><p class="lead">${story.prompt}</p><div class="choice-list">${story.choices.map(x=>`<button class="choice ${s.prediction===x?'selected':''}" data-choice="${esc(x)}">${x}</button>`).join('')}</div><button class="primary" id="enterNext" ${s.prediction?'':'disabled'}>带着判断进入画面 →</button></div></div>`;shell(story,s,body);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.prediction=b.dataset.choice;event('prediction',{value:s.prediction});renderEnter(story,s)});document.getElementById('enterNext').onclick=advance}
    function renderObserve(story,s){const body=`<p class="lead">先只说你真正看见的。每幅画面选择一个观察，至少完成两幅；这些观察会进入角色的追问。</p><div class="gallery">${story.images.map((x,i)=>`<article class="shot"><img src="${x.src}" alt="${x.title}" loading="lazy"><div class="shot-copy"><b>${x.title}</b><p>${x.text}</p><div class="observe-options">${x.opts.map(o=>`<button class="mini ${s.observations[i]===o?'selected':''}" data-observe="${i}" data-value="${esc(o)}">${o}</button>`).join('')}</div></div></article>`).join('')}</div>${nextButton('带着观察打开事实 →')}`;shell(story,s,body);document.querySelectorAll('[data-observe]').forEach(b=>b.onclick=()=>{s.observations[b.dataset.observe]=b.dataset.value;event('observation',{image:b.dataset.observe,value:b.dataset.value});renderObserve(story,s)})}
    function renderEvidence(story,s){const body=`<p class="lead">游戏画面提出问题，文化事实提供边界。依次打开至少三张事实卡，并写出一句“关系句”。</p><div class="fact-list">${story.facts.map((f,i)=>`<article class="fact ${s.opened.includes(i)?'open':'locked'}"><span class="fact-no">${f.no}</span><div class="fact-copy"><h3>${f.title}</h3><p>${f.text}</p></div><div class="fact-actions"><button class="mini" data-open="${i}">${s.opened.includes(i)?'已打开':'打开'}</button>${s.opened.includes(i)?`<button class="mini" data-listen="${i}">听</button>`:''}</div></article>`).join('')}</div><div class="relationship"><strong>把两条事实连起来</strong><p class="muted">可用：原来……；后来……；因此…… / 本来……；因为人物把它看成……，所以……</p><textarea class="field" id="relation" placeholder="写下或说出你的关系句">${esc(s.relation)}</textarea><div class="talk-actions"><button class="secondary" id="voiceRelation">● 语音输入</button></div></div>${nextButton('带着证据去追问人物 →')}`;shell(story,s,body);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.open);if(!s.opened.includes(i))s.opened.push(i);event('fact_open',{index:i});renderEvidence(story,s)});document.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>speak(story.facts[Number(b.dataset.listen)].text));document.getElementById('relation').oninput=e=>{s.relation=e.target.value;save()};document.getElementById('voiceRelation').onclick=()=>dictate(document.getElementById('relation'),text=>{s.relation=text;save()})}
    function renderRole(story,s){const body=`<p class="lead">角色只知道材料中的事实，也有自己的立场。先回应他的追问，再主动问一个“为什么”或“如果……怎么办”。</p><div class="dialogue" id="dialogue"><div class="bubble"><b>${story.role.actor}</b>${story.role.opening}<button class="text-btn" data-speak="${esc(story.role.opening)}">听</button></div>${s.history.map(m=>`<div class="bubble ${m.role==='user'?'me':''}"><b>${m.role==='user'?'你的回应':story.role.actor}</b>${esc(m.content)}</div>`).join('')}</div><div class="talk-box"><label class="sr" for="roleText">你的回应</label><textarea class="field" id="roleText" placeholder="可以打字，也可以使用语音输入"></textarea><div class="talk-actions"><button class="secondary" id="roleVoice">● 语音输入</button><button class="primary" id="roleSend">发送回应</button></div></div>${nextButton(active==='temple'?'进入方案权衡 →':'连接价值与行动 →')}`;shell(story,s,body);document.querySelector('[data-speak]').onclick=()=>speak(story.role.opening);document.getElementById('roleVoice').onclick=()=>dictate(document.getElementById('roleText'));document.getElementById('roleSend').onclick=()=>sendRole(story,s);requestAnimationFrame(()=>{const d=document.getElementById('dialogue');d.scrollTop=d.scrollHeight})}
    async function sendRole(story,s){const field=document.getElementById('roleText'),message=field.value.trim();if(message.length<6)return toast('请先说出一个较完整的回应');s.history.push({role:'user',content:message});event('role_turn',{actor:story.role.actor});renderRole(story,s);const fallback=active==='temple'?'你提到的证据很重要。如果同一时间来一万人，你会先保护什么？':'如果它本来提醒人减少执着，为什么越珍贵反而越容易让人执着？';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:story.role.stage,message,history:s.history.slice(-5),observations:s.observations})});const data=await r.json();s.history.push({role:'assistant',content:data.reply||fallback})}catch{s.history.push({role:'assistant',content:fallback})}save();renderRole(story,s);speak(s.history.at(-1).content)}
    function renderDecide(story,s){const body=`<p class="lead">没有唯一正确答案。选择三项措施，并说明它们分别保护谁、可能影响谁。</p><div class="plan-list">${story.plans.map((p,i)=>`<button class="plan ${s.plans.includes(p[0])?'selected':''}" data-plan="${p[0]}"><span>${s.plans.includes(p[0])?'✓':String(i+1).padStart(2,'0')}</span><strong>${p[1]}</strong><em>${p[2]}</em></button>`).join('')}</div><div class="relationship"><strong>你的组合</strong><p class="muted">已选 ${s.plans.length}/3：${s.plans.map(id=>story.plans.find(x=>x[0]===id)?.[1]).filter(Boolean).join('、')||'还没有选择'}</p></div>${nextButton('把方案带去比较 →')}`;shell(story,s,body);document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const id=b.dataset.plan;if(s.plans.includes(id))s.plans=s.plans.filter(x=>x!==id);else if(s.plans.length<3)s.plans.push(id);else return toast('已经选择三项，请先取消一项');event('plan_toggle',{id,selected:s.plans.includes(id)});renderDecide(story,s)})}
    function renderRelationship(story,s){const body=`<p class="lead">把“衣服很贵所以被抢”展开成一条更准确的文化因果链。选择至少四个环节，再用一句话解释其中的关系。</p><div class="chain">${story.chain.map((x,i)=>`<button class="${s.chain.includes(i)?'selected':''}" data-chain="${i}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div><div class="chain-arrow">功能　→　价值　→　欲望　→　行动　→　后果</div><div class="relationship"><strong>关键判断</strong><p class="muted">袈裟不是自动造成争夺；人物怎样理解它、想从它那里得到什么，才把价值变成行动。</p></div>${nextButton('用熟悉的物件检验这个解释 →')}`;shell(story,s,body);document.querySelectorAll('[data-chain]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.chain);s.chain=s.chain.includes(i)?s.chain.filter(x=>x!==i):[...s.chain,i].sort();event('chain_toggle',{index:i});renderRelationship(story,s)})}
    function renderCompare(story,s){let body;if(active==='temple'){body=`<p class="lead">比较的目的不是判断谁更好，而是借一个熟悉案例看清“问题—措施—权衡”。</p><div class="compare-grid"><article class="compare-site"><img src="${story.compare.left[2]}" alt="${story.compare.left[0]}"><h3>${story.compare.left[0]}</h3><p>${story.compare.left[1]}</p></article><article class="compare-site"><img src="${story.compare.right[2]}" alt="${story.compare.right[0]}"><h3>${story.compare.right[0]}</h3><p>${story.compare.right[1]}</p></article></div><div class="choice-list">${story.compare.axes.map(x=>`<button class="choice ${s.comparison.axis===x?'selected':''}" data-axis="${x}">${x}</button>`).join('')}</div>${compareFrames(s)}${nextButton('准备完整讲述 →')}`}else{body=`<p class="lead">选择一个熟悉物件。先比较功能或身份，再指出宗教修行意义不能被价格类比完全解释。</p><div class="object-menu">${story.objects.map(x=>`<button class="object ${s.object===x[0]?'selected':''}" data-object="${x[0]}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div>${compareFrames(s)}${nextButton('准备完整讲述 →')}`};shell(story,s,body);document.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>{s.comparison.axis=b.dataset.axis;save();renderCompare(story,s)});document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{s.object=b.dataset.object;save();renderCompare(story,s)});['same','different','boundary'].forEach(k=>{const el=document.getElementById(k);if(el)el.oninput=e=>{s.comparison[k]=e.target.value;save()}})}
    function compareFrames(s){return `<div class="frames"><div class="frame"><label for="same">相似</label><input class="field" id="same" value="${esc(s.comparison.same)}" placeholder="它们都……"></div><div class="frame"><label for="different">不同</label><input class="field" id="different" value="${esc(s.comparison.different)}" placeholder="可是……"></div><div class="frame"><label for="boundary">边界</label><input class="field" id="boundary" value="${esc(s.comparison.boundary)}" placeholder="这个比较能帮助理解……，但不能说明……"></div></div>`}
    function renderExplain(story,s){const outline=active==='temple'?'原来：真实古寺与悬塑｜后来：游戏与游客变化｜因此：保护、开放、社区与方案｜比较：相似、不同和边界':'本来：袈裟的功能｜后来：锦襕袈裟的特殊价值｜因为：人物的眼光与欲望｜所以：行动与后果｜比较：相似、不同和边界';const body=`<p class="lead">面向一位不了解中国文化的美国大学生，完成60—90秒中文解释。至少使用两条事实、一个因果关系和一句比较边界。</p><div class="relationship"><strong>讲述地图</strong><p class="muted">${outline}</p></div><textarea class="field" id="outline" placeholder="可选：先写几个关键词，不必写完整稿">${esc(s.explain.outline)}</textarea><div class="record"><div class="record-row"><button class="orb ${recording?'recording':''}" id="recordBtn" aria-label="开始或停止录音"></button><div><b id="recordStatus">${recording?'正在录音，再次点击结束':s.explain.seconds?`已完成 ${s.explain.seconds} 秒录音`:'点击圆点开始录音'}</b><div class="timer" id="timer">${fmt(recording?recordSeconds:s.explain.seconds)} / 01:30</div></div></div><div class="meter"><i id="meter" style="width:${Math.min(100,(recording?recordSeconds:s.explain.seconds)/90*100)}%"></i></div><div class="playback" id="playback">${audioUrl?`<audio controls src="${audioUrl}"></audio>`:''}</div></div><textarea class="field" id="transcript" placeholder="语音转写会出现在这里；若浏览器不支持，也可补充关键词">${esc(s.explain.transcript)}</textarea><div class="row" style="margin-top:14px"><button class="secondary" id="feedbackBtn">请AI给一条建议</button></div>${s.explain.feedback?`<div class="feedback"><b>一条可立即使用的建议</b><br>${esc(s.explain.feedback)}<br><br><label for="revision"><b>20—30秒补说</b></label><textarea class="field" id="revision" placeholder="把修改后的补说转写或关键词留在这里">${esc(s.explain.revision)}</textarea><button class="secondary" id="revisionVoice" style="margin-top:10px">● 语音输入补说</button></div>`:''}${nextButton('回看我的文化解释 →')}`;shell(story,s,body);document.getElementById('outline').oninput=e=>{s.explain.outline=e.target.value;save()};document.getElementById('transcript').oninput=e=>{s.explain.transcript=e.target.value;save()};document.getElementById('recordBtn').onclick=()=>toggleRecord(story,s);document.getElementById('feedbackBtn').onclick=()=>getFeedback(story,s);const rev=document.getElementById('revision');if(rev)rev.oninput=e=>{s.explain.revision=e.target.value;save()};document.getElementById('revisionVoice')?.addEventListener('click',()=>dictate(rev,text=>{s.explain.revision=text;save()}))}
    async function toggleRecord(story,s){if(recording)return stopRecord(story,s);try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recording=new MediaRecorder(recordStream);recording.ondataavailable=e=>e.data.size&&recordChunks.push(e.data);recording.onstop=()=>{const blob=new Blob(recordChunks,{type:recording.mimeType||'audio/webm'});if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);recording=null;recordStream.getTracks().forEach(t=>t.stop());recordStream=null;renderExplain(story,s)};recording.start();recordSeconds=0;startRecognition(text=>{s.explain.transcript=(s.explain.transcript+' '+text).trim();save()},true);recordTimer=setInterval(()=>{recordSeconds++;const t=document.getElementById('timer'),m=document.getElementById('meter');if(t)t.textContent=`${fmt(recordSeconds)} / 01:30`;if(m)m.style.width=`${Math.min(100,recordSeconds/90*100)}%`;if(recordSeconds>=90)stopRecord(story,s)},1000);renderExplain(story,s)}catch{return toast('无法使用麦克风，请检查浏览器权限')}}
    function stopRecord(story,s){clearInterval(recordTimer);recognition?.stop?.();recognition=null;s.explain.seconds=recordSeconds;event('explanation_recorded',{seconds:recordSeconds});recording?.stop()}
    async function getFeedback(story,s){const message=(s.explain.transcript||s.explain.outline).trim();if(!message&&s.explain.seconds<8)return toast('请先完成一次讲述或留下讲述关键词');document.getElementById('feedbackBtn').textContent='正在整理建议…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:story.feedback,message,plans:s.plans,observations:s.observations,comparisonAxis:s.comparison.axis})});const data=await r.json();s.explain.feedback=data.reply||''}catch{s.explain.feedback=active==='temple'?'补充一个因果句：游戏带来关注，因此更需要把开放、保护和社区利益一起说明。':'补充一个边界句：物件的价格可以比较，但袈裟的宗教身份与修行意义不能只用价格解释。'}event('feedback_received');renderExplain(story,s)}
    function renderReflect(story,s){const obs=Object.values(s.observations).join('、')||'尚未记录',facts=s.opened.map(i=>story.facts[i]?.title).filter(Boolean).join('、')||'尚未打开';const decision=active==='temple'?s.plans.map(id=>story.plans.find(x=>x[0]===id)?.[1]).filter(Boolean).join('、'):(s.chain.length?story.chain.filter((_,i)=>s.chain.includes(i)).map(x=>x[0]).join(' → '):'尚未形成');const body=`<p class="lead">你已经把第一判断变成了一段可说明、可质疑、也有边界的文化解释。</p><div class="summary-lines"><div class="summary-line"><b>最初判断</b><p>${esc(s.prediction)}</p></div><div class="summary-line"><b>看见的细节</b><p>${esc(obs)}</p></div><div class="summary-line"><b>使用的证据</b><p>${esc(facts)}</p></div><div class="summary-line"><b>${active==='temple'?'方案权衡':'因果关系'}</b><p>${esc(decision)}</p></div><div class="summary-line"><b>比较边界</b><p>${esc(s.comparison.boundary||'还可以继续补充')}</p></div><div class="summary-line"><b>AI建议</b><p>${esc(s.explain.feedback||'尚未请求建议')}</p></div></div><div class="relationship"><strong>${active==='temple'?'古寺的“第二次生命”不是重新建一座寺，而是重新进入公共生活。':'袈裟不会自己制造欲望；人物赋予它的价值改变了行动。'}</strong><p class="muted">文化解释不是给出唯一答案，而是让事实、关系、立场与边界都能被听见。</p></div><div class="row"><button class="primary" id="otherStory">进入${active==='temple'?'袈裟':'古寺'}章节</button><button class="secondary" id="exportBtn">导出本章记录</button><button class="text-btn" id="restartBtn">重新开始本章</button></div><p class="source" style="margin-top:28px">${story.sources}</p>`;shell(story,s,body);s.completed=true;save();document.getElementById('otherStory').onclick=()=>{active=active==='temple'?'kasaya':'temple';render()};document.getElementById('exportBtn').onclick=()=>download(active,s);document.getElementById('restartBtn').onclick=()=>{if(confirm('确认清空本章在本设备上的进度？')){store[active]=blank(active);save();render()}}}
    function advance(){const story=STORIES[active],s=store[active],stage=story.stage[s.step];if(stage==='observe'&&Object.keys(s.observations).length<2)return toast('请至少完成两幅画面的观察');if(stage==='evidence'&&(s.opened.length<3||s.relation.trim().length<6))return toast('请打开至少三张事实卡，并留下关系句');if(stage==='role'&&s.history.filter(x=>x.role==='user').length<2)return toast('请至少完成两轮回应');if(stage==='decide'&&s.plans.length!==3)return toast('请选择三项措施');if(stage==='relationship'&&s.chain.length<4)return toast('请至少连接四个环节');if(stage==='compare'){if(active==='temple'&&!s.comparison.axis)return toast('请先选择一个比较角度');if(active==='kasaya'&&!s.object)return toast('请先选择一个熟悉物件');if(['same','different','boundary'].some(k=>s.comparison[k].trim().length<3))return toast('请完成相似、不同与边界三句话')}if(stage==='explain'&&s.explain.seconds<8&&!s.explain.transcript.trim()&&!s.explain.outline.trim())return toast('请先完成一次讲述');s.step=Math.min(story.steps.length-1,s.step+1);event('step_advance',{step:s.step});render()}
    function fmt(sec){return `${String(Math.floor((sec||0)/60)).padStart(2,'0')}:${String((sec||0)%60).padStart(2,'0')}`}
    function startRecognition(onText,continuous=false){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;recognition=new SR();recognition.lang='zh-CN';recognition.continuous=continuous;recognition.interimResults=false;recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;onText(t)};recognition.onerror=()=>{};recognition.start();return recognition}
    function dictate(field,onDone){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('当前浏览器不支持语音转写，请使用文字输入');field.placeholder='正在听，请开始说……';startRecognition(text=>{field.value=(field.value+' '+text).trim();field.dispatchEvent(new Event('input'));onDone?.(field.value);field.placeholder='可以继续修改'});toast('正在听，请开始说')}
    function download(id,s){const blob=new Blob([JSON.stringify({version:1,quest:STORIES[id].name,exportedAt:new Date().toISOString(),data:s},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${id}-culture-quest-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}
    const HINTS={enter:[['先判断','选择最接近你现在想法的一项；以后可以改变。'],['不求正确','这里记录的是理解怎样发展。']],observe:[['只说看见的','先描述空间、颜色、人物、动作和变化。'],['不要急着解释','观察会成为下一步的问题。']],evidence:[['关系句','原来……；后来……；因此……'],['区分来源','游戏画面提供线索，事实卡提供文化边界。']],role:[['回应再追问','先回应角色，再问“为什么”或“如果……怎么办”。'],['表达不同意','我不完全同意，因为……']],decide:[['三方利益','文物、游客、当地社区。'],['说明代价','每项措施都可能帮助一些人，也影响另一些人。']],relationship:[['不要跳步','物件 → 被赋予价值 → 人产生欲望 → 人采取行动。'],['因果边界','不是“袈裟让人纵火”，而是人物的占有欲推动行动。']],compare:[['三句话','它们都……；可是……；这个比较能帮助……，但不能说明……'],['比较机制','比较功能、身份、稀缺或进入管理，不比较谁更先进。']],explain:[['先讲关系','事实不是清单，要用因为、所以、但是连接。'],['补说','只改最关键的一点，不必重讲全文。']],reflect:[['回看变化','比较最初判断与最后解释。'],['保留边界','好的文化解释允许复杂性存在。']]};
    function openHint(){const stage=active?STORIES[active].stage[store[active].step]:'enter',h=HINTS[stage]||HINTS.enter;drawerBody.innerHTML=h.map(x=>`<div class="hint-row"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')}
    document.getElementById('homeBtn').onclick=()=>{if(recording)return toast('请先结束录音');showHub()};document.getElementById('hintBtn').onclick=openHint;document.getElementById('drawerClose').onclick=()=>{drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')};document.getElementById('logoutBtn').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/culture-login.html'};addEventListener('scroll',()=>topbar.classList.toggle('solid',scrollY>24),{passive:true});render();
  </script>
