<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111512"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>登录 · 寻迹</title>
  <style>*{box-sizing:border-box}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101511 url('/assets/earth-shrine-hero.png') center/cover;color:#f3eddf;font-family:Inter,"Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(6,10,8,.94),rgba(6,10,8,.5),rgba(6,10,8,.2));z-index:0}.box{position:relative;z-index:1;width:min(430px,100%);padding:34px;background:rgba(10,15,12,.83);border:1px solid rgba(243,237,223,.22);backdrop-filter:blur(20px)}.seal{width:34px;height:34px;display:grid;place-items:center;border:1px solid #d0b06d;color:#d0b06d;font-family:serif}h1{margin:24px 0 8px;font:500 42px/1.05 "Noto Serif SC","Songti SC",serif;letter-spacing:-.04em}p{color:rgba(243,237,223,.65);font-size:13px;line-height:1.7}.field{width:100%;height:51px;margin-top:10px;padding:0 14px;border:1px solid rgba(243,237,223,.22);background:rgba(4,8,6,.54);color:#f3eddf;font:inherit}.field:focus{outline:2px solid #d0b06d;outline-offset:2px}.submit{width:100%;height:52px;margin-top:15px;border:0;background:#b64a32;color:white;font-weight:700;letter-spacing:.08em;cursor:pointer}.submit:disabled{opacity:.55}.error{min-height:19px;margin:12px 0 0;color:#f0a08a;font-size:12px}.note{margin-top:22px;padding-top:16px;border-top:1px solid rgba(243,237,223,.14);font-size:10px}</style>
</head>
<body><main class="box"><span class="seal">迹</span><h1>进入寻迹</h1><p>使用研究者发放的匿名课程账号。学生进入文化任务，教师进入研究工作台。</p><form id="form"><label><span class="sr">账号</span><input class="field" id="username" autocomplete="username" placeholder="账号" required></label><label><span class="sr">密码</span><input class="field" id="password" type="password" autocomplete="current-password" placeholder="密码" required></label><button class="submit" id="submit">进入</button><p class="error" id="error"></p></form><p class="note">账号不包含学生姓名。请勿在共享设备上保存密码。</p></main><script>const form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='正在验证…';error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');const requested=new URLSearchParams(location.search).get('next');location.href=data.role==='teacher'?(requested==='/3.html'?requested:'/teacher.html'):'/3.html'}catch(e){error.textContent=e.message;submit.disabled=false;submit.textContent='进入'}}</script></body>
</html>
