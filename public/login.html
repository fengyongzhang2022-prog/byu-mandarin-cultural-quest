<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111512"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>登录 · 寻迹</title>
  <style>*{box-sizing:border-box}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#16120e url('/assets/kasaya-hero-v1.png') center/cover;color:#f4ead8;font-family:Inter,"Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(14,10,7,.96),rgba(14,10,7,.62),rgba(14,10,7,.2));z-index:0}.box{position:relative;z-index:1;width:min(430px,100%);padding:34px;background:rgba(22,16,11,.86);border:1px solid rgba(216,174,86,.34);box-shadow:0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(18px)}.seal{width:36px;height:36px;display:grid;place-items:center;border:1px solid #d8ae56;color:#d8ae56;font-family:serif}h1{margin:24px 0 8px;font:500 42px/1.05 "Noto Serif SC","Songti SC",serif;letter-spacing:-.04em}p{color:rgba(244,234,216,.7);font-size:13px;line-height:1.7}.field{width:100%;height:51px;margin-top:10px;padding:0 14px;border:1px solid rgba(244,234,216,.22);background:rgba(8,6,4,.55);color:#f4ead8;font:inherit}.field:focus{outline:2px solid #d8ae56;outline-offset:2px}.submit{width:100%;height:52px;margin-top:15px;border:0;background:#b9472e;color:white;font-weight:700;letter-spacing:.08em;cursor:pointer}.submit:disabled{opacity:.55}.error{min-height:19px;margin:12px 0 0;color:#f0a08a;font-size:12px}.note{margin-top:22px;padding-top:16px;border-top:1px solid rgba(244,234,216,.14);font-size:10px}</style>
</head>
<body><main class="box"><span class="seal">衣</span><h1>袈裟文化任务</h1><p>进入《黑神话：悟空》的古观音禅院，用中文与金池长老、黑熊精完成一场语音文化探究。</p><form id="form"><label><span class="sr">账号</span><input class="field" id="username" autocomplete="username" placeholder="账号" required></label><label><span class="sr">密码</span><input class="field" id="password" type="password" autocomplete="current-password" placeholder="密码" required></label><button class="submit" id="submit">进入</button><p class="error" id="error"></p></form><p class="note">使用教师发放的匿名课程账号。共享设备上请勿保存密码。</p></main><script>const form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='正在验证…';error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');const requested=new URLSearchParams(location.search).get('next');location.href=data.role==='teacher'?(requested==='/heishenhuawukong.html'?requested:'/teacher.html'):'/heishenhuawukong.html'}catch(e){error.textContent=e.message;submit.disabled=false;submit.textContent='进入'}}</script></body>
</html>
