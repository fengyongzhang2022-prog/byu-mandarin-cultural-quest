<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101510"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>登录 | 5000美元，5万棵树</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#101510 url('/assets/green-story-hero.webp') center/cover;color:#f3f0e7;font-family:ui-sans-serif,"Segoe UI","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(9,14,9,.96),rgba(9,14,9,.72),rgba(9,14,9,.3));z-index:0}.box{position:relative;z-index:1;width:min(470px,100%);padding:38px;background:rgba(18,25,18,.88);border:1px solid rgba(168,214,109,.35);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(18px)}.mark{width:42px;height:42px;border:1px solid #a8d66d;color:#a8d66d;border-radius:50%;display:grid;place-items:center;font-weight:800}h1{font-size:42px;line-height:1.02;letter-spacing:-.05em;margin:24px 0 12px}p{color:#b9c2b4;font-size:13px;line-height:1.7}.field{width:100%;height:52px;margin-top:10px;padding:0 15px;border:1px solid #3b493a;border-radius:14px;background:#101510;color:#f3f0e7;outline:none}.field:focus{border-color:#a8d66d;box-shadow:0 0 0 3px rgba(168,214,109,.12)}button{width:100%;height:52px;margin-top:15px;border:0;border-radius:999px;background:#a8d66d;color:#15200f;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.error{min-height:20px;color:#ef9a82}.note{margin-top:22px;padding-top:16px;border-top:1px solid #344034;font-size:11px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
</head>
<body><main class="box"><span class="mark">林</span><h1>5000美元<br>5万棵树</h1><p>进入1999-2026年的故事时间线，向AI角色提问、寻找证据、纠正片面叙事，再面向美国受众讲述一个准确而有温度的中国故事。</p><form id="form"><label><span class="sr">账号</span><input class="field" id="username" autocomplete="username" placeholder="课程账号" required></label><label><span class="sr">密码</span><input class="field" id="password" type="password" autocomplete="current-password" placeholder="密码" required></label><button id="submit">进入故事</button><p class="error" id="error"></p></form><p class="note">使用教师发放的匿名课程账号。学习记录默认保存在本设备。</p></main><script>const form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='正在验证';error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');const requested=new URLSearchParams(location.search).get('next');location.href=data.role==='teacher'?(requested||'/teacher.html'):(requested==='/forest.html'?requested:'/forest.html')}catch(e){error.textContent=e.message;submit.disabled=false;submit.textContent='进入故事'}}</script></body>
</html>
