<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101510"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>研究者登录 | 教师反馈</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#101510 url('/assets/green-story-hero.webp') center/cover;color:#f3f0e7;font-family:ui-sans-serif,"Segoe UI","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(9,14,9,.96),rgba(9,14,9,.72),rgba(9,14,9,.3));z-index:0}.box{position:relative;z-index:1;width:min(470px,100%);padding:38px;background:rgba(18,25,18,.88);border:1px solid rgba(168,214,109,.35);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(18px)}.mark{width:42px;height:42px;border:1px solid #a8d66d;color:#a8d66d;border-radius:50%;display:grid;place-items:center;font-weight:800}h1{font-size:42px;line-height:1.02;letter-spacing:-.05em;margin:24px 0 12px}p{color:#b9c2b4;font-size:13px;line-height:1.7}.field{width:100%;height:52px;margin-top:10px;padding:0 15px;border:1px solid #3b493a;border-radius:14px;background:#101510;color:#f3f0e7;outline:none}.field:focus{border-color:#a8d66d;box-shadow:0 0 0 3px rgba(168,214,109,.12)}button{width:100%;height:52px;margin-top:15px;border:0;border-radius:999px;background:#a8d66d;color:#15200f;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.error{min-height:20px;color:#ef9a82}.note{margin-top:22px;padding-top:16px;border-top:1px solid #344034;font-size:11px}.learner-link{display:block;margin-top:12px;color:#cfe9a9;font-size:12px;text-decoration:none}.learner-link:hover{text-decoration:underline}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
</head>
<body><main class="box"><span class="mark">研</span><h1>教师反馈<br>研究者入口</h1><p>此页面仅供项目研究者查看已提交的匿名教师反馈，不属于学习者教学体验。</p><form id="form"><label><span class="sr">研究者账号</span><input class="field" id="username" autocomplete="username" placeholder="研究者账号（green-researcher）" required></label><label><span class="sr">密码</span><input class="field" id="password" type="password" autocomplete="current-password" placeholder="研究者密码" required></label><button id="submit">进入反馈汇总</button><p class="error" id="error"></p></form><p class="note">反馈内容不会公开；只有研究者账号可以读取。<a class="learner-link" href="/forest.html">学习者无需账号，直接进入主入口 →</a></p></main><script>const form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='正在验证';error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');if(data.role!=='teacher'){await fetch('/api/auth/logout',{method:'POST'});throw new Error('这是学习者账号，请使用研究者账号登录。')}location.href='/teacher-feedback.html'}catch(e){error.textContent=e.message;submit.disabled=false;submit.textContent='进入反馈汇总'}}</script></body>
</html>
