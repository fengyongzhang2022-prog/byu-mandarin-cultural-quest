  const CHAPTERS={
    one:{index:1,kicker:'第一幕 · 1985—1986',title:'她面对的不是空地，是会移动的沙',image:'A',prediction:'600棵树苗只活了不到10棵。你猜她接下来会怎样？',predictions:['停止种树，离开沙地','换方法，继续试','等待别人来解决'],audio:'1985年，19岁的殷玉珍来到毛乌素沙地。婚房是半截埋在沙里的地窖，风沙一夜就能堵住门。第二年，她卖掉一只羊，换回600棵树苗。可是，一场大风以后，活下来的不到10棵。她没有停。她和丈夫用铁锹、扁担和钢钎，把树苗一捆一捆背进沙地，又慢慢学会先固定流沙，再种灌木和乔木。',question:'第一批树苗失败以后，殷玉珍怎样回应？',answers:['她停止了个人行动','她调整方法并继续种树','5000美元马上解决了问题'],correct:'她调整方法并继续种树',reveal:'故事的起点不是捐款，而是一个普通家庭在极困难条件下持续试错。'},

  function renderEnter(){panel.innerHTML=`<div class="hero"><div class="hero-copy"><p class="eyebrow">共同种下 · 一部可以听、可以选择、可以重讲的中国故事</p><h1 class="hero-title"><span>一片森林</span><span>记住了善意</span></h1><p class="lead">5000美元没有独自创造5万棵树。它进入了一个从1985年开始、持续四十多年的中国治沙故事。</p><div class="statline"><span><b>1985</b><small>故事起点</small></span><span><b>1999</b><small>跨国善意</small></span><span><b>2026</b><small>时隔26年重逢</small></span></div><div class="row"><button class="primary" id="enterBtn">走进森林，开始听故事</button><span class="audio-only">三幕听力 · 理解检测 · GAI背景探究</span></div><p class="small" style="margin-top:14px">面向美国中高级中文学习者。全程不设文字作答框；摄像头只在最终讲述时自愿开启。</p></div></div>`;document.getElementById('enterBtn').onclick=()=>{state.participant=state.participant||`Learner-${Date.now().toString(36).slice(-5)}`;event('quest_enter');advance()}}

  function renderScene(){panel.innerHTML=`<p class="eyebrow">1999 · 信息还不完整</p><h2>你会帮助一个从未见过的人吗？</h2><div class="scene"><div class="scene-media"><img src="/assets/green-story-1999.webp" alt="教学生成场景：1999年的电视画面显示沙地植树"></div><div class="scene-copy"><p>你从电视里看到一位住在中国北方沙地的人。树苗常被风沙毁掉。你不知道故事后来怎样。</p><div class="choices">${['我会立刻帮助','我想先了解更多','我可能不会帮助'].map(x=>`<button class="choice ${state.scene.choice===x?'selected':''}" data-choice="${x}">${x}</button>`).join('')}</div><b>决定以前，用录音提出一个完整问题。</b>${voiceBox('scene','口头提问','至少4秒；必须包含“为什么、怎么、多久、什么”等疑问词。')}<button class="primary" id="sceneNext">提交选择和录音问题</button></div></div><p class="source" style="margin-top:12px">画面为教学生成场景，不是真实新闻照片。</p>`;panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.scene.choice=b.dataset.choice;persist();renderScene()});bindVoice('scene');document.getElementById('sceneNext').onclick=()=>{const c=assessVoice('scene');if(!state.scene.choice)return toast('请先选择你的决定');if(!c.pass)return toast(c.msg);event('1999_decision',{choice:state.scene.choice,question:voiceSlot('scene').text});advance()}}
  function renderTime(){const revealed=!!state.prediction,heard=state.listening.played>0;panel.innerHTML=`<p class="eyebrow">时间跳转 · 听力与预测</p><h2>钱会花完。故事会结束吗？</h2><div class="listen-gate"><h3>听力任务：捐款发生时，她已经治沙多久？</h3><div class="row"><button class="quiet" id="listenStory">▶ ${heard?'再听一次':'播放材料'}</button><button class="quiet" id="listenSlow">▶ 慢速播放</button></div><div class="choices">${[['不到一年','不到一年'],['大约14年','大约十四年'],['26年','二十六年']].map(([value,label])=>`<button class="choice ${state.listening.answer===value?'selected':''}" data-listen-answer="${value}" ${heard?'':'disabled'}>${label}</button>`).join('')}</div><div class="listen-status" id="listenStatus">${state.listening.correct?'✓ 听力答案正确。':heard&&state.listening.answer?'答案还不对，请再听一次。':'必须先完整播放材料，答案按钮才会开启。'}</div></div><div class="numbers"><div class="number"><b>$5,000</b><small>1999年的支持</small></div><div class="operator">+</div><div class="number"><b>26年</b><small>时间继续</small></div><div class="operator">=</div><div class="number reveal ${revealed?'':'hidden'}"><b>50,000+</b><small>树与一次重逢</small></div></div><div class="promptbox"><strong>在揭晓以前，选择你的预测。</strong><div class="choices">${['钱花完以后，影响很快消失','有些树活下来，但两人不会再联系','树木继续生长，这份关系也可能被重新找到'].map(x=>`<button class="choice ${state.prediction===x?'selected':''}" data-predict="${x}">${x}</button>`).join('')}</div>${revealed?'<img class="time-reveal-image" src="/assets/green-story-2026-v2.webp" alt="教学生成场景：二十六年后的重逢"><div class="callout"><p><b>揭晓：</b>当年用捐款购买、栽种的一批树苗后来长成5万多棵树。2026年，两人重新联系并再次种下一棵树。</p></div>':''}<button class="primary" id="timeNext" ${revealed&&state.listening.correct?'':'disabled'}>去调查钱、人和时间</button></div>`;const play=rate=>{document.getElementById('listenStory').disabled=true;document.getElementById('listenSlow').disabled=true;document.getElementById('listenStatus').textContent='正在播放；完整听完后答案才会开启。';speak(LISTENING_PASSAGE,rate,()=>{state.listening.played++;persist();renderTime()})};document.getElementById('listenStory').onclick=()=>play(.9);document.getElement   function findFactFromQuestion(q){const lower=String(q||'').toLowerCase();return Object.keys(FACTS).filter(k=>!state.opened.includes(k)).map(k=>({id:k,score:FACTS[k].keys.split(' ').filter(x=>lower.includes(x.toLowerCase())).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0]?.id||null}

  function renderEvidence(){const active=state.activeFact||state.opened.at(-1),heardCount=state.opened.filter(id=>state.heardFacts.includes(id)).length;panel.innerHTML=`<p class="eyebrow">调查 · 先问，再听，再读</p><h2>用口头问题打开事实</h2><p class="lead">不能输入文字。至少录制三个不同问题，打开三张事实卡；每张卡必须先听完整材料，文字才会出现。</p>${voiceBox('fact','新的调查问题','至少4秒；问题必须指向时间、捐款、见面、长期治沙或重逢。')}<button class="primary" id="askFact">用这段录音提出问题</button><div class="evidence-layout" style="margin-top:24px"><div class="evidence-list">${Object.keys(FACTS).map(id=>`<button class="evidence ${state.opened.includes(id)?'':'locked'} ${active===id?'active':''}" data-fact="${id}" ${state.opened.includes(id)?'':'disabled'}><small>${id}</small><span>${state.opened.includes(id)?FACTS[id].year:'未开放'}</span></button>`).join('')}</div><div class="evidence-view">${active?factView(active):'<p class="empty">录制第一个问题，打开一张与问题相关的事实卡。</p>'}</div></div><div class="row" style="margin-top:18px"><button class="primary" id="evidenceNext" ${state.opened.length>=3&&heardCount>=3?'':'disabled'}>带着证据进入角色对话</button><span class="small">已口头提问 ${state.factQuestions.length} 次 · 已听 ${heardCount}/3 张</span></div>`;bindVoice('fact');document.getElementById('askFact').onclick=()=>{const c=assessVoice('fact');if(!c.pass)return toast(c.msg);if(!unlockFromVoice())return toast('请把问题说得更具体，并指向一张尚未开放的事实卡');renderEvidence()};panel.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>{state.activeFact=b.dataset.fact;persist();renderEvidence()});const listen=document.getElementById('listenFact');if(listen)listen.onclick=()=>{const id=listen.dataset.id;listen.disabled=true;const status=document.getElementById('factListenStatus');if(status)status.textContent='正在播放；完整听完后才显示文字。';speak(`${FACTS[id].year}。${FACTS[id].title}。${FACTS[id].text}`,.84,()=>{if(!state.heardFacts.includes(id))state.heardFacts.push(id);event('fact_listen',{id});persist();renderEvidence()})};document.getElementById('evidenceNext').onclick=advance}

  function renderInteract(){const opening='如果一篇报道把这片森林写成我的功劳，你同意吗？五千美元做了什么，又没有做什么？';const turns=state.history.filter(x=>x.role==='user').length;panel.innerHTML=`<p class="eyebrow">受限角色 · 听说对话</p><h2>帮助等于功劳吗？</h2><p class="lead">先听角色问题，再用录音回答。每轮至少8秒，必须使用事实并表达“帮助”与“功劳”的边界。</p><div class="role-scene"><img src="/assets/green-story-2000-v2.webp" alt="教学生成场景：2000年两人在毛乌素共同种树"></div><div class="dialogue" id="dialogue"><div class="bubble"><b>教学模拟角色</b>${opening}</div>${state.history.map(m=>`<div class="bubble ${m.role==='user'?'me':''}"><b>${m.role==='user'?'你的录音':'教学模拟角色'}</b>${esc(m.content)}</div>`).join('')}</div><button class="quiet" id="listenOpening">▶ 听角色问题</button>${voiceBox('talk',`第 ${turns+1} 轮口头回答`,'至少8秒；包含一条事实和“但是/不是/没有”等边界表达。')}<div class="row"><button class="primary" id="talkSend">发送这段录音</button><button class="primary" id="interactNext" ${turns>=2?'':'disabled'}>去纠正一个片面标题</button><span class="small">已完成 ${turns}/2 轮</span></div>`;bindVoice('talk');document.getElementById('talkSend').onclick=sendTalk;document.getElementById('listenOpening').onclick=()=>speak(opening,.88);document.getElementById('interactNext').onclick=advance;requestAnimationFrame(()=>{const d=document.getElementById('dialogue');d.scrollTop=d.scrollHeight})}
  async function sendTalk(){const c=assessVoice('talk'),rec=voiceSlot('talk');if(!c.pass)return toast(c.msg);const message=rec.text||'这段中文回答已录音保存，但浏览器没有生成转写。请根据本轮任务给出一条继续追问。';state.history.push({role:'user',content:rec.text||'（录音已保存，未生成转写）',seconds:rec.seconds,mediaKey:rec.mediaKey});state.voice.talk=blankVoice();persist();renderInteract();const reply=await askAI('green_sako',message,state.history);state.history.push({role:'assistant',content:reply});event('role_reply');renderInteract();speak(reply,.88)}
  function renderReframe(){const opts=[['A','遗漏了故事在1985年已经开始'],['D','遗漏了长期行动、技术和治理'],['E','遗漏了26年后的寻找与重逢'],['B','遗漏了善意来自看见他人的行动']];panel.innerHTML=`<p class="eyebrow">AI国际编辑 · 合理但片面</p><h2>事实没有错，故事就准确吗？</h2><div class="headline-card"><small>面向美国校园媒体的第一稿</small><div class="bad">American Teacher's $5,000 Turned a Chinese Desert Green</div><p>美国教师的5000美元让中国沙漠变绿</p></div><p class="lead">选择至少两项关键遗漏，然后用12—45秒录音解释这个标题会造成什么误解。</p><div class="omissions">${opts.map(([id,t])=>`<button class="omission ${state.omissions.includes(id)?'selected':''}" data-omit="${id}">${t}</button>`).join('')}</div>${voiceBox('correction','口头纠正片面标题','至少12秒；说明一个误解，并加入时间或数字证据。')}<div class="row"><button class="primary" id="reviseBtn">把录音交给AI编辑</button></div>${state.editorDraft?`<div class="draft"><b>第二稿</b>\n${esc(state.editorDraft)}</div><button class="primary" id="reframeNext" style="margin-top:16px">选择镜头，重新讲述</button>`:''}`;panel.querySelectorAll('[data-omit]').forEach(b=>b.onclick=()=>{const id=b.dataset.omit;state.omissions=state.omissions.includes(id)?state.omissions.filter(x=>x!==id):[...state.omissions,id];persist();renderReframe()});bindVoice('correction');document.getElementById('reviseBtn').onclick=async()=>{const c=assessVoice('correction');if(state.omissions.length<2)return toast('请先选择至少两项遗漏');if(!c.pass)return toast(c.msg);const correction=voiceSlot('correction').text;state.editorDraft=await askAI('green_editor',`遗漏：${state.omissions.join('、')}。学习者口头纠正：${correction}`,[]);event('editor_revised',{omissions:state.omissions});renderReframe()};if(document.getElementById('reframeNext'))document.getElementById('reframeNext').onclick=advance}
  function audiencePrompt(){if(!state.shots.length)return'选择三个镜头以后，系统会模拟美国受众可能形成的理解。';const miss=[];if(!state.shots.includes('A'))miss.push('观众可能把1999年当成故事起点');if(!state.shots.includes('D'))miss.push('观众可能把捐款误解为森林形成的唯一原因');if(!state.shots.some(x=>['E','F'].includes(x)))miss.push('观众可能不知道这段关系为什么在今天仍重要');return miss.length?miss.join('；'):'三个镜头已经覆盖起点、长期行动与今天。现在用语言把因果边界讲清楚。'}
  function renderListeningChapter(key){

  function storyBackground(){const [year,id,title,text]=BACKGROUND_TIMELINE[state.backgroundIndex];return`<section class="background-brief"><div class="background-head"><div><span class="background-kicker">STORY DOSSIER</span><h3>故事背景补给站</h3></div><p>点击年代，一段一段补齐人物、时间与因果；重新讲述前，再完整听一遍背景。</p></div><nav class="background-years" aria-label="故事年份">${BACKGROUND_TIMELINE.map(([y],i)=>`<button class="${i===state.backgroundIndex?'active':''}" data-bg-index="${i}">${y}</button>`).join('')}</nav><article class="background-focus"><img class="background-image" src="${STORY_IMAGES[id]}" alt="教学生成场景：${title}"><div class="background-copy"><div class="background-year">${year}</div><b>${title}</b><p>${text}</p><small class="scene-label">教学生成场景 · 非真实历史照片</small>${state.backgroundIndex<BACKGROUND_TIMELINE.length-1?'<button class="quiet background-next" id="backgroundNext">下一段 →</button>':'<span class="audio-only background-next">时间线已读到2026</span>'}</div></article><div class="background-boundary"><b>讲述边界</b><p>“5万多棵树”指当年用捐款购买、栽种的一批树苗后来形成的规模；不能把整个毛乌素的绿色变化写成一笔捐款或一个人的功劳。</p></div><div class="background-action"><button class="quiet" id="listenBackground">▶ ${state.backgroundHeard?'再听完整背景':'听完整背景，开放编辑'}</button><span class="small" id="backgroundStatus">${state.backgroundHeard?'✓ 已听完，可以选择受众与镜头。':'完整听完后，下面的编辑工具才会开放。'}</span></div></section>`}

  function renderReflect(){const text=voiceSlot('final').text,pre=voiceSlot('pre').text,revision=voiceSlot('revision').text,signals={时间:/1985|1999|2000|2026|以前|后来|以后/.test(text),证据:/5000|五千|5万|五万|14年|十四年|26年/.test(text),因果:/因为|所以|但是|不只是|没有|如果|不是/.test(text),受众:!!state.audience};panel.innerHTML=`<p class="eyebrow">Reflect · 从简单因果到证据叙事</p><h2>你现在怎样讲这个故事？</h2><img class="final-image" src="/assets/green-story-planting.webp" alt="教学生成场景：两双手共同为一棵新树培土"><div class="reflection"><article><small>任务前录音转写</small><h3>第一版判断</h3><p>${esc(pre)}</p></article><article><small>${voiceSlot('final').seconds}秒完整讲述</small><h3>面向美国受众的版本</h3><p>${esc(text)}</p></article></div><div class="change-tags">${Object.entries(signals).map(([k,v])=>`<span class="tag ${v?'on':''}">${k}${v?'已出现':'可继续补充'}</span>`).join('')}</div><div class="feedback"><b>AI的一条建议</b><br>${esc(state.final.feedback)}<br><br><b>你的语音补说</b><br>${esc(revision)}</div><div class="callout" style="margin-top:24px"><h3>真实故事仍在继续</h3><p>2026年8月，两人重返毛乌素并再次种下一棵树。讲好这个故事，不是把一份善意缩小，也不是把长期治沙隐藏，而是把帮助、坚持、技术、治理与时间之间的关系讲准确。</p></div><div class="row"><button class="primary" id="downloadBtn">导出学习记录</button><button class="quiet" id="restartBtn">开始新任务</button></div><p class="source" style="margin-top:22px">事实来源：<a href="https://www.forestry.gov.cn/c/www/hmgzdt/672108.jhtml" target="_blank" rel="noopener">新华社 / 国家林业和草原局，2026-05-22</a>；<a href="https://www.forestry.gov.cn/c/www/lcdt/685503.jhtml" target="_blank" rel="noopener">人民日报 / 国家林业和草原局，2026-08-24</a>；<a href="https://www.unccd.int/land-and-life/desertification/overview" target="_blank" rel="noopener">UNCCD Desertification Overview</a>。画面为教学生成场景，不是真实人物照片。</p>`;document.getElementById('downloadBtn').onclick=download;document.getElementById('restartBtn').onclick=()=>{if(confirm('确认开始新任务？当前页面状态会被清空。')){state=fresh();persist();render()}}}
  function renderReflect(){
    const text=voiceSlot('final').text,revision=voiceSlot('revision').text,signals={时间:/1985|1986|1999|2000|2026|以前|后来|以后/.test(text),证据:/5000|五千|5万|五万|14年|十四年|26年/.test(text),因果:/因为|所以|但是|不只是|没有|如果|不是/.test(text),背景:/三北|道路|技术|治理|水资源|长期/.test(text),受众:!!state.audience};
    panel.innerHTML=`<p class="eyebrow">Reflect · 从一张森林照片到证据叙事</p><h2>你现在看见的，不只是5万棵树</h2><img class="final-image" src="${STORY_IMAGES.G}" alt="毛乌素恢复后的林海教学生成场景"><div class="reflection"><article><small>听故事以前</small><h3>你的第一幅故事图像</h3><p>${esc(state.prePrediction||'未记录')}</p></article><article><small>${voiceSlot('final').seconds}秒完整讲述</small><h3>面向美国受众的版本</h3><p>${esc(text||'录音已保存，但浏览器没有生成文字转写。')}</p></article></div><div class="change-tags">${Object.entries(signals).map(([k,v])=>`<span class="tag ${v?'on':''}">${k}${v?'已出现':'可继续补充'}</span>`).join('')}</div><div class="feedback"><b>AI的一条建议</b><br>${esc(state.final.feedback)}<br><br><b>你的语音补说</b><br>${esc(revision||'录音已保存，但没有生成文字转写。')}</div><div class="callout" style="margin-top:24px"><h3>GAI没有替你决定故事意义</h3><p>它把1980年代的生活条件、1978年以来的生态工程、道路与技术支持等不同尺度带到你面前；最后由你决定怎样把个人坚持、跨国善意和中国长期治理讲成一个准确而动人的故事。</p></div><div class="row"><button class="primary" id="downloadBtn">导出学习记录</button><button class="quiet" id="restartBtn">开始新任务</button></div><p class="source" style="margin-top:22px">事实来源：<a href="https://www.forestry.gov.cn/c/www/lcdt/671925.jhtml" target="_blank" rel="noopener">国家林草局：5万棵树的“恩人”找到了</a>；<a href="https://www.forestry.gov.cn/lyj/1/jdyw/20260527/672966.html" target="_blank" rel="noopener">国家林草局：跨越26年的绿色约定</a>；<a href="https://www.forestry.gov.cn/c/sbj/gcgh/355834.jhtml" target="_blank" rel="noopener">三北工程总体规划</a>。所有教学场景图均为生成图像，不是真实人物或历史照片。</p>`;
    document.getElementById('downloadBtn').onclick=download;document.getElementById('restartBtn').onclick=()=>{if(confirm('确认开始新任务？当前页面状态会被清空。')){state=fresh();persist();render()}};
  }
  function showHints(){const key=['enter','pre','scene','time','evidence','interact','reframe','tell','reflect'][state.index],items=HINTS[key]||['先说出你已经知道的事实，再提出一个问题。'],level=Math.min((state.hintLevel?.[key]||1),items.length);const old=document.querySelector('.hint-modal');if(old)old.remove();const wrap=document.createElement('div');wrap.className='hint-modal';wrap.style='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px';wrap.innerHTML=`<div style="width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px"><h3>给我一点提示</h3>${items.slice(0,level).map((x,i)=>`<div class="hint-level"><small>第 ${i+1} 层</small><p>${x}</p></div>`).join('')}<div class="row" style="margin-top:16px">${level<items.length?'<button class="quiet" id="moreHint">再给一点</button>':''}<button class="primary" id="closeHint">继续任务</button></div></div>`;document.body.appendChild(wrap);document.getElementById('closeHint').onclick=()=>wrap.remove();if(document.getElementById('moreHint'))document.getElementById('moreHint').onclick=()=>{state.hintLevel=state.hintLevel||{};state.hintLevel[key]=level+1;event('hint_open',{stage:key,level:level+1});wrap.remove();showHints()}}
  async function askAI(stage,message,history){try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6000),r=await fetch('/api/chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,message,history,evidence:state.opened,omissions:state.omissions,audience:state.audience,shots:state.shots})});clearTimeout(timeout);if(!r.ok)throw 0;return(await r.json()).reply}catch{if(stage==='green_editor')return'第二稿：一份跨国善意怎样进入中国治沙人的长期行动。1999年的5000美元帮助购买树苗，但故事早在1985年已经开始，森林也来自此后二十多年的坚持、技术和治理。';if(stage==='green_feedback')return'补充一个边界句：这笔钱帮助了树苗进入沙地，但不能替代长期治沙和治理实践。';return'这笔钱有真实作用，但为什么不能把整片森林都写成它的功劳？请用一个更早的时间证据说明。'}}
  let narrationContext=null,activeNarration=null,cameraPreviewStream=null,recordingHasVideo=false;
  async function speak(text,rate=.92,onend){
    speechSynthesis.cancel();if(activeNarration){try{activeNarration.stop()}catch{}activeNarration=null}
    try{
      const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)throw new Error('audio-context');
      narrationContext=narrationContext||new AudioEngine();if(narrationContext.state==='suspended')await narrationContext.resume();
      const response=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'alex',text,speed:rate<.8?-1:0})});
      const voice=response.headers.get('X-Role-Voice')||'unknown';if(!response.ok||!voice.startsWith('tencent-'))throw new Error('tencent-unavailable');
      const decoded=await narrationContext.decodeAudioData(await response.arrayBuffer()),source=narrationContext.createBufferSource();source.buffer=decoded;source.connect(narrationContext.destination);activeNarration=source;
      source.onended=()=>{activeNarration=null;if(onend)onend()};event('tts_play',{voice,slow:rate<.8});source.start();
    }catch{toast('腾讯云自然语音暂时不可用，请稍后重试。')}
  }
  const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  function stopCameraPreview(){if(cameraPreviewStream)cameraPreviewStream.getTracks().forEach(track=>track.stop());cameraPreviewStream=null}
  function attachCameraPreview(){const video=document.getElementById('cameraPreview');if(video&&cameraPreviewStream){video.srcObject=cameraPreviewStream;video.play().catch(()=>{})}}
  async function setCameraMode(enabled){
    if(!enabled){stopCameraPreview();state.cameraEnabled=false;event('camera_choice',{enabled:false});renderTellWithBackground();return}
    if(!navigator.mediaDevices?.getUserMedia)return toast('当前浏览器不能打开摄像头，请选择“仅录声音”。');
    try{
      stopCameraPreview();
      cameraPreviewStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
      state.cameraEnabled=true;event('camera_choice',{enabled:true});renderTellWithBackground();
    }catch{state.cameraEnabled=false;persist();toast('摄像头没有开启。你仍可选择“仅录声音”完成任务。');renderTellWithBackground()}
  }
  async function toggleRecording(kind){
    if(recorder?.state==='recording'){recorder.stop();return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')return toast('请使用最新版 Chrome 或 Edge，并允许麦克风权限。');
    let audioStream=null;
    try{
      speechSynthesis.cancel();
      audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      let stream=audioStream;recordingHasVideo=false;
      if(kind==='final'&&state.cameraEnabled){
        if(!cameraPreviewStream?.getVideoTracks().some(track=>track.readyState==='live'))cameraPreviewStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
        stream=new MediaStream([...cameraPreviewStream.getVideoTracks(),...audioStream.getAudioTracks()]);recordingHasVideo=true;
      }
      chunks=[];transcript='';seconds=0;recordKind=kind;recorder=new MediaRecorder(stream);
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>finishRecording(stream);recorder.start(250);if(SR)startRecognition(SR);
      const mic=document.getElementById(`${kind}Mic`),status=document.getElementById(`${kind}Status`),limit=RECORD_RULES[kind].max;
      mic?.classList.add('live');if(mic)mic.textContent='停止';if(status)status.textContent='正在录音与识别…';
      timer=setInterval(()=>{seconds++;const el=document.getElementById(`${kind}Timer`);if(el)el.textContent=`${fmt(seconds)} / ${fmt(limit)}`;if(seconds>=limit&&recorder?.state==='recording')recorder.stop()},1000);
      event('record_start',{kind});
    }catch{audioStream?.getTracks().forEach(track=>track.stop());if(kind==='final'){stopCameraPreview();state.cameraEnabled=false;persist()}toast('麦克风或摄像头没有开启；请允许权限，或改选“仅录声音”。')}
  }
  function startRecognition(SR){
    recognition=new SR();recognition.lang='zh-CN';recognition.continuous=true;recognition.interimResults=true;
    recognition.onresult=e=>{transcript=Array.from(e.results).map(r=>r[0].transcript).join('').trim();const el=document.getElementById(`${recordKind}Transcript`);if(el){el.textContent=transcript||'正在听…';el.classList.toggle('empty',!transcript)}};
    recognition.onerror=e=>{if(!['no-speech','aborted'].includes(e.error))toast('语音识别中断，请重新录音。')};
    recognition.onend=()=>{if(recorder?.state==='recording')try{recognition.start()}catch{}};
    try{recognition.start()}catch{}
  }
  async function finishRecording(stream){
    clearInterval(timer);recognition?.stop();stream.getTracks().forEach(t=>t.stop());
    const kind=recordKind,duration=seconds,blob=new Blob(chunks,{type:recorder.mimeType||(recordingHasVideo?'video/webm':'audio/webm')}),key=`green-${kind}-${Date.now()}`;
    await saveBlob(key,blob);state.voice[kind]={text:transcript.trim(),mediaKey:key,seconds:duration,bytes:blob.size,video:recordingHasVideo};
    if(kind==='final'){state.final.feedback='';state.voice.revision=blankVoice();stopCameraPreview();state.cameraEnabled=false}if(kind==='correction')state.editorDraft='';
    event('record_stop',{kind,seconds:duration,video:recordingHasVideo,passed:assessVoice(kind,state.voice[kind]).pass});recorder=null;recognition=null;recordKind='';recordingHasVideo=false;render();
  }
  function db(){return new Promise((ok,no)=>{const r=indexedDB.open('green_story_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
  async function saveBlob(k,b){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('media','readwrite');t.objectStore('media').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
  async function loadBlob(k){if(!k)return null;const d=await db();return new Promise((ok,no)=>{const r=d.transaction('media').objectStore('media').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
  async function renderVoicePlayback(kind){const target=document.getElementById(`${kind}Playback`),rec=voiceSlot(kind),key=rec.mediaKey;if(!target||!key)return;const blob=await loadBlob(key);if(blob){const url=URL.createObjectURL(blob);target.innerHTML=rec.video?`<video controls playsinline preload="metadata" src="${url}"></video>`:`<audio controls preload="metadata" src="${url}"></audio>`}}
  function download(){const record={...state,task:{title:'5000美元，5万棵树',level:'ACTFL IH-AL',listening:state.listening,facts:state.opened,heardFacts:state.heardFacts,factQuestions:state.factQuestions,dialogue:state.history,omissions:state.omissions,audience:state.audience,shots:state.shots},exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.download=`${state.participant||'participant'}-green-story.json`;a.click();URL.revokeObjectURL(a.href)}
  render();
  </script>
