    organize:'如果我要讲清这段故事，我会先说1985年：殷玉珍来到毛乌素，第一批600棵树苗只活下不到10棵。然后说1999年，赛考斯从电视上看到她的故事，并募款5000美元。2000年两人见面、一起种树。最后回到2026年：他们时隔26年重逢。这样，听众能看见一个故事怎样从失败走到重逢。',

  const CHAPTERS={
    one:{index:1,kicker:'1985—1986 · 来到毛乌素',title:'她面对的不是空地，是会移动的沙',image:'A',prediction:'只看画面，你觉得最难解决的会是什么？',predictions:['流沙每天都在移动','树苗很难运进沙地','不知道怎样提高成活率'],audio:'1985年，19岁的殷玉珍来到毛乌素沙地。她住的土房半埋在沙里，风沙一夜就能把门堵住。第二年，她卖掉一只羊，换回600棵树苗。可是，一场大风以后，活下来的不到10棵。她没有停。她和丈夫用铁锹、扁担和钢钎，把树苗一捆一捆背进沙地，又慢慢学会先固定流沙，再种灌木和乔木。',questions:[{kind:'泛听',q:'第一次种树失败以后，殷玉珍怎么做？',options:['她等待道路和机械完善','她调整方法，继续治沙','她停止种树，离开沙地'],correct:'她调整方法，继续治沙'},{kind:'精听',q:'关于她最初的生活和种树，哪一项正确？',options:['第一批树苗全部成活','她住在城市，每天开车去植树','土房会被沙堵住，600棵树苗不到10棵成活'],correct:'土房会被沙堵住，600棵树苗不到10棵成活'},{kind:'精听',q:'她后来学会怎样种树？',options:['先固定流沙，再种灌木和乔木','只增加树苗数量，不改变方法','等风沙停止以后再开始'],correct:'先固定流沙，再种灌木和乔木'}],reveal:'殷玉珍第一次种树失败后，没有放弃，而是调整方法继续治沙。'},
    two:{index:2,kicker:'1999—2000 · 电视报道带来的联系',title:'一份善意，进入一个已经持续14年的故事',image:'C',prediction:'如果你从电视里看到殷玉珍的治沙故事，你最想先确认哪个事实？',predictions:['她从什么时候开始治沙','赛考斯怎样筹到5000美元','2000年他们在哪里见面'],audio:'1999年，来华任教的美国教育工作者赛考斯从电视报道里看见殷玉珍的治沙经历。他给多个机构发电子邮件，最终通过基金会筹集5000美元。殷玉珍只留下一张美元作纪念，其余都用来买树苗。2000年春天，赛考斯来到毛乌素，两人见面并共同种下一棵树。那时，殷玉珍已经治沙大约14年。',questions:[{kind:'泛听',q:'赛考斯为殷玉珍做了什么？',options:['他负责规划当地治沙工程','他到毛乌素以后才认识她','他筹款支持她治沙'],correct:'他筹款支持她治沙'},{kind:'精听',q:'赛考斯怎样知道殷玉珍的故事？',options:['从电视报道中看到','在毛乌素偶然遇见','从一本教材中读到'],correct:'从电视报道中看到'},{kind:'精听',q:'关于5000美元和两人的见面，哪一项正确？',options:['钱被全部保存下来作纪念','钱用于买树苗；见面时她已治沙约14年','两人见面以后才开始筹款'],correct:'钱用于买树苗；见面时她已治沙约14年'}],reveal:'赛考斯的捐款，支持的是殷玉珍已经坚持了约14年的治沙行动。'},

    survival:{era:'1980年代',title:'从“生存”理解个人行动',image:'A',text:'井背塘是毛乌素沙地深处的一个地名。1985年，那里没有公路和电。殷玉珍住的土房会被风沙堵门，树苗要靠人背进沙地。',audio:'时代镜头一。井背塘是毛乌素沙地深处的一个地方。1985年，那里没有公路和电。殷玉珍住的土房会被风沙堵门，树苗要靠人背进沙地。'},

  function renderTime(){const revealed=!!state.prediction,heard=state.listening.played>0;panel.innerHTML=`<p class="eyebrow">时间跳转 · 听力与预测</p><h2>钱会花完。故事会结束吗？</h2><div class="listen-gate"><h3>听力任务：捐款发生时，她已经治沙多久？</h3><div class="row"><button class="quiet" id="listenStory">▶ ${heard?'再听一次':'播放材料'}</button><button class="quiet" id="listenSlow">▶ 慢速播放</button></div><div class="choices">${[['不到一年','不到一年'],['大约14年','大约十四年'],['26年','二十六年']].map(([value,label])=>`<button class="choice ${state.listening.answer===value?'selected':''}" data-listen-answer="${value}" ${heard?'':'disabled'}>${label}</button>`).join('')}</div><div class="listen-status" id="listenStatus">${state.listening.correct?'✓ 听力答案正确。':heard&&state.listening.answer?'答案还不对，请再听一次。':'必须先完整播放材料，答案按钮才会开启。'}</div></div><div class="numbers"><div class="number"><b>$5,000</b><small>1999年的支持</small></div><div class="operator">+</div><div class="number"><b>26年</b><small>时间继续</small></div><div class="operator">=</div><div class="number reveal ${revealed?'':'hidden'}"><b>50,000+</b><small>树与一次重逢</small></div></div><div class="promptbox"><strong>在揭晓以前，选择你的预测。</strong><div class="choices">${['钱花完以后，影响很快消失','有些树活下来，但两人不会再联系','树木继续生长，这份关系也可能被重新找到'].map(x=>`<button class="choice ${state.prediction===x?'selected':''}" data-predict="${x}">${x}</button>`).join('')}</div>${revealed?'<img class="time-reveal-image" src="/assets/green-story-2026-v2.webp" alt="教学生成场景：二十六年后的重逢"><div class="callout"><p><b>揭晓：</b>当年用捐款购买、栽种的一批树苗后来长成5万多棵树。2026年，两人重新联系并再次种下一棵树。</p></div>':''}<button class="primary" id="timeNext" ${revealed&&state.listening.correct?'':'disabled'}>去调查钱、人和时间</button></div>`;const play=rate=>{document.getElementById('listenStory').disabled=true;document.getElementById('listenSlow').disabled=true;document.getElementById('listenStatus').textContent='正在播放；完整听完后答案才会开启。';speak(LISTENING_PASSAGE,rate,()=>{state.listening.played++;persist();renderTime()})};document.getElementById('listenStory').onclick=()=>play(.9);document.getElement   function renderEvidence(){const active=state.activeFact||state.opened.at(-1),heardCount=state.opened.filter(id=>state.heardFacts.includes(id)).length;panel.innerHTML=`<p class="eyebrow">调查 · 先问，再听，再读</p><h2>用口头问题打开事实</h2><p class="lead">不能输入文字。至少录制三个不同问题，打开三张事实卡；每张卡必须先听完整材料，文字才会出现。</p>${voiceBox('fact','新的调查问题','至少4秒；问题必须指向时间、捐款、见面、长期治沙或重逢。')}<button class="primary" id="askFact">用这段录音提出问题</button><div class="evidence-layout" style="margin-top:24px"><div class="evidence-list">${Object.keys(FACTS).map(id=>`<button class="evidence ${state.opened.includes(id)?'':'locked'} ${active===id?'active':''}" data-fact="${id}" ${state.opened.includes(id)?'':'disabled'}><small>${id}</small><span>${state.opened.includes(id)?FACTS[id].year:'未开放'}</span></button>`).join('')}</div><div class="evidence-view">${active?factView(active):'<p class="empty">录制第一个问题，打开一张与问题相关的事实卡。</p>'}</div></div><div class="row" style="margin-top:18px"><button class="primary" id="evidenceNext" ${state.opened.length>=3&&heardCount>=3?'':'disabled'}>带着证据进入角色对话</button><span class="small">已口头提问 ${state.factQuestions.length} 次 · 已听 ${heardCount}/3 张</span></div>`;bindVoice('fact');document.getElementById('askFact').onclick=()=>{const c=assessVoice('fact');if(!c.pass)return toast(c.msg);if(!unlockFromVoice())return toast('请把问题说得更具体，并指向一张尚未开放的事实卡');renderEvidence()};panel.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>{state.activeFact=b.dataset.fact;persist();renderEvidence()});const listen=document.getElementById('listenFact');if(listen)listen.onclick=()=>{const id=listen.dataset.id;listen.disabled=true;const status=document.getElementById('factListenStatus');if(status)status.textContent='正在播放；完整听完后才显示文字。';speak(`${FACTS[id].year}。${FACTS[id].title}。${FACTS[id].text}`,.84,()=>{if(!state.heardFacts.includes(id))state.heardFacts.push(id);event('fact_listen',{id});persist();renderEvidence()})};document.getElementById('evidenceNext').onclick=advance}

  function renderReframe(){const opts=[['A','遗漏了故事在1985年已经开始'],['D','遗漏了长期行动、技术和治理'],['E','遗漏了26年后的寻找与重逢'],['B','遗漏了善意来自看见他人的行动']];panel.innerHTML=`<p class="eyebrow">AI国际编辑 · 合理但片面</p><h2>事实没有错，故事就准确吗？</h2><div class="headline-card"><small>面向美国校园媒体的第一稿</small><div class="bad">American Teacher's $5,000 Turned a Chinese Desert Green</div><p>美国教师的5000美元让中国沙漠变绿</p></div><p class="lead">选择至少两项关键遗漏，然后用12—45秒录音解释这个标题会造成什么误解。</p><div class="omissions">${opts.map(([id,t])=>`<button class="omission ${state.omissions.includes(id)?'selected':''}" data-omit="${id}">${t}</button>`).join('')}</div>${voiceBox('correction','口头纠正片面标题','至少12秒；说明一个误解，并加入时间或数字证据。')}<div class="row"><button class="primary" id="reviseBtn">把录音交给AI编辑</button></div>${state.editorDraft?`<div class="draft"><b>第二稿</b>\n${esc(state.editorDraft)}</div><button class="primary" id="reframeNext" style="margin-top:16px">选择镜头，重新讲述</button>`:''}`;panel.querySelectorAll('[data-omit]').forEach(b=>b.onclick=()=>{const id=b.dataset.omit;state.omissions=state.omissions.includes(id)?state.omissions.filter(x=>x!==id):[...state.omissions,id];persist();renderReframe()});bindVoice('correction');document.getElementById('reviseBtn').onclick=async()=>{const c=assessVoice('correction');if(state.omissions.length<2)return toast('请先选择至少两项遗漏');if(!c.pass)return toast(c.msg);const correction=voiceSlot('correction').text;state.editorDraft=await askAI('green_editor',`遗漏：${state.omissions.join('、')}。学习者口头纠正：${correction}`,[]);event('editor_revised',{omissions:state.omissions});renderReframe()};if(document.getElementById('reframeNext'))document.getElementById('reframeNext').onclick=advance}
  function audiencePrompt(){if(!state.shots.length)return'选择三个镜头以后，系统会模拟美国受众可能形成的理解。';const miss=[];if(!state.shots.includes('A'))miss.push('观众可能把1999年当成故事起点');if(!state.shots.includes('D'))miss.push('观众可能把捐款误解为森林形成的唯一原因');if(!state.shots.some(x=>['E','F'].includes(x)))miss.push('观众可能不知道这段关系为什么在今天仍重要');return miss.length?miss.join('；'):'三个镜头已经覆盖起点、长期行动与今天。现在用语言把因果边界讲清楚。'}
  const compactPinyin=value=>String(value||'').replace(/\s+/g,'');
  function annotationCard(word,pinyin,english,example){return`<span class="annotation-label">ANNOTATE · 划词注释</span><div class="annotation-word">${esc(word)}</div><div class="annotation-pinyin">${esc(compactPinyin(pinyin))}</div><div class="annotation-english">${esc(english)}</div><p class="annotation-example"><b>例句</b><br>${esc(example)}</p>`}
  function parseAnnotation(reply,word){
    const read=label=>String(reply||'').split(/\r?\n/).find(x=>x.trim().startsWith(`${label}：`))?.split('：').slice(1).join('：').trim()||'';
    return{word:read('词语')||word,pinyin:compactPinyin(read('拼音'))||'—',english:read('英文')||'selected expression',example:read('例句')||`请结合听力材料理解“${word}”。`};
  }
  async function fetchAnnotation(word){
    const exact=ANNOTATION_GLOSSARY[word];
    if(exact)return{word,pinyin:exact[0],english:exact[1],example:exact[2]};
    const contained=Object.keys(ANNOTATION_GLOSSARY).sort((a,b)=>b.length-a.length).find(x=>word.includes(x));
    if(contained){const x=ANNOTATION_GLOSSARY[contained];return{word:contained,pinyin:x[0],english:x[1],example:x[2]}}
    try{
      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6500);
      const r=await fetch('/api/chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:'green_annotate',message:word,history:[]})});
      clearTimeout(timeout);if(!r.ok)throw 0;return parseAnnotation((await r.json()).reply,word);
    }catch{return{word,pinyin:'—',english:'selected expression',example:`请结合听力材料理解“${word}”。`}}
  }
  function chapterTitleMarkup(title){

    return`<span class="chapter-title-line">${lead}</span><span class="chapter-title-line">${tail}</span>`;
  }

  function bindTranscriptAnnotation(){

    const annotate=async()=>{const selection=window.getSelection();if(!selection||selection.isCollapsed)return;const anchor=selection.anchorNode,focus=selection.focusNode;if(!transcriptEl.contains(anchor)||!transcriptEl.contains(focus))return;const selected=(selection.toString().match(/[\u3400-\u9fff]{1,8}/)||[])[0];if(!selected)return;annotationEl.classList.add('loading');annotationEl.innerHTML=`<div class="annotation-empty">正在注释“${esc(selected)}”…</div>`;const data=await fetchAnnotation(selected);annotationEl.classList.remove('loading');annotationEl.innerHTML=annotationCard(data.word,data.pinyin,data.english,data.example);event('transcript_annotated',{word:data.word})};

    panel.innerHTML=`<p class="eyebrow">可选挑战 · OPTIONAL</p><h2 class="beat-title">BEAT THE AI · 打败 AI</h2><p class="lead beat-lead">如果你愿意，可以挑战自己。你的 60 秒完整讲述已经完成，下面的任务不影响完成状态。</p><img class="final-image" src="${STORY_IMAGES.G}" alt="毛乌素恢复后的林海教学生成场景"><section class="final-coach"><p class="encouragement"><b>第一轮完成，很棒。</b> 你已经用中文讲满一分钟。现在可以选择一个方向，看看 AI 如何组织同一个故事，再决定是否挑战自己的第二版。</p><div class="playback" id="finalPlayback"></div><section class="pk-section"><p class="eyebrow">可选挑战 · CHOOSE ONE</p><h3>你想从哪一点学起？</h3><div class="pk-patterns">${focusOptions.map(([id,title,copy],index)=>`<button class="pk-pattern ${focus===id?'selected':''}" data-pk-focus="${id}" aria-pressed="${focus===id}"><b>${String.fromCharCode(65+index)} · ${title}</b><span>${copy}</span></button>`).join('')}</div><div class="row"><button class="primary" id="challengeAI" ${focus?'':'disabled'}>${model?'重新生成这项挑战':'看看AI怎么讲'}</button><button class="quiet" id="skipAI">跳过挑战，结束体验</button></div></section>${model?`<section class="pk-section"><p class="eyebrow">AI 范例</p><div class="row" style="margin-bottom:14px"><button class="primary" id="listenModel">▶ 听AI讲述范例</button><span class="small">范例已按“${esc(focusOptions.find(item=>item[0]===focus)?.[1]||'组织表达')}”和${audienceLabel}调整。</span></div><div class="model-story"><p>${esc(model)}</p></div><h3 style="margin-top:24px">AI用了哪些办法？点击你发现的地方</h3><div class="pk-patterns">${patterns.map(([id,title,copy])=>`<button class="pk-pattern ${state.final.pkNoticed.includes(id)?'selected':''}" data-pk-pattern="${id}" aria-pressed="${state.final.pkNoticed.includes(id)}"><b>${title}</b><span>${copy}</span></button>`).join('')}</div><p class="small">已找到 ${state.final.pkNoticed.length}/4 个表达办法。找到一两个就可以进入下一轮。</p></section>`:''}<section class="pk-retry" id="pkRetry"><p class="eyebrow">再录一版 · OPTIONAL</p><h3>如果愿意，再录一次</h3><p class="small">自愿录制30–180秒。</p>${voiceBox('retry','我的第二版讲述','至少30秒；让时间线、转折、重点或听众意识中的一项比第一版更清楚。')}${retry.mediaKey?'<p class="feedback"><b>第二版已保存。</b> 现在分别听第一版和第二版，找出变清楚的一处。     renderVoicePlayback('final');

    panel.querySelectorAll('[data-pk-focus]').forEach(button=>button.onclick=()=>{state.final.pkFocus=button.dataset.pkFocus;state.final.modelStory='';state.final.modelFocus='';state.final.pkNoticed=[];persist();renderKeepingScroll()});

  function showHints(){const key=['enter','pre','scene','time','evidence','interact','reframe','tell','reflect'][state.index],items=HINTS[key]||['先说出你已经知道的事实，再提出一个问题。'],level=Math.min((state.hintLevel?.[key]||1),items.length);const old=document.querySelector('.hint-modal');if(old)old.remove();const wrap=document.createElement('div');wrap.className='hint-modal';wrap.style='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px';wrap.innerHTML=`<div style="width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px"><h3>给我一点提示</h3>${items.slice(0,level).map((x,i)=>`<div class="hint-level"><small>第 ${i+1} 层</small><p>${x}</p></div>`).join('')}<div class="row" style="margin-top:16px">${level<items.length?'<button class="quiet" id="moreHint">再给一点</button>':''}<button class="primary" id="closeHint">继续任务</button></div></div>`;document.body.appendChild(wrap);document.getElementById('closeHint').onclick=()=>wrap.remove();if(document.getElementById('moreHint'))document.getElementById('moreHint').onclick=()=>{state.hintLevel=state.hintLevel||{};state.hintLevel[key]=level+1;event('hint_open',{stage:key,level:level+1});wrap.remove();showHints()}}
  async function askAI(stage,message,history){try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6000),r=await fetch('/api/chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,message,history,evidence:state.opened,omissions:state.omissions,audience:state.audience,shots:state.shots})});clearTimeout(timeout);if(!r.ok)throw 0;return(await r.json()).reply}catch{if(stage==='green_editor')return'第二稿：一份跨国善意怎样进入中国治沙人的长期行动。1999年的5000美元帮助购买树苗，但故事早在1985年已经开始，森林也来自此后二十多年的坚持、技术和治理。';if(stage==='green_plan_feedback')return'正式讲述时先交代1985年的治沙起点，再说1999年的帮助；用“支持了树苗，但没有单独造成森林”收住因果。';if(stage==='green_model_story')return'如果我要把这个故事讲给美国大学生，我会从1985年说起。那一年，殷玉珍开始在毛乌素沙地治沙。最早栽下的600棵树苗只活了不到10棵，但她没有放弃。1999年，美国教育工作者赛考斯从电视上知道了她的故事，并通过机构募款5000美元。第二年，两人见面，也一起种下一棵树。这笔钱帮助购买和栽种了一批树苗，后来长成5万多棵树。不过，森林并不是一笔捐款单独创造的，它也来自殷玉珍几十年的坚持、技术积累和更大的治理实践。2026年，两人时隔26年重逢。这个故事让我看到，善意很重要，而长期行动让善意真正扎下了根。';return'这笔钱有真实作用，但为什么不能把整片森林都写成它的功劳？请用一个更早的时间证据说明。'}}
  let narrationContext=null,activeNarration=null,cameraPreviewStream=null,recordingHasVideo=false;
  function splitSpeechText(text,max=110){
    const sentences=String(text||'').match(/[^。！？!?；;\n]+[。！？!?；;]?/g)||[String(text||'')],chunks=[];let current='';
    sentences.forEach(sentence=>{let part=sentence.trim();while(part.length>max){if(current){chunks.push(current);current=''}chunks.push(part.slice(0,max));part=part.slice(max)}if(!part)return;if(current&&current.length+part.length>max){chunks.push(current);current=''}current+=part});
    if(current)chunks.push(current);return chunks;
  }
  async function speak(text,rate=.92,onend,role='alex',onerror){
    speechSynthesis.cancel();if(activeNarration){try{activeNarration.stop()}catch{}activeNarration=null}
    try{
      const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)throw new Error('audio-context');
      narrationContext=narrationContext||new AudioEngine();if(narrationContext.state==='suspended')await narrationContext.resume();
      const chunks=splitSpeechText(text),responses=await Promise.all(chunks.map(async chunk=>{const response=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,text:chunk,speed:rate<.8?-1:0})}),voice=response.headers.get('X-Role-Voice')||'unknown';if(!response.ok||!voice.startsWith('tencent-'))throw new Error('tencent-unavailable');return{voice,buffer:await response.arrayBuffer()}}));
      const decoded=await Promise.all(responses.map(item=>narrationContext.decodeAudioData(item.buffer))),playChunk=index=>{const source=narrationContext.createBufferSource();source.buffer=decoded[index];source.connect(narrationContext.destination);activeNarration=source;source.onended=()=>{if(index+1<decoded.length)return playChunk(index+1);activeNarration=null;if(onend)onend()};source.start()};
      event('tts_play',{voice:responses[0]?.voice||'tencent',slow:rate<.8,chunks:decoded.length});playChunk(0);
    }catch{
      if('speechSynthesis'in window){
        const fallback=new SpeechSynthesisUtterance(text);fallback.lang='zh-CN';fallback.rate=rate;fallback.pitch=1;
        fallback.onend=()=>{event('tts_play',{voice:'browser-zh-CN',slow:rate<.8,fallback:true});if(onend)onend()};
        fallback.onerror=()=>{toast('语音暂时无法播放，请稍后重试。');if(onerror)onerror()};
        speechSynthesis.speak(fallback);toast('已自动切换为浏览器中文语音。');return;
      }
      toast('语音暂时无法播放，请稍后重试。');if(onerror)onerror()
    }
  }
  const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  function stopCameraPreview(){if(cameraPreviewStream)cameraPreviewStream.getTracks().forEach(track=>track.stop());cameraPreviewStream=null}
  function attachCameraPreview(){const video=document.getElementById('cameraPreview');if(video&&cameraPreviewStream){video.srcObject=cameraPreviewStream;video.play().catch(()=>{})}}
  async function setCameraMode(enabled){
    if(!enabled){stopCameraPreview();state.cameraEnabled=false;event('camera_choice',{enabled:false});render();return}
    if(!navigator.mediaDevices?.getUserMedia)return toast('当前浏览器不能打开摄像头，请选择“仅录声音”。');
    try{
      stopCameraPreview();
      cameraPreviewStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
      state.cameraEnabled=true;event('camera_choice',{enabled:true});render();
    }catch{state.cameraEnabled=false;persist();toast('摄像头没有开启。你仍可选择“仅录声音”完成任务。');render()}
  }
  async function toggleRecording(kind){
    if(recorder?.state==='recording'){recorder.stop();return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')return toast('请使用最新版 Chrome 或 Edge，并允许麦克风权限。');
    let audioStream=null;
    try{
      speechSynthesis.cancel();
      audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      let stream=audioStream;recordingHasVideo=false;
      if(kind==='final'&&state.cameraEnabled){
        if(!cameraPreviewStream?.getVideoTracks().some(track=>track.readyState==='live'))cameraPreviewStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
        stream=new MediaStream([...cameraPreviewStream.getVideoTracks(),...audioStream.getAudioTracks()]);recordingHasVideo=true;
      }
      const mic=document.getElementById(`${kind}Mic`);for(let n=3;n>0;n--){if(mic)mic.textContent=String(n);await new Promise(resolve=>setTimeout(resolve,650))}
      const candidates=recordingHasVideo?['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']:['audio/webm;codecs=opus','audio/webm'],mimeType=candidates.find(x=>MediaRecorder.isTypeSupported(x));
      chunks=[];transcript='';seconds=0;recordKind=kind;recorder=new MediaRecorder(stream,mimeType?{mimeType,videoBitsPerSecond:recordingHasVideo?2500000:undefined,audioBitsPerSecond:128000}:undefined);
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>finishRecording(stream);recorder.start(250);if(SR&&kind!=='final'&&kind!=='retry')startRecognition(SR);
      const status=document.getElementById(`${kind}Status`),limit=RECORD_RULES[kind].max;
      mic?.classList.add('live');if(mic)mic.textContent='停止';if(status)status.textContent=kind==='final'||kind==='retry'?'正在录音…':'正在录音与识别…';
      timer=setInterval(()=>{seconds++;const el=document.getElementById(`${kind}Timer`);if(el)el.textContent=kind==='final'?`${fmt(seconds)} · 至少 ${fmt(MIN_SECONDS.final)}`:`${fmt(seconds)} / ${fmt(limit)}`;if(kind!=='final'&&seconds>=limit&&recorder?.state==='recording')recorder.stop()},1000);
      event('record_start',{kind});
    }catch{audioStream?.getTracks().forEach(track=>track.stop());if(kind==='final'){stopCameraPreview();state.cameraEnabled=false;persist()}toast('麦克风或摄像头没有开启；请允许权限，或改选“仅录声音”。')}
  }
  function startRecognition(SR){
    recognition=new SR();recognition.lang='zh-CN';recognition.continuous=true;recognition.interimResults=true;
    const normalize=text=>String(text||'').replace(/抑郁症/g,'殷玉珍').replace(/木块/g,'募款').replace(/制沙|治砂|治莎|智沙/g,'治沙').replace(/赛考斯基|塞考斯|赛科斯/g,'赛考斯');
    recognition.onresult=e=>{transcript=normalize(Array.from(e.results).map(r=>r[0].transcript).join('')).trim();const el=document.getElementById(`${recordKind}Transcript`);if(el){el.textContent=transcript||'正在听…';el.classList.toggle('empty',!transcript)}};
    recognition.onerror=e=>{if(!['no-speech','aborted'].includes(e.error))toast('语音识别中断，请重新录音。')};
    recognition.onend=()=>{if(recorder?.state==='recording')try{recognition.start()}catch{}};
    try{recognition.start()}catch{}
  }
  async function finishRecording(stream){
    clearInterval(timer);recognition?.stop();stream.getTracks().forEach(t=>t.stop());
    const kind=recordKind,duration=seconds,blob=new Blob(chunks,{type:recorder.mimeType||(recordingHasVideo?'video/webm':'audio/webm')}),key=`green-${kind}-${Date.now()}`;
    const stored=await saveBlob(key,blob);state.voice[kind]={text:transcript.trim(),mediaKey:key,seconds:duration,bytes:blob.size,video:recordingHasVideo};if(!stored)toast('录音已保存于当前页面；请在刷新前继续完成或导出记录。');
    if(kind==='outline'){state.final.feedback='';state.voice.final=blankVoice();stopCameraPreview();state.cameraEnabled=false}if(kind==='final'){stopCameraPreview();state.cameraEnabled=false}if(kind==='correction')state.editorDraft='';
    event('record_stop',{kind,seconds:duration,video:recordingHasVideo,passed:assessVoice(kind,state.voice[kind]).pass});recorder=null;recognition=null;recordKind='';recordingHasVideo=false;if(kind==='retry')renderKeepingScroll();else render();
  }
  function db(){return new Promise((ok,no)=>{const r=indexedDB.open('green_story_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
  async function saveBlob(k,b){try{const d=await db();await new Promise((ok,no)=>{const t=d.transaction('media','readwrite');t.objectStore('media').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)});return true}catch{volatileMedia.set(k,b);return false}}
  async function loadBlob(k){if(!k)return null;try{const d=await db();return await new Promise((ok,no)=>{const r=d.transaction('media').objectStore('media').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch{return volatileMedia.get(k)||null}}
  async function renderVoicePlayback(kind){const target=document.getElementById(`${kind}Playback`),rec=voiceSlot(kind),key=rec.mediaKey;if(!target||!key)return;const blob=await loadBlob(key);if(blob){const url=URL.createObjectURL(blob);target.innerHTML=rec.video?`<video controls playsinline preload="metadata" src="${url}"></video>`:`<audio controls preload="metadata" src="${url}"></audio>`}}
  function download(){const record={...state,task:{title:'5000美元，5万棵树',level:'ACTFL IH-AL',listening:state.listening,facts:state.opened,heardFacts:state.heardFacts,factQuestions:state.factQuestions,dialogue:state.history,omissions:state.omissions,audience:state.audience,shots:state.shots},exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.download=`${state.participant||'participant'}-green-story.json`;a.click();URL.revokeObjectURL(a.href)}
