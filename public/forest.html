    .headline-card{padding:34px;border:1px solid #72564b;background:#211714;border-radius:var(--radius);margin:24px 0}.headline-card .bad{font-size:clamp(30px,5vw,58px);line-height:1.04;letter-spacing:-.045em;margin:12px 0}.headline-card p{color:#d4bbb2}.omissions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.omission{padding:15px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);text-align:left}.omission.selected{border-color:var(--green);background:#24311f}.draft{margin-top:20px;padding:22px;border:1px solid var(--green);border-radius:var(--radius);background:#172016;white-space:pre-line;line-height:1.8}
    .audiences{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.shot{position:relative;min-height:155px;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);text-align:left}.shot b{display:block;font-size:18px;margin:8px 0}.shot small{color:var(--sand)}.shot.selected{border-color:var(--green);background:#23301f}.shot:disabled:not(.selected){opacity:.4}.story-stage{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.recordbox{padding:26px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}.recordrow{display:flex;align-items:center;gap:14px}.timer{font-variant-numeric:tabular-nums;color:var(--green);font-weight:800}.playback audio{width:100%;margin-top:14px}.feedback{padding:20px;border-radius:var(--radius);background:#24311f;margin-top:16px;color:#e2f1d3}

<body>
  <header class="top"><div class="brand"><span class="mark">林</span><div><b>共同种下</b><small>GREEN STORY LAB</small></div></div><nav class="trail" id="trail" aria-label="学习阶段"></nav><div class="top-actions"><button id="hintBtn">提示 <span class="label">Hint</span></button><button id="logoutBtn">退出</button></div></header>
  <div class="shell"><main><section class="panel" id="panel"></section></main><aside id="context"></aside></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
  const STAGES=[['入','进入故事'],['前','任务前判断'],['看','回到1999'],['时','穿过时间'],['证','调查证据'],['问','角色对话'],['改','纠正误读'],['讲','编辑故事'],['思','回看变化']];
  const FACTS={
    A:{year:'1985',title:'故事早已开始',text:'殷玉珍1985年开始治沙。最早的一批600棵树苗只成活不到10棵。她没有停下，而是不断调整固沙、选苗和栽种办法。',why:'这张卡防止观众把1999年的捐款误作故事起点。',keys:'什么时候 开始 多久 以前 1985 14年 起点'},
    B:{year:'1999',title:'一个陌生人的5000美元',text:'来华任教的美国教育工作者罗纳德·萨科尔斯基从电视报道了解到殷玉珍的治沙经历，并通过机构筹集5000美元支持治沙。',why:'这张卡说明跨国善意怎样进入一个已经发生的行动。',keys:'5000 钱 谁 美国 为什么 陌生人 电视 捐款'},
    C:{year:'2000',title:'一起种下一棵树',text:'2000年，两人在毛乌素见面并共同种树。那时殷玉珍已经持续治沙约14年。此后两人失去联系。',why:'这张卡把一笔捐款还原为人与人之间的行动和承诺。',keys:'2000 见面 一起 种树 失去 联系 14年'},
    D:{year:'20多年',title:'钱花完以后',text:'当年用捐款购买、栽种的一批树苗后来长成5万多棵树。长期治沙、技术积累、地方支持和更大的中国治理实践仍然是森林形成的关键背景。',why:'这张卡打破“单一捐款直接造成森林”的简单因果。',keys:'后来 5万 钱花完 技术 治理 三北 中国 社会 森林'},
    E:{year:'2026',title:'为什么还要寻找',text:'2026年5月，殷玉珍通过网络寻找萨科尔斯基。8月，两人时隔26年重逢，重返毛乌素，并再次共同种下一棵树。',why:'这张卡把感谢、记忆、承诺与共同的绿色未来连接起来。',keys:'2026 寻找 重逢 26年 感谢 记忆 现在'}
  };
  const SHOTS=[['A','1985，低成活率','故事在捐款前已经开始'],['B','1999，看到电视报道','善意从看见另一个人的行动开始'],['C','5000美元与树苗','帮助具体进入了什么行动'],['D','钱花完以后','长期行动、技术与治理继续发生'],['E','2026，跨海重逢','一份帮助为什么被记了26年'],['F','再种一棵树','把感谢带向共同的未来']];
  const HINTS={pre:['先说你的第一反应，不必追求正确。','可以用：我觉得……，因为……。','再补一句：但是我还想知道……。'],scene:['词语：陌生人、支持、治沙、成活。','半句：在决定以前，我想知道……。','证据提醒：当时你还不知道后来发生了什么。'],time:['用“可能、也许、如果”表达预测。','半句：我猜这笔钱后来……，因为……。'],evidence:['先问时间：故事什么时候开始？','再问因果：钱做了什么，没有做什么？','最后问意义：为什么26年后还要寻找？'],interact:['先承认帮助的作用。','再说明边界：这笔钱帮助了……，但没有……。','证据结构：在这以前……；后来……；所以……。'],reframe:['标题没有完全说错，但省略了重要事实。','指出两个遗漏：谁、什么行动、什么时间。','半句：如果这样写，读者可能以为……。'],tell:['用三个镜头组成“开始、转折、今天”。','连接词：在这以前、后来、二十多年以后。','结尾：这个故事不只是……，还……。'],reflect:['比较第一版和最后一版中的人物、时间与因果。']};
  const fresh=()=>({version:'green-story-1',index:0,max:0,participant:'',startedAt:new Date().toISOString(),pre:{text:'',mediaKey:''},scene:{choice:'',question:''},prediction:'',opened:[],notes:{},history:[],omissions:[],correction:'',editorDraft:'',audience:'',shots:[],final:{text:'',mediaKey:'',seconds:0,feedback:'',revision:''},events:[]});
  let state=JSON.parse(localStorage.getItem('green_story_state')||'null')||fresh(),recorder=null,chunks=[],recognition=null,transcript='',timer=null,seconds=0,recordKind='';
  const panel=document.getElementById('panel'),context=document.getElementById('context');
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const persist=()=>localStorage.setItem('green_story_state',JSON.stringify(state));
  const event=(type,data={})=>{state.events.push({type,at:new Date().toISOString(),...data});persist()};
  const toast=msg=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)};
  function nav(){document.getElementById('trail').innerHTML=STAGES.map((s,i)=>`<button class="${i===state.index?'active':i<=state.max?'done':''}" ${i>state.max?'disabled':''} data-go="${i}" aria-label="${s[1]}">${s[0]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go))}
  function go(i){if(i>state.max)return;state.index=i;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
  function advance(){state.index=Math.min(STAGES.length-1,state.index+1);state.max=Math.max(state.max,state.index);event('stage_complete',{stage:STAGES[state.index-1]?.[1]});render();window.scrollTo({top:0,behavior:'smooth'})}
  function renderContext(){const opened=state.opened.map(id=>FACTS[id]);context.innerHTML=`<p class="aside-title">你的证据口袋</p><div class="context-card"><h3>${opened.length}/5 张事实卡</h3><div class="fact-pocket">${opened.length?state.opened.map(id=>`<div class="pocket-item"><b>${id} · ${FACTS[id].year}</b><span>${FACTS[id].title}</span></div>`).join(''):'<p class="empty">提出问题后，事实才会进入这里。</p>'}</div></div><div class="context-card"><h3>本任务的AI边界</h3><p>AI只能组合教师审核过的事实。模拟角色不冒充真实人物，不生成未公开的内心活动或私人经历。</p></div><p class="source">学习级别：ACTFL Intermediate High to Advanced Low<br>核心产出：60-90秒证据型中文讲述</p>`}
  function render(){nav();renderContext();[renderEnter,renderPre,renderScene,renderTime,renderEvidence,renderInteract,renderReframe,renderTell,renderReflect][state.index]();bindShared()}
  function bindShared(){document.getElementById('hintBtn').onclick=showHints;document.getElementById('logoutBtn').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/forest-login.html'}}}
  function renderEnter(){panel.innerHTML=`<div class="hero"><div class="hero-copy"><p class="eyebrow">GAI CULTURE TASK · IH TO AL</p><h1>5000美元，5万棵树</h1><p class="lead">一份有限的善意，怎样进入一个已经持续14年的中国治沙故事？</p><div class="statline"><span><b>1999</b><small>一笔捐款</small></span><span><b>26年</b><small>失去联系</small></span><span><b>50,000+</b><small>树木继续生长</small></span></div><div class="row"><input class="field" id="participant" maxlength="40" placeholder="输入课堂编号或姓名" value="${esc(state.participant)}" style="max-width:270px"><button class="primary" id="enterBtn">进入1999</button></div><p class="small" style="margin-top:14px">学习记录和录音保存在本设备，可在结束时导出。</p></div></div>`;document.getElementById('enterBtn').onclick=()=>{const v=document.getElementById('participant').value.trim();if(!v)return toast('请先输入课堂编号或姓名');state.participant=v;event('quest_enter');advance()}}

  function renderReframe(){const opts=[['A','遗漏了故事在1985年已经开始'],['D','遗漏了长期行动、技术和治理'],['E','遗漏了26年后的寻找与重逢'],['B','遗漏了善意来自看见他人的行动']];panel.innerHTML=`<p class="eyebrow">AI国际编辑 · 合理但片面</p><h2>事实没有错，故事就准确吗？</h2><div class="headline-card"><small>面向美国校园媒体的第一稿</small><div class="bad">American Teacher's $5,000 Turned a Chinese Desert Green</div><p>美国教师的5000美元让中国沙漠变绿</p></div><p class="lead">请选择至少两项关键遗漏，再解释这个标题可能让读者产生什么误解。</p><div class="omissions">${opts.map(([id,t])=>`<button class="omission ${state.omissions.includes(id)?'selected':''}" data-omit="${id}">${t}</button>`).join('')}</div><textarea class="field" id="correction" placeholder="这个标题没有完全说错，但是……。如果这样写，读者可能以为……。">${esc(state.correction)}</textarea><div class="row" style="margin-top:14px"><button class="primary" id="reviseBtn">请AI编辑生成第二稿</button></div>${state.editorDraft?`<div class="draft"><b>第二稿</b>\n${esc(state.editorDraft)}</div><button class="primary" id="reframeNext" style="margin-top:16px">选择镜头，重新讲述</button>`:''}`;panel.querySelectorAll('[data-omit]').forEach(b=>b.onclick=()=>{const id=b.dataset.omit;state.omissions=state.omissions.includes(id)?state.omissions.filter(x=>x!==id):[...state.omissions,id];persist();renderReframe()});document.getElementById('reviseBtn').onclick=async()=>{state.correction=document.getElementById('correction').value.trim();if(state.omissions.length<2||!state.correction)return toast('请选择至少两项遗漏并说明误解');state.editorDraft=await askAI('green_editor',`遗漏：${state.omissions.join('、')}。学习者纠正：${state.correction}`,[]);event('editor_revised',{omissions:state.omissions});renderReframe()};if(document.getElementById('reframeNext'))document.getElementById('reframeNext').onclick=advance}
  function audiencePrompt(){if(!state.shots.length)return'选择三个镜头以后，系统会模拟美国受众可能形成的理解。';const miss=[];if(!state.shots.includes('A'))miss.push('观众可能把1999年当成故事起点');if(!state.shots.includes('D'))miss.push('观众可能把捐款误解为森林形成的唯一原因');if(!state.shots.some(x=>['E','F'].includes(x)))miss.push('观众可能不知道这段关系为什么在今天仍重要');return miss.length?miss.join('；'):'三个镜头已经覆盖起点、长期行动与今天。现在用语言把因果边界讲清楚。'}

.onclick=()=>toggleRecording('final');document.getElementById('finalText').oninput=e=>{state.final.text=e.target.value;persist()};document.getElementById('feedbackBtn').onclick=async()=>{state.final.text=document.getElementById('finalText').value.trim();if(!state.final.text&&!state.final.mediaKey)return toast('请先完成讲述或输入提纲');state.final.feedback=await askAI('green_feedback',state.final.text||'学习者已完成录音',[]);event('ai_feedback');renderTell()};if(document.getElementById('revisionText'))document.getElementById('revisionText').oninput=e=>{state.final.revision=e.target.value;persist()};document.getElementById('tellNext').onclick=()=>{state.final.text=document.getElementById('finalText').value.trim();if(!state.audience||state.shots.length!==3)return toast('请选择一种受众和三个镜头');if(!state.final.text&&!state.final.mediaKey)return toast('请先完成60-90秒讲述');event('final_complete',{audience:state.audience,shots:state.shots});advance()};renderPlayback('final')}
  function renderReflect(){const text=state.final.text,signals={时间:/1985|1999|2000|2026|以前|后来|以后/.test(text),证据:/5000|5万|14年|26年/.test(text),因果:/因为|所以|但是|不只是|没有|如果/.test(text),受众:!!state.audience};panel.innerHTML=`<p class="eyebrow">Reflect · 从简单因果到证据叙事</p><h2>你现在怎样讲这个故事？</h2><img class="final-image" src="/assets/green-story-planting.webp" alt="教学生成场景：两双手共同为一棵新树培土"><div class="reflection"><article><small>任务前</small><h3>第一版判断</h3><p>${esc(state.pre.text||'已保存录音')}</p></article><article><small>任务后</small><h3>面向美国受众的版本</h3><p>${esc(state.final.text||'已保存录音')}</p></article></div><div class="change-tags">${Object.entries(signals).map(([k,v])=>`<span class="tag ${v?'on':''}">${k}${v?'已出现':'可继续补充'}</span>`).join('')}</div>${state.final.feedback?`<div class="feedback"><b>AI的一条建议</b><br>${esc(state.final.feedback)}${state.final.revision?`<br><br><b>你的补说</b><br>${esc(state.final.revision)}`:''}</div>`:''}<div class="callout" style="margin-top:24px"><h3>真实故事仍在继续</h3><p>2026年8月，两人重返毛乌素并再次种下一棵树。讲好这个故事，不是把一份善意缩小，也不是把长期治沙隐藏，而是把帮助、坚持、技术、治理与时间之间的关系讲准确。</p></div><div class="row"><button class="primary" id="downloadBtn">导出学习记录</button><button class="quiet" id="restartBtn">开始新任务</button></div><p class="source" style="margin-top:22px">事实来源：<a href="https://www.forestry.gov.cn/c/www/hmgzdt/672108.jhtml" target="_blank" rel="noopener">新华社 / 国家林业和草原局，2026-05-22</a>；<a href="https://www.forestry.gov.cn/c/www/lcdt/685503.jhtml" target="_blank" rel="noopener">人民日报 / 国家林业和草原局，2026-08-24</a>；<a href="https://www.unccd.int/land-and-life/desertification/overview" target="_blank" rel="noopener">UNCCD Desertification Overview</a>。画面为教学生成场景，不是真实人物照片。</p>`;document.getElementById('downloadBtn').onclick=download;document.getElementById('restartBtn').onclick=()=>{if(confirm('确认开始新任务？当前页面状态会被清空。')){state=fresh();persist();render()}}}
  function showHints(){const key=['enter','pre','scene','time','evidence','interact','reframe','tell','reflect'][state.index],items=HINTS[key]||['先说出你已经知道的事实，再提出一个问题。'],level=Math.min((state.hintLevel?.[key]||1),items.length);const old=document.querySelector('.hint-modal');if(old)old.remove();const wrap=document.createElement('div');wrap.className='hint-modal';wrap.style='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px';wrap.innerHTML=`<div style="width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px"><h3>给我一点提示</h3>${items.slice(0,level).map((x,i)=>`<div class="hint-level"><small>第 ${i+1} 层</small><p>${x}</p></div>`).join('')}<div class="row" style="margin-top:16px">${level<items.length?'<button class="quiet" id="moreHint">再给一点</button>':''}<button class="primary" id="closeHint">继续任务</button></div></div>`;document.body.appendChild(wrap);document.getElementById('closeHint').onclick=()=>wrap.remove();if(document.getElementById('moreHint'))document.getElementById('moreHint').onclick=()=>{state.hintLevel=state.hintLevel||{};state.hintLevel[key]=level+1;event('hint_open',{stage:key,level:level+1});wrap.remove();showHints()}}
  async function askAI(stage,message,history){try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6000),r=await fetch('/api/chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,message,history,evidence:state.opened,omissions:state.omissions,audience:state.audience,shots:state.shots})});clearTimeout(timeout);if(!r.ok)throw 0;return(await r.json()).reply}catch{if(stage==='green_editor')return'第二稿：一份跨国善意怎样进入中国治沙人的长期行动。1999年的5000美元帮助购买树苗，但故事早在1985年已经开始，森林也来自此后二十多年的坚持、技术和治理。';if(stage==='green_feedback')return'补充一个边界句：这笔钱帮助了树苗进入沙地，但不能替代长期治沙和治理实践。';return'这笔钱有真实作用，但为什么不能把整片森林都写成它的功劳？请用一个更早的时间证据说明。'}}

  const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  async function toggleRecording(kind){if(recorder?.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')return toast('当前浏览器不支持录音，可以直接输入文字');try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});chunks=[];transcript='';seconds=0;recordKind=kind;recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>finishRecording(stream);recorder.start(250);startRecognition();const mic=document.getElementById(kind==='pre'?'preMic':kind==='talk'?'talkMic':'finalMic');mic?.classList.add('live');const status=document.getElementById('recordStatus');if(status)status.textContent='正在录音';timer=setInterval(()=>{seconds++;const el=document.getElementById('timer');if(el)el.textContent=`${fmt(seconds)} / ${kind==='pre'?'00:45':'01:30'}`;if(seconds>=(kind==='pre'?45:90))recorder?.stop()},1000);event('record_start',{kind})}catch{toast('麦克风没有开启，可以直接输入文字')}}
  function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.lang='zh-CN';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{transcript=Array.from(e.results).map(r=>r[0].transcript).join('');const id=recordKind==='pre'?'preText':recordKind==='talk'?'talkText':'finalText',el=document.getElementById(id);if(el)el.value=transcript};try{recognition.start()}catch{}}
  async function finishRecording(stream){clearInterval(timer);recognition?.stop();stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),key=`green-${recordKind}-${Date.now()}`;await saveBlob(key,blob);if(recordKind==='pre'){state.pre.mediaKey=key;if(transcript)state.pre.text=transcript}else if(recordKind==='final'){state.final.mediaKey=key;state.final.seconds=seconds;if(transcript)state.final.text=transcript}else if(recordKind==='talk'){state.pendingTalk=transcript||document.getElementById('talkText')?.value||''}event('record_stop',{kind:recordKind,seconds});render()}
  function db(){return new Promise((ok,no)=>{const r=indexedDB.open('green_story_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
  async function saveBlob(k,b){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('media','readwrite');t.objectStore('media').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
  async function loadBlob(k){if(!k)return null;const d=await db();return new Promise((ok,no)=>{const r=d.transaction('media').objectStore('media').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
  async function renderPlayback(kind){const target=document.getElementById(kind==='pre'?'prePlayback':'finalPlayback'),key=kind==='pre'?state.pre.mediaKey:state.final.mediaKey;if(!target||!key)return;const blob=await loadBlob(key);if(blob)target.innerHTML=`<audio controls src="${URL.createObjectURL(blob)}"></audio>`}
  function download(){const record={...state,task:{title:'5000美元，5万棵树',level:'ACTFL IH-AL',facts:state.opened,notes:state.notes,dialogue:state.history,omissions:state.omissions,audience:state.audience,shots:state.shots},exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.download=`${state.participant||'participant'}-green-story.json`;a.click();URL.revokeObjectURL(a.href)}
  render();
  </script>
