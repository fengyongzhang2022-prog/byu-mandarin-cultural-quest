    {year:'1978—1999',speaker:'教学微纪录片',role:'narrator',image:'A',title:'毛乌素的十四年',subtitle:'三北工程、毛乌素沙地里的井背塘，以及反复失败后的治沙方法。',audio:'在中国北方，有一片地方叫毛乌素沙地。故事要从1978年说起。那一年，中国启动“三北”防护林工程，开始在东北、华北和西北防风固沙。可是，国家工程落到一个家庭身上，会是什么样子呢？1985年，19岁的殷玉珍来到毛乌素沙地里的井背塘。那里没有公路，也没有电。她住的土房半埋在沙里，一夜风沙就能堵住门。第二年，她和丈夫卖掉家里唯一的一只羊，换回600多棵树苗。他们用铁锹挖坑，用扁担挑水，再用钢钎在硬沙地上打洞。可一场大风过后，活下来的树苗不到10棵。失败了，怎么办？他们没有停，而是一次次重来：先固定流沙，再种灌木和乔木。十四年后，他们已经种出3万多亩林地。也就在那一年，700公里外的洛阳，一位美国教师从电视里看到了她的故事。下一段，我们看看这条远方的消息，后来带来了什么。'},
    {year:'1999—2026',speaker:'教学微纪录片',role:'narrator',image:'C',title:'电视、邮件与5000美元',subtitle:'跨国筹款、共同种树，以及道路修通后持续发生的变化。',audio:'上一段里，赛考斯在电视上看到了殷玉珍。接下来，故事从电视屏幕走进了现实。1999年，他给许多机构发电子邮件，希望为治沙筹款。大约两个月后，他通过一家基金会筹到5000美元。殷玉珍只留下一张美元作纪念，其余的钱都买了树苗。2000年春天，赛考斯来到毛乌素。两个人第一次见面，还一起种下一棵树。后来，他们慢慢失去了联系。但是，治沙没有停。殷玉珍一家继续种树、补苗、护林。2007年，一条8公里长的公路修到她家门口，树苗和工具终于可以用车运进沙地。当地项目也陆续送来苗木和机械。他们一边种，一边看哪些树能活，再不断调整树种和方法。当年用那笔捐款买的树苗，后来长成了5万多棵树。到了2026年，一次重逢又把两个人带回毛乌素。这一次，他们还会一起种树吗？下一段，是真实新闻现场。'},

  const compactPinyin=value=>String(value||'').replace(/\s+/g,'');
  function annotationCard(word,pinyin,english,example){return`<span class="annotation-label">ANNOTATE · 划词注释</span><div class="annotation-word">${esc(word)}</div><div class="annotation-pinyin">${esc(compactPinyin(pinyin))}</div><div class="annotation-english">${esc(english)}</div><p class="annotation-example"><b>例句</b><br>${esc(example)}</p>`}
  function parseAnnotation(reply,word){
    const read=label=>String(reply||'').split(/\r?\n/).find(x=>x.trim().startsWith(`${label}：`))?.split('：').slice(1).join('：').trim()||'';
    return{word:read('词语')||word,pinyin:compactPinyin(read('拼音'))||'—',english:read('英文')||'selected expression',example:read('例句')||`请结合听力材料理解“${word}”。`};
  }
  async function fetchAnnotation(word){
    const exact=ANNOTATION_GLOSSARY[word];
    if(exact)return{word,pinyin:exact[0],english:exact[1],example:exact[2]};
    const contained=Object.keys(ANNOTATION_GLOSSARY).sort((a,b)=>b.length-a.length).find(x=>word.includes(x));
    if(contained){const x=ANNOTATION_GLOSSARY[contained];return{word:contained,pinyin:x[0],english:x[1],example:x[2]}}
    try{
      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6500);
      const r=await fetch('/api/chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:'green_annotate',message:word,history:[]})});
      clearTimeout(timeout);if(!r.ok)throw 0;return parseAnnotation((await r.json()).reply,word);
    }catch{return{word,pinyin:'—',english:'selected expression',example:`请结合听力材料理解“${word}”。`}}
  }
  function chapterTitleMarkup(title){
    const parts=String(title).split('，');
    if(parts.length<2)return esc(title);
    const lead=esc(parts.shift())+'，';
    const tail=esc(parts.join('，')).replace('已经','<wbr>已经').replace('的故事','<wbr>的故事');
    return`<span class="chapter-title-line">${lead}</span><span class="chapter-title-line">${tail}</span>`;

    state.voice[kind]={text:transcript.trim(),mediaKey:key,mediaKeys,segments,seconds:totalSeconds,bytes:(Number(previous.bytes)||0)+blob.size,video:segments.some(item=>item.video),interrupted:segment.interrupted&&totalSeconds<(MIN_SECONDS[kind]||1)};if(!stored)toast('录音已保存于当前页面；请在刷新前继续完成或导出记录。');
    if(kind==='outline'){state.final.feedback='';state.voice.final=blankVoice();stopCameraPreview();state.cameraEnabled=false}if(kind==='final'){stopCameraPreview();state.cameraEnabled=false}if(kind==='correction')state.editorDraft='';
    event('record_stop',{kind,segmentSeconds:duration,totalSeconds,wallSeconds,video:recordingHasVideo,mime,interrupted:segment.interrupted,passed:assessVoice(kind,state.voice[kind]).pass});if(segment.interrupted&&totalSeconds<(MIN_SECONDS[kind]||1))toast(`录音在 ${totalSeconds} 秒处中断。已保存，可从这里继续。`);recorder=null;recognition=null;recordKind='';recordingHasVideo=false;recordingAppend=false;recordingBaseSeconds=0;if(kind==='retry')renderKeepingScroll();else render();
  }
  function db(){return new Promise((ok,no)=>{const r=indexedDB.open('green_story_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
  async function saveBlob(k,b){try{const d=await db();await new Promise((ok,no)=>{const t=d.transaction('media','readwrite');t.objectStore('media').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)});return true}catch{volatileMedia.set(k,b);return false}}
  async function loadBlob(k){if(!k)return null;try{const d=await db();return await new Promise((ok,no)=>{const r=d.transaction('media').objectStore('media').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch{return volatileMedia.get(k)||null}}
  async function renderVoicePlayback(kind){const target=document.getElementById(`${kind}Playback`),rec=voiceSlot(kind),segments=rec.segments?.length?rec.segments:(rec.mediaKey?[{mediaKey:rec.mediaKey,seconds:rec.seconds,video:rec.video}]:[]);if(!target||!segments.length)return;target.replaceChildren();for(let index=0;index<segments.length;index++){const segment=segments[index],blob=await loadBlob(segment.mediaKey);if(!blob||!target.isConnected)continue;const wrap=document.createElement('div');wrap.className='playback-segment';if(segments.length>1){const label=document.createElement('b');label.textContent=`第 ${index+1} 段 · ${fmt(Number(segment.seconds)||0)}`;wrap.appendChild(label)}const media=document.createElement(segment.video?'video':'audio');media.controls=true;media.preload='metadata';if(segment.video)media.playsInline=true;media.src=URL.createObjectURL(blob);wrap.appendChild(media);target.appendChild(wrap)}}
  function download(){const record={...state,task:{title:'5000美元，5万棵树',framework:'ACTFL Proficiency Guidelines 2024 + NCSSFL-ACTFL Can-Do Statements 2026',note:'一次课堂任务提供表现证据，不构成正式熟练度评级。',level:{intermediateHigh:'借助时间线、词汇和句式提示，理解主要信息并完成简短说明',advancedLow:'独立组织段落，跨时间引用事实并说明原因',advancedMid:'比较不同解释，说明证据限制并根据听众调整表达'},modes:{interpretiveCommunication:'听看分段材料，理解跨时间的主要信息和关键细节',presentationalCommunication:'组织短段落和连续讲述，用事实说明原因',interpersonalCommunication:'本版未独立采集持续双向意义协商的表现证据'},storyClaim:state.comprehension.storyClaim,countryFocus:state.countryFocus,causeMap:state.causeMap,causeCriteria:state.causeCriteria,audience:state.audience,contentCriteria:state.final.contentCriteria,shots:state.shots},exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.download=`${state.participant||'participant'}-green-story.json`;a.click();URL.revokeObjectURL(a.href)}
